                                <Stat label="Open QC" value={allOpen} sub={holds>0?`${holds} major or hold`:'nothing major'} tone={allOpen>0?'bg-orange-50 border-orange-200':null}/>
                                <Stat label="Stale items" value={allStale} sub={allStale?'raised against an old rev':'all against current revs'} tone={allStale>0?'bg-amber-50 border-amber-200':null}/>
                                <Stat label="Checked" value={`${checked}/${total}`} sub={`${pct(checked)}% signed`}/>
                                <Stat label="QC reviewed" value={`${qcSigned}/${total}`} sub={`${pct(qcSigned)}% signed`}/>
                            </div>

                            {/* Status ladder — click a rung to filter the table below */}
                            <div className="bg-white border border-slate-200 rounded-lg p-3">
                                <div className="flex items-center justify-between mb-2">
                                    <p className="text-[11px] font-bold uppercase tracking-wide text-slate-400">Where sections stand</p>
                                    {statusFilter!=='all' && <button onClick={()=>setStatusFilter('all')} className="text-[10px] font-semibold text-brand-blue hover:underline">Clear filter</button>}
                                </div>
                                <div className="flex gap-1.5 flex-wrap">
                                    {ladder.map(o=>{
                                        const n = counts[o.value]||0, active = statusFilter===o.value;
                                        return (
                                            <button key={o.value} onClick={()=>setStatusFilter(active?'all':o.value)}
                                                className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-md border text-xs font-semibold transition-colors ${active?'border-brand-blue ring-2 ring-brand-blue':'border-slate-200 hover:border-slate-300'} ${o.color}`}>
                                                {o.label}
                                                <span className="px-1.5 rounded-full bg-white/70 text-[10px] font-bold">{n}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                                {total>0&&(
                                    <div className="mt-2.5 flex h-2 rounded-full overflow-hidden bg-slate-100">
                                        {VISIBLE_STATUS_OPTIONS.map(o=>{
                                            const n=counts[o.value]||0; if(!n) return null;
                                            const bar={draft:'bg-slate-300','for-check':'bg-sky-400',commented:'bg-orange-400',revised:'bg-amber-400',backchecked:'bg-violet-400',approved:'bg-green-500'}[o.value]||'bg-slate-300';
                                            return <div key={o.value} className={bar} style={{width:`${(n/total)*100}%`}} title={`${o.label}: ${n}`}/>;
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* Needs attention */}
                            <div className="bg-white border border-slate-200 rounded-lg p-3">
                                <p className="text-[11px] font-bold uppercase tracking-wide text-slate-400 mb-2">Needs attention</p>
                                {nudges.length===0 ? (
                                    <div className="flex items-center gap-2 text-sm text-green-700 bg-green-50 border border-green-200 rounded px-3 py-2">
                                        <Check className="w-4 h-4 shrink-0"/> Nothing is contradicting itself. Every section's status matches its QC state.
                                    </div>
                                ) : (
                                    <div className="space-y-1.5">
                                        {[...warns, ...infos].map(n=>(
                                            <div key={n.id} className={`flex items-start gap-2 rounded px-2.5 py-1.5 border text-xs ${n.level==='warn'?'bg-amber-50 border-amber-200':'bg-sky-50 border-sky-200'}`}>
                                                {n.level==='warn'
                                                    ? <AlertTriangle className="w-3.5 h-3.5 text-amber-600 shrink-0 mt-0.5"/>
                                                    : <ArrowRight className="w-3.5 h-3.5 text-sky-600 shrink-0 mt-0.5"/>}
                                                <div className="flex-1 min-w-0">
                                                    <button onClick={()=>onJumpSection(n.sid)} className="font-bold text-slate-700 hover:text-brand-blue hover:underline">{n.name}</button>
                                                    <span className="text-slate-600"> — {n.text}</span>
                                                </div>
                                                {n.to && <button onClick={()=>onSetStatus(n.sid, n.to)} className="shrink-0 px-2 py-0.5 text-[10px] font-bold text-white rounded" style={{backgroundColor:'var(--brand-blue)'}}>Set {getStatusStyle(n.to).label}</button>}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Section table */}
                            <div className="bg-white border border-slate-200 rounded-lg overflow-hidden">
                                <div className="px-3 py-2 border-b border-slate-200 flex items-center justify-between">
                                    <p className="text-[11px] font-bold uppercase tracking-wide text-slate-400">Sections{statusFilter!=='all'&&<span className="text-brand-blue"> · {getStatusStyle(statusFilter).label}</span>}</p>
                                    <label className="flex items-center gap-1.5 text-[11px] text-slate-500 cursor-pointer">
                                        <input type="checkbox" checked={onlyOpen} onChange={e=>setOnlyOpen(e.target.checked)} className="accent-slate-600"/> Only sections with open QC
                                    </label>
                                </div>
                                {shown.length===0 ? (
                                    <p className="text-xs text-slate-400 text-center py-8">No sections match that filter.</p>
                                ) : (
                                    <table className="w-full text-xs">
                                        <thead className="bg-slate-50 text-slate-400 text-[10px] uppercase tracking-wide">
                                            <tr>
                                                <th className="text-left font-semibold px-3 py-1.5">Section</th>
                                                <th className="text-left font-semibold px-2 py-1.5 w-14">Rev</th>
                                                <th className="text-left font-semibold px-2 py-1.5 w-40">Status</th>
                                                <th className="text-left font-semibold px-2 py-1.5 w-24">QC</th>
                                                <th className="text-left font-semibold px-2 py-1.5 w-24">Signed</th>
                                                <th className="text-left font-semibold px-2 py-1.5 w-20">Idle</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {shown.map(r=>{
                                                const st = getStatusStyle(r.f.status||'draft');
                                                return (
                                                    <tr key={r.f.id} className="border-t border-slate-100 hover:bg-slate-50">
                                                        <td className="px-3 py-1.5">
                                                            <button onClick={()=>onJumpSection(r.f.id)} className="text-left font-semibold text-slate-700 hover:text-brand-blue hover:underline">
                                                                <span className="font-mono text-slate-400 mr-1.5">{r.f.sectionLabel}</span>{r.f.sectionTitle||r.f.name||'Untitled'}
                                                            </button>
                                                            {!r.hasPdf && <span className="ml-1.5 text-[9px] font-bold text-red-600 bg-red-50 border border-red-200 rounded px-1">NO PDF</span>}
                                                        </td>
                                                        <td className="px-2 py-1.5 font-mono text-slate-500">
                                                            {r.f.revision||'0'}
                                                            {r.versions>1 && <span className="ml-1 text-[9px] text-amber-600 font-bold">×{r.versions}</span>}
                                                        </td>
                                                        <td className="px-2 py-1.5">
                                                            <select value={r.f.status||'draft'} onChange={e=>onSetStatus(r.f.id, e.target.value)}
                                                                className={`text-[10px] font-bold rounded px-1.5 py-1 border border-slate-200 outline-none cursor-pointer ${st.color}`}>
                                                                {VISIBLE_STATUS_OPTIONS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
                                                                {st.hidden && <option value={st.value}>{st.label}</option>}
                                                            </select>
                                                        </td>
                                                        <td className="px-2 py-1.5">
                                                            {r.open.length>0
                                                                ? <span className={`font-bold px-1.5 py-0.5 rounded-full ${sevStyle(r.worst).color}`}>{r.open.length} open</span>
                                                                : r.qc.length>0
                                                                    ? <span className="text-green-600 font-semibold">all closed</span>
                                                                    : <span className="text-slate-300">—</span>}
                                                            {r.stale.length>0 && <span className="ml-1 text-[9px] font-bold text-amber-700 bg-amber-100 rounded px-1">stale</span>}
                                                        </td>
                                                        <td className="px-2 py-1.5 font-mono text-[10px] text-slate-500">
                                                            {r.f.checkedBy ? <span title={`Checked by ${r.f.checkedBy}`}>{r.f.checkedBy}</span> : <span className="text-slate-300">—</span>}
                                                            {' / '}
                                                            {r.f.qcReviewBy ? <span title={`QC by ${r.f.qcReviewBy}`}>{r.f.qcReviewBy}</span> : <span className="text-slate-300">—</span>}
                                                        </td>
                                                        <td className="px-2 py-1.5 text-slate-400">{r.idle==null?'—':r.idle===0?'today':`${r.idle}d`}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </div>

                        <div className="flex-none px-5 py-2.5 border-t border-slate-200 bg-white rounded-b-xl flex items-center justify-between">
                            <p className="text-[10px] text-slate-400">Statuses stay yours to set — this screen only points out where the package disagrees with itself.</p>
                            <button onClick={onClose} className="px-4 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-md">Close</button>
                        </div>
                    </div>
                </div>
            );
        };

        // What the app learned about the picked PDF, said plainly. The annotation
        // count is the interesting bit and it has three honest answers, not two.
        const annotVerdict = (n) => {
            if (n === null || n === undefined) return { tone:'slate', text:"Couldn't read this PDF's annotations. It will still be stored exactly as you gave it." };
            if (n === 0) return { tone:'amber', text:'No annotation objects found. If your reviewer flattened their markups into the page, that is expected \u2014 the redline is still there, printed into the paper.' };
            return { tone:'orange', text:`${n} markup annotation${n!==1?'s':''} found.` };
        };

        // ── STAGE 5 / N4: BINDER IDENTITY STAMP ─────────────────────────────
        // A compiled binder that goes out for QC comes back as a flat PDF with red
        // ink on it and nothing else to say what it is: not which project, not which
        // version, not which pages belong to which calc. So the binder is stamped on
        // the way out. That stamp is what lets a returning markup file itself against
        // the version that was actually reviewed, instead of against whatever the
        // package happens to look like on the day it comes back.
        //
        // It rides in the PDF Info dictionary, written to BOTH Subject and Keywords
        // so losing one is survivable. Bluebeam and Acrobat both preserve Info on
        // save; neither is contractually obliged to, which is exactly why nothing
        // downstream trusts it — a missing stamp falls back to asking the user.
        const BINDER_STAMP_TAG = 'CALCBINDER-STAMP';
        const encodeBinderStamp = (o) => `${BINDER_STAMP_TAG}:${JSON.stringify(o)}`;
        // Pulled back out of a field that some other tool may have appended its own
        // text to, so we read the first balanced object rather than the whole tail.
        const decodeBinderStamp = (text) => {
            if (!text || typeof text !== 'string') return null;
            const i = text.indexOf(BINDER_STAMP_TAG + ':');
            if (i < 0) return null;
            const tail = text.slice(i + BINDER_STAMP_TAG.length + 1).trimStart();
            let depth = 0, end = -1, inStr = false, esc = false;
            for (let k = 0; k < tail.length; k++) {
                const c = tail[k];
                if (inStr) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
                if (c === '"') inStr = true;
                else if (c === '{') depth++;
                else if (c === '}') { depth--; if (depth === 0) { end = k + 1; break; } }
            }
            if (end < 0) return null;
            try { const o = JSON.parse(tail.slice(0, end)); return (o && o.u) ? o : null; } catch(e) { return null; }
        };
        // Whichever field survived the round trip.
        const readBinderStamp = (doc) => {
            const fields = [];
            const push = (fn) => { try { const v = fn(); fields.push(Array.isArray(v) ? v.join(' ') : v); } catch(e) {} };
            push(()=>doc.getSubject()); push(()=>doc.getKeywords()); push(()=>doc.getTitle()); push(()=>doc.getProducer());
            for (const f of fields) { const st = decodeBinderStamp(f); if (st) return st; }
            return null;
        };
        // What a stamp on an incoming file means for THIS project.
        //   'none'    — no stamp; we have to ask
        //   'foreign' — a different project's binder entirely
        //   'match'   — ours, and it names the version it was built from
        const stampVerdict = (stamp, uuid) => !stamp ? 'none'
            : (stamp.u && uuid && stamp.u !== uuid) ? 'foreign' : 'match';
        // Page ranges travel as compact triples to keep the Info dictionary small:
        // ["f1",3,7] is section f1 occupying ABSOLUTE PDF pages 3..7 inclusive,
        // 1-based, divider page first. These are real page positions in the file,
        // not the numbers printed in the footer — the cover carries no printed
        // number, so the two differ, and only one of them can find an annotation.
        const stampPageMap = (stamp) => (stamp && Array.isArray(stamp.p))
            ? stamp.p.map(t => Array.isArray(t) ? { id:t[0], from:t[1], to:t[2] } : t).filter(x => x && x.id)
            : null;
        const sectionAtBinderPage = (pageMap, page) => {
            if (!pageMap) return null;
            for (const r of pageMap) { if (page >= r.from && page <= r.to) return r.id; }
            return null;
        };

        const MarkupAttachModal = ({ ctx, onCancel, onConfirm }) => {
            const [reviewer, setReviewer] = useState(ctx.defaultReviewer || '');
            const [note, setNote] = useState('');
            // Nudge, not automation. Statuses are set by hand everywhere else in this
            // app; a pre-ticked box is a suggestion the user can see and untick.
            const nudge = ctx.sectionStatus === 'draft' || ctx.sectionStatus === 'for-check' || ctx.sectionStatus === 'review';
            const [setCommented, setSetCommented] = useState(nudge);
            const v = annotVerdict(ctx.annots);
            const toneCls = v.tone==='orange' ? 'bg-orange-50 border-orange-200 text-orange-800'
                          : v.tone==='amber'  ? 'bg-amber-50 border-amber-200 text-amber-800'
                          : 'bg-slate-50 border-slate-200 text-slate-600';
            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg flex flex-col max-h-[90vh]">
                        <div className="flex justify-between items-center px-5 py-3 border-b border-slate-100 bg-slate-50 rounded-t-xl shrink-0">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><Highlighter className="w-5 h-5 text-orange-600"/> Attach review markup</h3>
                            <button onClick={onCancel} className="p-1 text-slate-400 hover:text-slate-700 rounded"><X className="w-5 h-5"/></button>
                        </div>
                        <div className="p-5 overflow-y-auto space-y-4">
                            <div className="text-xs text-slate-500">
                                Attaching to <span className="font-semibold text-slate-700">{ctx.sectionLabel} {ctx.sectionTitle||''}</span>, <span className="font-mono font-semibold text-slate-700">Rev {ctx.revLabel}</span>.
                                A markup is filed against one revision, so it always points at the pages it was drawn on.
                            </div>
                            <div className="border border-slate-200 rounded p-3 bg-white">
                                <div className="flex items-center gap-2 text-sm font-medium text-slate-800 min-w-0">
                                    <FileText className="w-4 h-4 text-slate-400 shrink-0"/><span className="truncate" title={ctx.name}>{ctx.name}</span>
                                </div>
                                <div className="text-[11px] text-slate-500 mt-1 flex items-center gap-3 flex-wrap">
                                    {ctx.pageCount ? <span className="flex items-center gap-1"><Hash className="w-3 h-3"/>{ctx.pageCount} pg</span> : null}
                                    {ctx.size != null && <span>{fmtBytes(ctx.size)}</span>}
                                </div>
                            </div>
                            <div className={`text-[11px] border rounded px-3 py-2 ${toneCls}`}>{v.text}</div>
                            {ctx.stamp && (
                                <div className="text-[11px] border border-amber-200 bg-amber-50 text-amber-800 rounded px-3 py-2">
                                    This PDF carries a CalcBinder binder stamp — it looks like a marked-up copy of the whole package, not of one section.
                                    Attaching it here files it under {ctx.sectionLabel} alone. If it is the binder coming back, cancel and use <span className="font-semibold">Review markups</span> in the toolbar instead.
                                </div>
                            )}
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Marked up by</label>
                                <input type="text" value={reviewer} onChange={e=>setReviewer(e.target.value)} placeholder="Name or initials of the reviewer"
                                    className="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-brand-blue outline-none"/>
                                <p className="text-[10px] text-slate-400 mt-1">Leave blank if you marked it up yourself — your name is recorded as the person who attached it either way.</p>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Note <span className="text-slate-300 normal-case font-normal">(optional)</span></label>
                                <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2} placeholder="e.g. Detail check round 1 — see clouds on pp. 3–5"
                                    className="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-brand-blue outline-none resize-none"/>
                            </div>
                            {nudge && (
                                <label className="flex items-start gap-2 text-xs text-slate-600 cursor-pointer">
                                    <input type="checkbox" checked={setCommented} onChange={e=>setSetCommented(e.target.checked)} className="mt-0.5"/>
                                    <span>Also move this section to <span className="font-semibold text-orange-700">Comments Issued</span> — it is at {getStatusStyle(ctx.sectionStatus).label} now.</span>
                                </label>
                            )}
                            <div className="text-[11px] text-slate-500 border-t border-slate-100 pt-3">
                                The current calc does not change and any sign-off on this section is left alone. A markup is a comment on the checked pages, not a change to them.
                            </div>
                        </div>
                        <div className="px-5 py-3 border-t border-slate-200 bg-slate-50 rounded-b-xl flex justify-end gap-2 shrink-0">
                            <button onClick={onCancel} className="px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded">Cancel</button>
                            <button onClick={()=>onConfirm({ reviewer, note, setCommented: setCommented && nudge })}
                                className="flex items-center gap-1.5 px-3 py-1.5 text-sm font-semibold text-white bg-orange-600 hover:bg-orange-700 rounded">
                                <Paperclip className="w-4 h-4"/> Attach markup
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // The fork in the road. Two files look identical to the app \u2014 a revised calc
        // and the reviewer's copy of the old one \u2014 and filing either as the other is
        // expensive: one buries the comments, the other fakes a revision and drops a
        // signature. Annotations are the tell, so when we see them we stop and ask.
        const RedlineGuardModal = ({ ctx, onCancel, onReplace, onMarkup }) => (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-xl flex flex-col max-h-[90vh]">
                    <div className="flex justify-between items-center px-5 py-3 border-b border-slate-100 bg-slate-50 rounded-t-xl shrink-0">
                        <h3 className="font-bold text-slate-800 flex items-center gap-2"><AlertTriangle className="w-5 h-5 text-amber-500"/> This PDF has markups on it</h3>
                        <button onClick={onCancel} className="p-1 text-slate-400 hover:text-slate-700 rounded"><X className="w-5 h-5"/></button>
                    </div>
                    <div className="p-5 overflow-y-auto space-y-3">
                        <p className="text-sm text-slate-600">
                            <span className="font-semibold text-slate-800 break-all">{ctx.name}</span> carries <span className="font-semibold">{ctx.annots} markup annotation{ctx.annots!==1?'s':''}</span>.
                            CalcBinder can file it two ways, and they are not the same thing.
                        </p>
                        <button onClick={onReplace} className="w-full text-left border border-slate-200 hover:border-brand-blue hover:bg-brand-blue-pl rounded-lg p-3 transition-colors">
                            <div className="font-semibold text-sm text-slate-800 flex items-center gap-2"><RefreshCw className="w-4 h-4 text-brand-blue"/> It is a revised calc</div>
                            <div className="text-[11px] text-slate-500 mt-1">
                                Becomes <span className="font-mono font-semibold">Rev {ctx.nextRev}</span> and the current PDF. Rev {ctx.headRev} is kept in history.
                                {ctx.hadSignoff ? ' Sign-off on this section is cleared, because a signature cannot ride on pages it never saw.' : ''}
                            </div>
                        </button>
                        <button onClick={onMarkup} className="w-full text-left border border-orange-200 bg-orange-50/50 hover:border-orange-400 hover:bg-orange-50 rounded-lg p-3 transition-colors">
                            <div className="font-semibold text-sm text-slate-800 flex items-center gap-2"><Highlighter className="w-4 h-4 text-orange-600"/> It is a redline coming back</div>
                            <div className="text-[11px] text-slate-500 mt-1">
                                Attaches to <span className="font-mono font-semibold">Rev {ctx.headRev}</span> as a review markup. The current calc does not change and sign-off is untouched.
                            </div>
                        </button>
                        <p className="text-[11px] text-slate-400">
                            Annotations are only a hint. A revised calc can carry leftover comment bubbles, and a redline that was flattened has none at all — you know which this is, the app does not.
                        </p>
                    </div>
                    <div className="px-5 py-3 border-t border-slate-200 bg-slate-50 rounded-b-xl flex justify-end shrink-0">
                        <button onClick={onCancel} className="px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded">Cancel</button>
                    </div>
                </div>
            </div>
        );


        // ── STAGE 5 / N4: BINDER-LEVEL MARKUPS ──────────────────────────────
        // The QC review reads the package as a package, so the redline that comes
        // back is one marked-up copy of the whole binder. It has no revision to hang
        // off — it spans all of them — so it hangs off the PROJECT VERSION it was
        // built from, which is the only thing that pins down what the reviewer
        // actually had in front of them.
        const BinderMarkupModal = ({ ctx, issues, projectVersion, onCancel, onConfirm }) => {
            const stamp = ctx.stamp;
            const [reviewer, setReviewer] = useState('');
            const [note, setNote] = useState('');
            // '' means "the package as it stands now". Anything else is an issue id.
            const [issueId, setIssueId] = useState(ctx.matchIssueId || '');
            const v = annotVerdict(ctx.annots);
            const toneCls = v.tone==='orange' ? 'bg-orange-50 border-orange-200 text-orange-800'
                          : v.tone==='amber'  ? 'bg-amber-50 border-amber-200 text-amber-800'
                          : 'bg-slate-50 border-slate-200 text-slate-600';
            const list = [...(issues||[])].sort((a,b)=> new Date(b.ts) - new Date(a.ts));
            const chosen = issueId ? list.find(i=>i.id===issueId) : null;
            // A matching stamp is authoritative about the version. Without one the
            // user's choice of issue is, and failing that it is the current version.
            const resolvedVersion = (ctx.verdict==='match' && stamp && stamp.v != null) ? stamp.v
                                  : chosen ? chosen.version : projectVersion;
            const pageMap = ctx.verdict==='match' ? stampPageMap(stamp) : null;
            const mappedCount = pageMap ? pageMap.length : 0;
            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg flex flex-col max-h-[90vh]">
                        <div className="flex justify-between items-center px-5 py-3 border-b border-slate-100 bg-slate-50 rounded-t-xl shrink-0">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><Highlighter className="w-5 h-5 text-orange-600"/> Attach binder markup</h3>
                            <button onClick={onCancel} className="p-1 text-slate-400 hover:text-slate-700 rounded"><X className="w-5 h-5"/></button>
                        </div>
                        <div className="p-5 overflow-y-auto space-y-4">
                            <div className="border border-slate-200 rounded p-3 bg-white">
                                <div className="flex items-center gap-2 text-sm font-medium text-slate-800 min-w-0">
                                    <FileText className="w-4 h-4 text-slate-400 shrink-0"/><span className="truncate" title={ctx.name}>{ctx.name}</span>
                                </div>
                                <div className="text-[11px] text-slate-500 mt-1 flex items-center gap-3 flex-wrap">
                                    {ctx.pageCount ? <span className="flex items-center gap-1"><Hash className="w-3 h-3"/>{ctx.pageCount} pg</span> : null}
                                    {ctx.size != null && <span>{fmtBytes(ctx.size)}</span>}
                                </div>
                            </div>

                            {/* What the stamp says, or that there isn't one */}
                            {ctx.verdict==='match' && (
                                <div className="text-[11px] border border-emerald-200 bg-emerald-50 text-emerald-800 rounded px-3 py-2 space-y-0.5">
                                    <div className="font-semibold flex items-center gap-1.5"><Check className="w-3.5 h-3.5"/> CalcBinder recognises this binder</div>
                                    <div>Compiled from this project at <span className="font-mono font-semibold">version {stamp.v}</span>{stamp.d?` on ${new Date(stamp.d).toLocaleDateString()}`:''}.</div>
                                    {mappedCount>0
                                        ? <div>It knows where all {mappedCount} section{mappedCount!==1?'s':''} sit in the page order, so a comment on page 47 can be traced back to the calc it lands on.</div>
                                        : <div>The stamp carries no page map, so comments cannot be traced to a section automatically.</div>}
                                </div>
                            )}
                            {ctx.verdict==='foreign' && (
                                <div className="text-[11px] border border-red-200 bg-red-50 text-red-800 rounded px-3 py-2 space-y-0.5">
                                    <div className="font-semibold flex items-center gap-1.5"><AlertTriangle className="w-3.5 h-3.5"/> This binder came from a different project</div>
                                    <div>Its stamp names {stamp.n ? <span className="font-semibold">{stamp.n}</span> : 'another CalcBinder project'}{stamp.t?` — ${stamp.t}`:''}. You can still file it here, but its page map is not used, because the section numbers mean something else over there.</div>
                                </div>
                            )}
                            {ctx.verdict==='none' && (
                                <div className="text-[11px] border border-amber-200 bg-amber-50 text-amber-800 rounded px-3 py-2 space-y-0.5">
                                    <div className="font-semibold flex items-center gap-1.5"><AlertTriangle className="w-3.5 h-3.5"/> No CalcBinder stamp on this PDF</div>
                                    <div>Either it was not compiled by CalcBinder, or the reviewer's software dropped the file properties on save. Tell it below which version was reviewed — nothing is guessed.</div>
                                </div>
                            )}

                            <div className={`text-[11px] border rounded px-3 py-2 ${toneCls}`}>{v.text}</div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Reviewed package</label>
                                <select value={issueId} onChange={e=>setIssueId(e.target.value)} disabled={ctx.verdict==='match'}
                                    className="w-full border border-slate-300 rounded p-2 text-sm outline-none focus:ring-2 focus:ring-brand-blue disabled:bg-slate-100 disabled:text-slate-500">
                                    <option value="">The package as it stands now (version {projectVersion})</option>
                                    {list.map(i=><option key={i.id} value={i.id}>{i.name} — version {i.version}{i.ts?` · ${new Date(i.ts).toLocaleDateString()}`:''}</option>)}
                                </select>
                                <p className="text-[10px] text-slate-400 mt-1">
                                    {ctx.verdict==='match'
                                        ? <>Set from the binder's own stamp — version {stamp.v}{ctx.matchIssueId?', which matches a stamped issue':', which no stamped issue matches'}.</>
                                        : <>Filed against version {resolvedVersion}. Stamping an issue when a package goes out is what makes this unambiguous later.</>}
                                </p>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Marked up by</label>
                                <input type="text" value={reviewer} onChange={e=>setReviewer(e.target.value)} placeholder="Name or initials of the reviewer"
                                    className="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-brand-blue outline-none"/>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1">Note <span className="text-slate-300 normal-case font-normal">(optional)</span></label>
                                <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2} placeholder="e.g. QC review — comments throughout, see cloud index on p.2"
                                    className="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-brand-blue outline-none resize-none"/>
                            </div>
                            <div className="text-[11px] text-slate-500 border-t border-slate-100 pt-3">
                                No section changes and no sign-off is cleared. This is the reviewer's copy of the package, kept beside it.
                            </div>
                        </div>
                        <div className="px-5 py-3 border-t border-slate-200 bg-slate-50 rounded-b-xl flex justify-end gap-2 shrink-0">
                            <button onClick={onCancel} className="px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded">Cancel</button>
                            <button onClick={()=>onConfirm({ reviewer, note, issueId: issueId||null, projectVersion: resolvedVersion, pageMap })}
                                className="flex items-center gap-1.5 px-3 py-1.5 text-sm font-semibold text-white bg-orange-600 hover:bg-orange-700 rounded">
                                <Paperclip className="w-4 h-4"/> Attach markup
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const BinderMarkupsPanel = ({ markups, issues, projectVersion, onClose, onPick, onDelete, scanning }) => {
            const [busy, setBusy] = useState(null);
            const list = [...(markups||[])].sort((a,b)=> String(b.ts||'').localeCompare(String(a.ts||'')));
            const issueName = (m) => { const i = (issues||[]).find(x=>x.id===m.issueId); return i ? i.name : null; };
            const openBlobKey = async (key, id) => {
                if (!key) return;
                setBusy(id);
                try {
                    const b = await idb.getBlob(key);
                    if (!b) { alert("That PDF is no longer in this browser's local storage."); return; }
                    const u = URL.createObjectURL(b);
                    window.open(u, '_blank');
                    setTimeout(()=>URL.revokeObjectURL(u), 120000);
                } catch(e) { alert("Could not open that file: " + e.message); }
                finally { setBusy(null); }
            };
            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-white rounded-lg shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col" onClick={e=>e.stopPropagation()}>
                        <div className="flex items-center justify-between px-5 py-3 border-b border-slate-200 shrink-0">
                            <div className="min-w-0">
                                <h3 className="font-bold text-slate-800 flex items-center gap-2"><Highlighter className="w-4 h-4 text-orange-600"/> Review markups — whole binder</h3>
                                <p className="text-xs text-slate-500">{list.length} marked-up cop{list.length===1?'y':'ies'} of the compiled package</p>
                            </div>
                            <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-700 rounded"><X className="w-5 h-5"/></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-2">
                            <div className="text-[11px] text-slate-500 border border-slate-200 bg-slate-50 rounded px-3 py-2">
                                Markups on a single calc belong on that section's revision history. This list is for the review that read the package end to end — the QC copy that comes back covered in clouds.
                            </div>
                            {list.length===0 ? (
                                <div className="text-center py-10 text-slate-400">
                                    <Highlighter className="w-9 h-9 mx-auto mb-2 opacity-30"/>
                                    <p className="text-sm">No binder markups yet</p>
                                    <p className="text-xs opacity-70 mt-1">Download the binder, send it out, and attach whatever comes back.</p>
                                </div>
                            ) : list.map(m => (
                                <div key={m.markupId} className="flex items-start gap-2 rounded border border-orange-200 bg-orange-50/60 px-3 py-2">
                                    <Highlighter className="w-4 h-4 text-orange-600 shrink-0 mt-0.5"/>

                                            {m.annotationCount ? <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-orange-100 text-orange-700 border border-orange-200">{m.annotationCount} annot{m.annotationCount!==1?'s':''}</span> : null}
                                            {m.pageMap && m.pageMap.length>0 && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200" title="The binder was stamped, so comments can be traced back to their sections">page map</span>}

                                    onClick={e=>{e.target.value=null;}}

        };

        const RevisionHistoryPanel = ({ file, label, onClose, onRestore, onAttachRequest, onDeleteMarkup, scanningRevId }) => {
            const chain = file.revisions || [];
            const headId = chain.length ? chain[chain.length-1].revId : null;
            const [busy, setBusy] = useState(null);
            // Newest first — that is the order an engineer scans a rev history in.
            const rows = [...chain].reverse();

            const openBlobKey = async (key, busyId) => {
                if (!key) return;
                setBusy(busyId);
                try {
                    const b = await idb.getBlob(key);
                    if (!b) { alert("That PDF is no longer in this browser's local storage."); return; }
                    const u = URL.createObjectURL(b);
                    window.open(u, '_blank');
                    // Revoked late so the new tab has time to load it.
                    setTimeout(()=>URL.revokeObjectURL(u), 120000);
                } catch(e) { alert("Could not open that file: " + e.message); }
                finally { setBusy(null); }
            };
            const viewRev = (r) => openBlobKey(r.blobKey, r.revId);
            const markupCount = chain.reduce((n,r)=>n+markupsOfRevision(r).length, 0);

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>

                                    {markupCount>0 && <span className="ml-2 text-orange-600 font-medium">· {markupCount} review markup{markupCount!==1?'s':''}</span>}
                                </p>
                            </div>

                        </div>

                        <div className="flex-1 overflow-y-auto p-4">
                            {rows.length === 0 ? (
                                <div className="text-center py-10 text-sm text-slate-400">
                                    <FileQuestion className="w-8 h-8 mx-auto mb-2 text-slate-300"/>

                                </div>
                            ) : (
                                <ul className="space-y-2">
                                    {rows.map(r => {

                                        const meta = REV_REASON[r.reason] || REV_REASON.replace;
                                        return (
                                            <li key={r.revId} className={`border rounded p-3 ${isHead?'border-brand-blue bg-brand-blue-pl':'border-slate-200 bg-white'}`}>

                                                    <div className="shrink-0 w-14 text-center">
                                                        <div className={`font-mono font-bold text-lg leading-none ${isHead?'text-brand-blue':'text-slate-500'}`}>{r.rev}</div>
                                                        <div className="text-[9px] uppercase tracking-wide text-slate-400 mt-0.5">Rev</div>
                                                        {r.revLocked && <div className="mt-1 flex items-center justify-center gap-0.5 text-[9px] text-slate-400" title="This label was typed by hand and will not be auto-renumbered"><Lock className="w-2.5 h-2.5"/> set</div>}
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <span className="font-medium text-sm text-slate-800 truncate" title={r.name}>{r.name || 'Untitled PDF'}</span>
                                                            <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${meta.color}`}>{meta.label}</span>
                                                            {isHead && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-brand-blue text-white">CURRENT</span>}
                                                            {r.synthetic && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-500" title="Reconstructed when this project was upgraded — details before the upgrade were not recorded">reconstructed</span>}
                                                            {!r.blobKey && r.absent && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200" title="The PDF was left out of the export this project came from. The record is here; the file is not.">PDF not included</span>}
                                                        </div>
                                                        <div className="text-[11px] text-slate-500 mt-1 flex items-center gap-3 flex-wrap">
                                                            <span className="flex items-center gap-1"><Clock className="w-3 h-3"/>{r.ts ? new Date(r.ts).toLocaleString() : 'date unknown'}</span>
                                                            {r.actor && r.actor.name && <span className="flex items-center gap-1"><User className="w-3 h-3"/>{r.actor.name}</span>}
                                                            {r.pageCount != null && <span className="flex items-center gap-1"><Hash className="w-3 h-3"/>{r.pageCount} pg</span>}
                                                            {r.size != null && <span>{fmtBytes(r.size)}</span>}
                                                        </div>
                                                        {r.note && <div className="text-[11px] text-slate-600 italic mt-1">{r.note}</div>}
                                                        {r.supersededAt && <div className="text-[10px] text-slate-400 mt-1">Superseded {new Date(r.supersededAt).toLocaleString()}</div>}
                                                        {markupsOfRevision(r).length > 0 && (
                                                            <ul className="mt-2 space-y-1">
                                                                {markupsOfRevision(r).map(m => (
                                                                    <li key={m.markupId} className="flex items-start gap-2 rounded border border-orange-200 bg-orange-50/60 px-2 py-1.5">
                                                                        <Highlighter className="w-3.5 h-3.5 text-orange-600 shrink-0 mt-0.5"/>
                                                                        <div className="flex-1 min-w-0">
                                                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                                                <span className="text-[11px] font-medium text-slate-800 truncate" title={m.name}>{m.name || 'Review markup'}</span>
                                                                                {m.annotationCount ? <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-orange-100 text-orange-700 border border-orange-200">{m.annotationCount} annot{m.annotationCount!==1?'s':''}</span> : null}
                                                                                {!m.blobKey && m.absent && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200" title="The markup PDF was left out of the export this project came from. The record is here; the file is not.">PDF not included</span>}
                                                                            </div>
                                                                            <div className="text-[10px] text-slate-500 mt-0.5 flex items-center gap-2 flex-wrap">
                                                                                <span>{m.ts ? new Date(m.ts).toLocaleDateString() : ''}</span>
                                                                                {m.reviewer && <span className="flex items-center gap-1"><User className="w-2.5 h-2.5"/>{m.reviewer}</span>}
                                                                                {m.pageCount != null && <span>{m.pageCount} pg</span>}
                                                                                {m.size != null && <span>{fmtBytes(m.size)}</span>}
                                                                            </div>
                                                                            {m.note && <div className="text-[10px] text-slate-600 italic mt-0.5">{m.note}</div>}
                                                                        </div>
                                                                        <div className="shrink-0 flex items-center gap-1">
                                                                            <button onClick={()=>openBlobKey(m.blobKey, m.markupId)} disabled={!m.blobKey||busy===m.markupId} title="Open this markup in a new tab"
                                                                                className={`p-1 rounded ${(!m.blobKey||busy===m.markupId)?'text-slate-300 cursor-not-allowed':'text-orange-700 hover:bg-orange-100'}`}>
                                                                                {busy===m.markupId ? <Loader2 className="w-3.5 h-3.5 animate-spin"/> : <ExternalLink className="w-3.5 h-3.5"/>}
                                                                            </button>
                                                                            <button onClick={()=>onDeleteMarkup&&onDeleteMarkup(r.revId, m.markupId)} title="Remove this markup"
                                                                                className="p-1 rounded text-slate-400 hover:text-red-600 hover:bg-red-50"><Trash2 className="w-3.5 h-3.5"/></button>
                                                                        </div>
                                                                    </li>
                                                                ))}
                                                            </ul>
                                                        )}
                                                    </div>
                                                    <div className="shrink-0 flex flex-col gap-1">
                                                        {/* Custom brand classes are plain CSS, not Tailwind colors, so disabled:hover:*
                                                            variants would not resolve — the disabled look is switched here instead. */}
                                                        <button onClick={()=>viewRev(r)} disabled={!r.blobKey||busy===r.revId} className={`flex items-center gap-1 px-2 py-1 text-xs font-medium rounded ${(!r.blobKey||busy===r.revId)?'text-slate-400 bg-slate-100 cursor-not-allowed':'text-brand-blue bg-brand-blue-pl hover:bg-brand-blue hover:text-white'}`}>
                                                            {busy===r.revId ? <Loader2 className="w-3 h-3 animate-spin"/> : <ExternalLink className="w-3 h-3"/>} View
                                                        </button>
                                                        {!isHead && (
                                                            <button onClick={()=>onRestore(r.revId)} disabled={!r.blobKey} className="flex items-center gap-1 px-2 py-1 text-xs font-medium text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded disabled:opacity-40">
                                                                <RotateCcw className="w-3 h-3"/> Make current
                                                            </button>
                                                        )}
                                                        {onAttachRequest && (
                                                            <label title="Attach a reviewer's marked-up copy of THIS revision"
                                                                className={`flex items-center gap-1 px-2 py-1 text-xs font-medium rounded border ${scanningRevId===r.revId?'text-slate-400 bg-slate-100 border-slate-200 cursor-wait':'text-orange-700 bg-orange-50 hover:bg-orange-100 border-orange-200 cursor-pointer'}`}>
                                                                {scanningRevId===r.revId ? <Loader2 className="w-3 h-3 animate-spin"/> : <Highlighter className="w-3 h-3"/>} Markup
                                                                <input type="file" accept=".pdf" className="hidden" onChange={e=>{const f=e.target.files[0]; if(f) onAttachRequest(r.revId, f);}} onClick={e=>e.target.value=null}/>
                                                            </label>
                                                        )}
                                                    </div>
                                                </div>
                                            </li>
                                        );
                                    })}
                                </ul>
                            )}
                        </div>

                        <div className="px-5 py-3 border-t border-slate-200 bg-slate-50 rounded-b-lg text-[11px] text-slate-500 shrink-0">
                            Every superseded PDF is kept. Making an older revision current adds a new entry to the top of this list rather than deleting anything, so you can always step back again.
                            <span className="block mt-1"><span className="text-orange-700 font-medium">Markup</span> files a reviewer's marked-up copy against that exact revision — including a superseded one, which is where a redline usually belongs once the calc has been revised in answer to it.</span>
                        </div>
                    </div>
                </div>
            );
        };

        const CoverSheetModal = ({ file, projectMeta, comments=[], onClose, onSave, onAddComment, onDeleteComment, onSetQcState, isStale }) => {
            const [data, setData] = useState({ sectionTitle: file.sectionTitle||"", sectionSubtitle: file.sectionSubtitle||"", designedBy: file.designedBy||file.calcsBy||"", designedDate: file.designedDate||"", checkedBy: file.checkedBy||"", checkedDate: file.checkedDate||"", qcReviewBy: file.qcReviewBy||"", qcReviewDate: file.qcReviewDate||"", revision: file.revision||"0", status: file.status||"draft" });
            const [customFields, setCustomFields] = useState((file.customFields||[{id:1,label:"Objective / Scope",value:file.objective||"",isVisible:true},{id:2,label:"Design Code / References",value:file.references||"",isVisible:true},{id:3,label:"Computer Program",value:file.program||"",isVisible:true},{id:4,label:"Conclusions",value:file.conclusions||"",isVisible:true}]).map(f=>({...f,isEditingLabel:false})));
            const [noteInput, setNoteInput] = useState('');
            const hc = (f,v) => setData(p=>({...p,[f]:v}));
            const hcf = (i,k,v) => { const nf=[...customFields]; nf[i][k]=v; setCustomFields(nf); };
            const handleSave = () => { onSave(file.id,{...data,customFields:customFields.map(({isEditingLabel,...r})=>r)}); onClose(); };
            const submitNote = () => { const t=noteInput.trim(); if(!t) return; onAddComment(t); setNoteInput(''); };
            const row = (label,prefix) => (
                <div className="grid grid-cols-12 gap-2 items-center">
                    <div className="col-span-4 text-xs font-semibold text-slate-500 uppercase">{label}</div>
                    <div className="col-span-5"><input type="text" className="w-full border border-slate-300 rounded p-1.5 text-sm focus:ring-2 focus:ring-brand-blue outline-none" placeholder="Name/Initials" value={data[`${prefix}By`]} onChange={e=>hc(`${prefix}By`,e.target.value)}/></div>
                    <div className="col-span-3"><input type="date" className="w-full border border-slate-300 rounded p-1.5 text-sm outline-none" value={data[`${prefix}Date`]} onChange={e=>hc(`${prefix}Date`,e.target.value)}/></div>
                </div>
            );
            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[90vh]">
                        <div className="flex justify-between items-center p-6 border-b border-slate-100 bg-slate-50 rounded-t-xl">
                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><ClipboardList className="w-6 h-6 text-brand-blue"/> Calculation Cover Sheet</h2>
                            <button onClick={onClose} className="p-2 hover:bg-slate-200 rounded-full text-slate-400"><X className="w-5 h-5"/></button>
                        </div>
                        <div className="p-6 overflow-y-auto space-y-6">
                            <div className="grid grid-cols-2 gap-4 p-3 bg-brand-blue-pl border border-brand-blue rounded-lg text-sm text-brand-blue-dk">
                                <div><span className="font-bold uppercase text-[10px] text-brand-blue block">Project</span>{projectMeta.title}</div>
                                <div><span className="font-bold uppercase text-[10px] text-brand-blue block">Project No</span>{projectMeta.number}</div>
                            </div>
                            <div className="space-y-3">
                                <h3 className="text-sm font-bold uppercase text-slate-400 tracking-wider border-b border-slate-100 pb-1">Identification</h3>
                                <div><label className="block text-xs font-semibold text-slate-500 mb-1">Title</label><input type="text" className="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-brand-blue outline-none" value={data.sectionTitle} onChange={e=>hc('sectionTitle',e.target.value)}/></div>
                                <div><label className="block text-xs font-semibold text-slate-500 mb-1">Subtitle / Element</label><input type="text" className="w-full border border-slate-300 rounded p-2 text-sm outline-none" value={data.sectionSubtitle} onChange={e=>hc('sectionSubtitle',e.target.value)}/></div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                                    <div className="flex flex-wrap gap-2">{VISIBLE_STATUS_OPTIONS.map(s=>(
                                        <button key={s.value} onClick={()=>hc('status',s.value)} className={`px-3 py-1 rounded-full text-xs font-semibold border-2 transition-all ${data.status===s.value?`${s.color} border-current`:'bg-white text-slate-400 border-slate-200 hover:border-slate-300'}`}>{s.label}</button>
                                    ))}</div>
                                </div>
                            </div>
                            <div className="space-y-3">
                                <h3 className="text-sm font-bold uppercase text-slate-400 tracking-wider border-b border-slate-100 pb-1">Technical Details</h3>
                                {customFields.map((field,i)=>(
                                    <div key={i} className="flex gap-3 items-start bg-slate-50 p-3 rounded-lg border border-slate-100">
                                        <input type="checkbox" checked={field.isVisible} onChange={e=>hcf(i,'isVisible',e.target.checked)} className="mt-3 w-4 h-4 text-brand-blue rounded"/>
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 mb-1">
                                                {field.isEditingLabel
                                                    ? <input autoFocus type="text" value={field.label} onChange={e=>hcf(i,'label',e.target.value)} onBlur={()=>hcf(i,'isEditingLabel',false)} className="text-xs font-bold uppercase bg-white border border-brand-blue rounded px-1.5 py-0.5 outline-none w-full"/>
                                                    : <><span className={`text-xs font-bold text-slate-500 uppercase ${!field.isVisible&&'opacity-50'}`}>{field.label}</span>{field.isVisible&&<button onClick={()=>hcf(i,'isEditingLabel',true)} className="p-1 text-slate-400 hover:text-brand-blue rounded"><PenTool className="w-3 h-3"/></button>}</>
                                                }
                                            </div>
                                            <textarea rows={2} value={field.value} onChange={e=>hcf(i,'value',e.target.value)} disabled={!field.isVisible} className={`w-full border rounded p-2 text-sm outline-none resize-none ${!field.isVisible?'bg-slate-100 text-slate-400 border-slate-200':'bg-white border-slate-300 focus:ring-2 focus:ring-brand-blue'}`} placeholder="Enter details..."/>
                                            {field.isVisible && <div className="text-[10px] text-right text-slate-400">{field.value.length}/2500</div>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="space-y-3">
                                <h3 className="text-sm font-bold uppercase text-slate-400 tracking-wider border-b border-slate-100 pb-1">Sign-off</h3>
                                <div className="space-y-2 bg-slate-50 p-3 rounded-lg border border-slate-100">
                                    <div className="grid grid-cols-12 gap-2 mb-1 text-[10px] uppercase font-bold text-slate-400"><div className="col-span-4">Role</div><div className="col-span-5">Name</div><div className="col-span-3">Date</div></div>
                                    {row("Designed By","designed")}{row("Checked By","checked")}{row("QC Review By","qcReview")}
                                </div>
                                <div className="flex items-center gap-2 justify-end"><label className="text-xs font-semibold text-slate-500">Revision:</label><input type="text" className="w-16 border border-slate-300 rounded p-1 text-sm text-center outline-none" value={data.revision} onChange={e=>hc('revision',e.target.value)}/></div>
                            </div>

                                <h3 className="text-sm font-bold uppercase text-slate-400 tracking-wider border-b border-slate-100 pb-1 flex items-center gap-2"><MessageSquare className="w-4 h-4"/> Notes &amp; QC Items {comments.length>0&&<span className="text-[10px] bg-slate-100 text-slate-500 rounded-full px-2 py-0.5">{comments.length}</span>}{comments.filter(c=>c.kind==='qc'&&c.status!=='closed').length>0&&<span className="text-[10px] bg-orange-100 text-orange-700 rounded-full px-2 py-0.5">{comments.filter(c=>c.kind==='qc'&&c.status!=='closed').length} open</span>}</h3>
                                {comments.length>0 && (
                                    <div className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
