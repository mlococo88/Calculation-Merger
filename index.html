                                </div>
                            )}
                        </div>
                        <div className="p-4 border-t border-slate-200 bg-slate-50 rounded-b-xl flex justify-end items-center gap-2">
                            <button onClick={onClose} className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-200 rounded">Cancel</button>
                            <button onClick={handleSave} className="px-4 py-2 bg-brand-blue text-white font-medium hover:bg-brand-blue-dk rounded flex items-center gap-2"><Check className="w-4 h-4"/> Save Details</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- IMPORT BINDER MODAL ---
        const ImportBinderModal = ({ onClose, onImport, importProgress }) => {
            const [step, setStep] = useState('upload'); // 'upload' | 'preview' | 'importing'
            const [error, setError] = useState('');
            const [parsed, setParsed] = useState(null); // { meta, sections }
            const importInputRef = useRef(null);

            const parseBinder = async (file) => {
                setError('');
                setStep('upload');
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    // Keep a raw copy so pdf-lib can extract pages later during import
                    const binderBytesCopy = arrayBuffer.slice(0);
                    const loadTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
                    const pdfDoc = await loadTask.promise;
                    const numPages = pdfDoc.numPages;

                    // Helper: get all text items from a page with positions
                    const getPageText = async (pageNum) => {
                        const page = await pdfDoc.getPage(pageNum);
                        const content = await page.getTextContent();
                        const { height } = page.getViewport({ scale: 1 });
                        // Return items sorted top-to-bottom
                        return content.items
                            .filter(item => item.str.trim())
                            .map(item => ({
                                text: item.str.trim(),
                                x: item.transform[4],
                                y: height - item.transform[5], // flip Y so 0=top
                                size: Math.abs(item.transform[3]),
                            }))
                            .sort((a, b) => a.y - b.y);
                    };

                    // ── Parse Cover Page (page 1) ─────────────────────────────
                    const coverItems = await getPageText(1);
                    let projTitle = '', projNumber = '', projClient = '', projDate = '', projDocType = '';

                    for (const item of coverItems) {
                        const t = item.text;
                        if (!projTitle && item.size >= 16) { projTitle = t; continue; }
                        if (t.startsWith('Project No:')) { projNumber = t.replace('Project No:', '').trim(); continue; }
                        if (t.startsWith('No:')) { projNumber = t.replace('No:', '').trim(); continue; }
                        if (t.startsWith('Client:')) { projClient = t.replace('Client:', '').trim(); continue; }
                        if (t.startsWith('Date:')) { projDate = t.replace('Date:', '').trim(); continue; }
                        if (t.includes('CALCULATION') || t.includes('PACKAGE') || t.includes('REPORT')) { projDocType = t; }
                    }

                    // Also try to find Project No / Client / Date as separate items (two-column layout)
                    for (let i = 0; i < coverItems.length; i++) {
                        const t = coverItems[i].text;
                        const next = coverItems[i+1]?.text || '';
                        if (t === 'Project No:') { projNumber = next; }
                        if (t === 'Client:') { projClient = next; }
                        if (t === 'Date:') { projDate = next; }
                    }

                    // ── Find TOC pages ────────────────────────────────────────
                    // TOC pages have "TABLE OF CONTENTS" as a prominent item
                    const tocPageNums = [];
                    for (let p = 1; p <= Math.min(numPages, 8); p++) {
                        const items = await getPageText(p);
                        if (items.some(it => it.text === 'TABLE OF CONTENTS')) {
                            tocPageNums.push(p);
                        }
                    }

                    if (tocPageNums.length === 0) {
                        throw new Error("Could not find a Table of Contents page. Make sure this is a CalcBinder-generated PDF.");
                    }

                    // ── Parse TOC entries ─────────────────────────────────────
                    const sections = [];
                    const sectionLabelRegex = /^(\d+(?:\.\d+(?:\.\d+)?)?)$/;
                    const pageNumRegex = /^\d+$/;

                    for (const tocPage of tocPageNums) {
                        const items = await getPageText(tocPage);
                        // Skip the header items
                        const dataItems = items.filter(it =>
                            it.text !== 'TABLE OF CONTENTS' &&
                            !it.text.includes(projNumber || 'XXXXX')
                        );

                        // Group items by Y position (same line = within 4px)
                        const lines = [];
                        for (const item of dataItems) {
                            const existing = lines.find(l => Math.abs(l.y - item.y) < 5);
                            if (existing) { existing.items.push(item); }
                            else { lines.push({ y: item.y, items: [item] }); }
                        }

                        for (const line of lines) {
                            const texts = line.items.sort((a,b) => a.x - b.x).map(i => i.text);
                            if (texts.length < 2) continue;

                            const firstWord = texts[0];
                            const lastWord = texts[texts.length - 1];

                            // Line must start with a section label and end with a page number
                            if (!sectionLabelRegex.test(firstWord)) continue;
                            if (!pageNumRegex.test(lastWord)) continue;

                            const label = firstWord;
                            const pageNum = parseInt(lastWord);
                            // Title = everything between label and page number,
                            // dropping the TOC dot-leader items (each "." is its own text item)
                            const titleParts = texts.slice(1, -1).filter(t => !/^\.+$/.test(t));
                            const title = titleParts.join(' ').trim() || 'Untitled';

                            // Determine depth from label format
                            const depth = (label.match(/\./g) || []).length;

                            // Avoid duplicates
                            if (!sections.find(s => s.label === label)) {
                                sections.push({ label, title, depth, pageNum, rawPages: 1 });
                            }
                        }
                    }

                    // Calculate rawPages per section from page number differences
                    for (let i = 0; i < sections.length; i++) {
                        const curr = sections[i];
                        const next = sections[i + 1];
                        if (next) {
                            // pages = next section start - current start - 1 (for divider page)
                            curr.rawPages = Math.max(1, next.pageNum - curr.pageNum - 1);
                        } else {
                            curr.rawPages = 1; // last section, unknown
                        }
                    }

                    if (sections.length === 0) {
                        throw new Error("Could not parse any sections from the Table of Contents.");
                    }

                    // ── Parse each divider page for subtitle, fields, sign-off ─────────────
                    // The number shown in the TOC equals the 0-based PDF page index
                    // (cover = index 0 with no number; the footer prints i for i>=1, so
                    // shown page N sits at index N). pdf.js getPage() is 1-based, so the
                    // divider at index section.pageNum is read with getPage(section.pageNum + 1).
                    for (const section of sections) {
                        try {
                            const divItems = await getPageText(section.pageNum + 1);
                            const pageH = (await pdfDoc.getPage(section.pageNum + 1)).getViewport({scale:1}).height;

                            // Sort items top to bottom
                            const sorted = [...divItems].sort((a,b) => a.y - b.y);

                            // Find the "SECTION X" label (large text near top)
                            const sectionLabelItem = sorted.find(it => it.text.startsWith('SECTION ') && it.size >= 18);
                            const sectionLabelY = sectionLabelItem ? sectionLabelItem.y : 0;

                            // Items below the section label and above the footer (bottom ~100px)
                            const footerY = pageH - 120; // sign-off box + its label row sit within ~115px of the bottom
                            const bodyItems = sorted.filter(it => it.y > sectionLabelY + 10 && it.y < footerY);

                            // Extract subtitle — first item below section label with reasonable size (not the title itself)
                            // Title is already in section.title; subtitle is smaller text just below
                            const titleItem = bodyItems.find(it =>
                                it.text === section.title || section.title.startsWith(it.text)
                            );
                            const titleY = titleItem ? titleItem.y : sectionLabelY + 40;
                            const subtitleItem = bodyItems.find(it =>
                                it.y > titleY + 5 &&
                                it.y < titleY + 40 &&
                                it.text !== section.title &&
                                !it.text.startsWith('REV:') &&
                                it.size < 16
                            );
                            if (subtitleItem) section.subtitle = subtitleItem.text;

                            // Extract labeled fields — look for ALL-CAPS labels followed by content
                            const fieldLabels = [
                                'OBJECTIVE / SCOPE:',
                                'OBJECTIVE/SCOPE:',
                                'DESIGN CODE / REFERENCES:',
                                'DESIGN CODE/REFERENCES:',
                                'COMPUTER PROGRAM:',
                                'CONCLUSIONS:',
                            ];
                            const customFields = [];
                            for (let i = 0; i < bodyItems.length; i++) {
                                const item = bodyItems[i];
                                const matchedLabel = fieldLabels.find(l =>
                                    item.text.toUpperCase().startsWith(l.replace(':','').toUpperCase())
                                );
                                if (matchedLabel) {
                                    // Collect all text below this label until next label or footer
                                    const labelY = item.y;
                                    const nextLabelItem = bodyItems.slice(i+1).find(it =>
                                        fieldLabels.some(l => it.text.toUpperCase().startsWith(l.replace(':','').toUpperCase()))
                                    );
                                    const nextLabelY = nextLabelItem ? nextLabelItem.y : footerY;
                                    const valueItems = bodyItems.filter(it =>
                                        it.y > labelY + 2 && it.y < nextLabelY - 2 &&
                                        !fieldLabels.some(l => it.text.toUpperCase().startsWith(l.replace(':','').toUpperCase()))
                                    );
                                    const value = valueItems.map(it => it.text).join(' ').trim();
                                    // Clean up label
                                    const cleanLabel = matchedLabel
                                        .replace(':', '')
                                        .replace(' / ', ' / ')
                                        .trim()
                                        .split(' ').map(w => w.charAt(0)+w.slice(1).toLowerCase()).join(' ');
                                    customFields.push({ label: cleanLabel, value, isVisible: true });
                                }
                            }
                            if (customFields.length > 0) section.customFields = customFields;

                            // Extract footer sign-off — items in bottom 80px of page
                            const footerItems = sorted.filter(it => it.y >= footerY);
                            // Footer has 3 columns: DESIGNED BY, CHECKED BY, QC REVIEW BY
                            // Labels are tiny, names are slightly larger, dates are small
                            const getColItems = (label) => {
                                const labelItem = footerItems.find(it =>
                                    it.text.toUpperCase().replace(' ','').includes(label.replace(' ',''))
                                );
                                if (!labelItem) return { name:'', date:'' };
                                // Items in the same X column (within 80px)
                                const colItems = footerItems.filter(it =>
                                    Math.abs(it.x - labelItem.x) < 80 && it !== labelItem
                                ).sort((a,b) => a.y - b.y);
                                const name = colItems[0]?.text || '';
                                const date = colItems[1]?.text || '';
                                return { name, date };
                            };
                            const designed = getColItems('DESIGNED BY');
                            const checked  = getColItems('CHECKED BY');
                            const qc       = getColItems('QC REVIEW BY');
                            section.designedBy   = designed.name;
                            section.designedDate = designed.date;
                            section.checkedBy    = checked.name;
                            section.checkedDate  = checked.date;
                            section.qcReviewBy   = qc.name;
                            section.qcReviewDate = qc.date;

                            // Extract revision
                            const revItem = sorted.find(it => it.text.startsWith('REV:'));
                            if (revItem) section.revision = revItem.text.replace('REV:','').trim();

                        } catch(e) {
                            console.warn("Could not parse divider for section", section.label, e);
                        }
                    }

                    setParsed({
                        meta: { title: projTitle, number: projNumber, client: projClient, date: projDate, docType: projDocType },
                        sections,
                        sourcePageCount: numPages,
                        binderBytes: binderBytesCopy, // raw bytes for pdf-lib page extraction
                    });
                    setStep('preview');

                } catch(e) {
                    console.error("Parse error", e);
                    setError(e.message || "Failed to parse PDF.");
                }
            };

            const handleFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.name.toLowerCase().endsWith('.pdf')) { setError("Please select a PDF file."); return; }
                await parseBinder(file);
            };

            const handleConfirmImport = () => {
                if (!parsed) return;
                setStep('importing');
                onImport(parsed);
            };

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[85vh]">
                        {/* Header */}
                        <div className="flex justify-between items-center p-6 border-b border-slate-100 bg-slate-50 rounded-t-xl">
                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <BookOpen className="w-6 h-6 text-brand-blue"/> Import Existing Binder PDF
                            </h2>
                            <button onClick={onClose} className="p-2 hover:bg-slate-200 rounded-full text-slate-400"><X className="w-5 h-5"/></button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6">
                            {step === 'upload' && (
                                <div className="space-y-4">
                                    <p className="text-sm text-slate-600">Upload a previously generated CalcBinder PDF. The app will read the cover page and Table of Contents to reconstruct your project structure.</p>
                                    <div className="bg-brand-blue-pl border border-brand-blue rounded-lg p-4 text-xs text-brand-blue-dk space-y-1">
                                        <p className="font-bold">What will be imported:</p>
                                        <p>✓ Project title, number, client, date</p>
                                        <p>✓ All section titles, numbering &amp; hierarchy</p>
                                        <p>✓ Section content pages — extracted and saved locally</p>
                                        <p>✓ Page counts per section</p>
                                        <p className="font-bold mt-2">What will need to be re-entered:</p>
                                        <p>• Sign-off info (Designed By, Checked By etc.)</p>
                                        <p>• Cover image, logo</p>
                                        <p className="font-bold mt-2 text-amber-700">⏱ Large binders may take 1–2 minutes to extract and save.</p>
                                    </div>
                                    {error && <div className="flex items-start gap-2 text-red-600 text-xs bg-red-50 p-3 rounded-lg border border-red-100"><AlertCircle className="w-4 h-4 shrink-0 mt-0.5"/><span>{error}</span></div>}
                                    <div
                                        className="border-2 border-dashed border-slate-300 rounded-xl p-10 text-center cursor-pointer hover:border-brand-blue hover:bg-brand-blue-pl transition-colors"
                                        onClick={() => importInputRef.current?.click()}
                                    >
                                        <FileUp className="w-10 h-10 mx-auto mb-3 text-slate-400"/>
                                        <p className="text-sm font-medium text-slate-600">Click to select your binder PDF</p>
                                        <p className="text-xs text-slate-400 mt-1">Only CalcBinder-generated PDFs are supported</p>
                                        <input type="file" accept=".pdf" className="hidden" ref={importInputRef} onChange={handleFileChange}/>
                                    </div>
                                </div>
                            )}

                            {step === 'preview' && parsed && (
                                <div className="space-y-4">
                                    <p className="text-sm text-slate-600 font-medium">Review the extracted data before importing:</p>

                                    {/* Project meta */}
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 space-y-2">
                                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Project Info</h3>
                                        <div className="grid grid-cols-2 gap-2 text-sm">
                                            <div><span className="text-slate-400 text-xs">Title</span><p className="font-semibold text-slate-800">{parsed.meta.title||'—'}</p></div>
                                            <div><span className="text-slate-400 text-xs">Number</span><p className="font-semibold text-slate-800">{parsed.meta.number||'—'}</p></div>
                                            <div><span className="text-slate-400 text-xs">Client</span><p className="font-semibold text-slate-800">{parsed.meta.client||'—'}</p></div>
                                            <div><span className="text-slate-400 text-xs">Date</span><p className="font-semibold text-slate-800">{parsed.meta.date||'—'}</p></div>
                                        </div>
                                    </div>

                                    {/* Sections list */}
                                    <div className="border border-slate-200 rounded-lg overflow-hidden">
                                        <div className="bg-slate-50 px-4 py-2 flex justify-between items-center border-b border-slate-200">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Sections Found</h3>
                                            <span className="text-xs text-slate-500 font-medium">{parsed.sections.length} sections · {parsed.sourcePageCount} pages total</span>
                                        </div>
                                        <div className="max-h-60 overflow-y-auto divide-y divide-slate-100">
                                            {parsed.sections.map((s, i) => (
                                                <div key={i} className="px-4 py-2 flex items-center gap-3 text-sm" style={{paddingLeft: `${16 + s.depth*20}px`}}>
                                                    <span className="font-mono text-xs text-slate-400 w-8 shrink-0">{s.label}</span>
                                                    <div className="flex-1 min-w-0">
                                                        <span className="text-slate-700 truncate block">{s.title}</span>
                                                        {s.subtitle&&<span className="text-xs text-slate-400 truncate block">{s.subtitle}</span>}
                                                        {(s.designedBy||s.checkedBy)&&<span className="text-[10px] text-slate-300">By: {[s.designedBy,s.checkedBy].filter(Boolean).join(' · ')}</span>}
                                                    </div>
                                                    <div className="flex flex-col items-end shrink-0 gap-0.5">
                                                        <span className="text-xs text-slate-400">~{s.rawPages} pg{s.rawPages!==1?'s':''}</span>
                                                        {s.customFields?.length>0&&<span className="text-[10px] text-green-600">{s.customFields.length} fields ✓</span>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {error && <div className="flex items-start gap-2 text-red-600 text-xs bg-red-50 p-3 rounded-lg border border-red-100"><AlertCircle className="w-4 h-4 shrink-0 mt-0.5"/><span>{error}</span></div>}
                                </div>
                            )}

                            {step === 'importing' && (
                                <div className="flex flex-col items-center justify-center py-12 gap-5 text-slate-500">
                                    <Loader2 className="w-10 h-10 animate-spin text-brand-blue"/>
                                    {importProgress ? (
                                        <>
                                            <div className="text-center">
                                                <p className="text-sm font-semibold text-slate-700">Extracting &amp; saving sections...</p>
                                                <p className="text-xs text-slate-400 mt-1 max-w-xs truncate">{importProgress.name}</p>
                                            </div>
                                            <div className="w-64 bg-slate-200 rounded-full h-2">
                                                <div className="h-2 rounded-full transition-all" style={{width:`${(importProgress.current/importProgress.total)*100}%`, backgroundColor:'var(--brand-blue)'}}/>
                                            </div>
                                            <p className="text-xs text-slate-400">{importProgress.current} of {importProgress.total} sections</p>
                                        </>
                                    ) : (
                                        <p className="text-sm font-medium">Creating project...</p>
                                    )}
                                    <p className="text-[10px] text-slate-400 text-center max-w-xs">This may take a minute for large binders.<br/>Please keep this window open.</p>
                                </div>
                            )}
                        </div>

                        {/* Footer */}
                        <div className="p-4 border-t border-slate-200 bg-slate-50 rounded-b-xl flex justify-between items-center">
                            {step === 'preview' ? (
                                <>
                                    <button onClick={() => { setStep('upload'); setParsed(null); setError(''); }} className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-200 rounded flex items-center gap-2">
                                        <ChevronLeft className="w-4 h-4"/> Back
                                    </button>
                                    <button onClick={handleConfirmImport} className="px-5 py-2 text-white font-semibold rounded-lg flex items-center gap-2" style={{backgroundColor:'var(--brand-blue)'}}>
                                        <Check className="w-4 h-4"/> Import Project
                                    </button>
                                </>
                            ) : (
                                <>
                                    <div/>
                                    <button onClick={onClose} className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-200 rounded">Cancel</button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- USER PROFILE MODAL ---
        const ProfileModal = ({ profile, firstRun, onSave, onClose }) => {
            const [p, setP] = useState({ ...blankProfile(), ...profile });
            const [initialsEdited, setInitialsEdited] = useState(!!profile.initials);
            const set = (k,v) => setP(prev => {
                const next = { ...prev, [k]: v };
                if (k === 'name' && !initialsEdited) next.initials = deriveInitials(v);
                return next;
            });
            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
                        <div className="flex justify-between items-center mb-1">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><User className="w-5 h-5 text-brand-blue"/> {firstRun ? 'Welcome to CalcBinder' : 'Your Profile'}</h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-100 rounded-full text-slate-400"><X className="w-5 h-5"/></button>
                        </div>
                        <p className="text-xs text-slate-500 mb-4">{firstRun
                            ? 'Tell CalcBinder who you are so your exports and edits are attributed in the project history. You can skip this and set it later.'
                            : 'Used to attribute your edits, exports, and imports in the project audit history. Stored only in this browser.'}</p>
                        <div className="space-y-3">
                            <div><label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Name</label><input type="text" value={p.name} onChange={e=>set('name',e.target.value)} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm outline-none focus:border-brand-blue" placeholder="Jane Engineer"/></div>
                            <div className="grid grid-cols-2 gap-3">
                                <div><label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Title</label><input type="text" value={p.title} onChange={e=>set('title',e.target.value)} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm outline-none focus:border-brand-blue" placeholder="Structural Engineer, PE"/></div>
                                <div><label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Office / Location</label><input type="text" value={p.office} onChange={e=>set('office',e.target.value)} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm outline-none focus:border-brand-blue" placeholder="Denver"/></div>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                <div className="col-span-2"><label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Email</label><input type="email" value={p.email} onChange={e=>set('email',e.target.value)} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm outline-none focus:border-brand-blue" placeholder="jane@firm.com"/></div>
                                <div><label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Initials</label><input type="text" value={p.initials} maxLength={4} onChange={e=>{setInitialsEdited(true);set('initials',e.target.value.toUpperCase());}} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm outline-none focus:border-brand-blue font-mono uppercase" placeholder={deriveInitials(p.name)||'—'}/></div>
                            </div>
                        </div>
                        <div className="flex justify-end gap-2 mt-6">
                            <button onClick={onClose} className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-200 rounded">{firstRun ? 'Skip for now' : 'Cancel'}</button>
                            <button onClick={()=>onSave(p)} className="px-4 py-2 bg-brand-blue text-white font-medium hover:bg-brand-blue-dk rounded flex items-center gap-2"><Check className="w-4 h-4"/> Save Profile</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- EXPORT PROJECT MODAL ---
        const EXPORT_MODES = [
            { key:'full',    label:'Full project',  sub:'Binder PDF + manifest + section PDFs' },
            { key:'sources', label:'Sources only',  sub:'Manifest + section PDFs (no compiled binder)' },
            { key:'binder',  label:'Binder PDF only', sub:'Just the compiled PDF (same as Download PDF)' },
        ];
        // How much superseded history rides along in the zip. The revision LOG always
        // travels — this only decides which old PDFs come with it.
        const HISTORY_SCOPES = [
            { key:'all',    label:'All kept revisions',    sub:'Every superseded PDF travels with the project' },
            { key:'pinned', label:'Pinned revisions only', sub:'Current PDFs, plus anything a stamped issue or saved version points at' },
            { key:'none',   label:'Current PDFs only',     sub:'The revision log still travels; the superseded PDFs do not' },
        ];
        // Markups get their own axis rather than riding the history scope. A binder
        // markup is a full marked-up copy of the entire package — the fattest single
        // object the app stores — and someone handing the calcs to a client may not
        // want a reviewer's red ink riding along with them.
        const MARKUP_SCOPES = [
            { key:'all',     label:'All review markups',   sub:'Section redlines and marked-up binder copies both travel' },
            { key:'section', label:'Section markups only', sub:'Leaves out the marked-up binder copies, which are the largest' },
            { key:'none',    label:'No markup PDFs',       sub:'The markup log still travels, marked "PDF not included"' },
        ];
        const ExportProjectModal = ({ projectMeta, info, mode, setMode, note, setNote, historyScope, setHistoryScope, markupScope, setMarkupScope, exporting, onClose, onConfirm }) => {
            // Per-mode size estimate: zip stores PDFs uncompressed-ish; full adds the binder (≈ section bytes)
            const scopeBytes = !info ? 0 : historyScope==='pinned' ? info.pinnedBytes : historyScope==='none' ? info.currentBytes : info.sourceBytes;
            const scopeCount = !info ? 0 : historyScope==='pinned' ? info.pinnedCount : historyScope==='none' ? info.currentCount : info.fileCount;
            const mkBytes = !info ? 0 : markupScope==='none' ? 0 : markupScope==='section' ? info.sectionMarkupBytes : info.markupBytes;
            const mkCount = !info ? 0 : markupScope==='none' ? 0 : markupScope==='section' ? info.sectionMarkupCount : info.markupCount;
            const estBytes = !info ? 0
                : mode==='binder'  ? info.sectionBytes + 4096
                : mode==='sources' ? scopeBytes + mkBytes + 4096 + info.sections*400
                : /* full */         scopeBytes + mkBytes + info.sectionBytes + 4096 + info.sections*400;
            const big = estBytes > 50 * 1024 * 1024;
            const isZip = mode !== 'binder';
            const droppedFiles = !info ? 0 : Math.max(0, info.fileCount - scopeCount);
            const droppedMarkups = !info ? 0 : Math.max(0, info.markupCount - mkCount);
            const hasMarkups = !!(info && info.markupCount > 0);
            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><FileDown className="w-5 h-5 text-brand-blue"/> Export Project</h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-100 rounded-full text-slate-400"><X className="w-5 h-5"/></button>
                        </div>
                        {/* Mode selection */}
                        <label className="text-xs font-bold text-slate-500 uppercase block mb-2">What to export</label>
                        <div className="space-y-2 mb-4">
                            {EXPORT_MODES.map(m => (
                                <button key={m.key} onClick={()=>setMode(m.key)} className={`w-full text-left px-3 py-2 rounded-lg border flex items-start gap-3 transition-colors ${mode===m.key?'border-brand-blue bg-brand-blue-pl':'border-slate-200 hover:border-slate-300'}`}>
                                    <span className={`mt-0.5 w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 ${mode===m.key?'border-brand-blue':'border-slate-300'}`}>{mode===m.key&&<span className="w-2 h-2 rounded-full bg-brand-blue" style={{backgroundColor:'var(--brand-blue)'}}/>}</span>
                                    <span className="min-w-0"><span className="text-sm font-semibold text-slate-800 block">{m.label}</span><span className="text-xs text-slate-500">{m.sub}</span></span>
                                </button>
                            ))}
                        </div>
                        {/* History scope — zip modes only */}
                        {isZip && <div className="mb-4">
                            <label className="text-xs font-bold text-slate-500 uppercase block mb-2">How much history to include</label>
                            <div className="space-y-2">
                                {HISTORY_SCOPES.map(h => (
                                    <button key={h.key} onClick={()=>setHistoryScope(h.key)} className={`w-full text-left px-3 py-2 rounded-lg border flex items-start gap-3 transition-colors ${historyScope===h.key?'border-brand-blue bg-brand-blue-pl':'border-slate-200 hover:border-slate-300'}`}>
                                        <span className={`mt-0.5 w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 ${historyScope===h.key?'border-brand-blue':'border-slate-300'}`}>{historyScope===h.key&&<span className="w-2 h-2 rounded-full bg-brand-blue" style={{backgroundColor:'var(--brand-blue)'}}/>}</span>
                                        <span className="min-w-0"><span className="text-sm font-semibold text-slate-800 block">{h.label}</span><span className="text-xs text-slate-500">{h.sub}</span></span>
                                    </button>
                                ))}
                            </div>
                            {droppedFiles>0 && <p className="text-[10px] text-slate-500 mt-2">Leaving out {droppedFiles} older PDF{droppedFiles!==1?'s':''}. Those revisions still appear in each section's history on the other side, marked <span className="font-semibold">PDF not included</span> — they just can't be opened or restored there.</p>}
                        </div>}
                        {/* Review markups — their own axis, zip modes only, and only when there are any */}
                        {isZip && hasMarkups && <div className="mb-4">
                            <label className="text-xs font-bold text-slate-500 uppercase block mb-2">Review markups</label>
                            <div className="space-y-2">
                                {MARKUP_SCOPES.map(h => (
                                    <button key={h.key} onClick={()=>setMarkupScope(h.key)} className={`w-full text-left px-3 py-2 rounded-lg border flex items-start gap-3 transition-colors ${markupScope===h.key?'border-orange-400 bg-orange-50':'border-slate-200 hover:border-slate-300'}`}>
                                        <span className={`mt-0.5 w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 ${markupScope===h.key?'border-orange-500':'border-slate-300'}`}>{markupScope===h.key&&<span className="w-2 h-2 rounded-full bg-orange-500"/>}</span>
                                        <span className="min-w-0"><span className="text-sm font-semibold text-slate-800 block">{h.label}</span><span className="text-xs text-slate-500">{h.sub}</span></span>
                                    </button>
                                ))}
                            </div>
                            {droppedMarkups>0 && <p className="text-[10px] text-slate-500 mt-2">Leaving out {droppedMarkups} markup PDF{droppedMarkups!==1?'s':''}. Who reviewed what, and when, still travels — the redline itself is what stays behind.</p>}
                        </div>}
                        {/* Summary */}
                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 space-y-2 text-sm mb-4">
                            <div className="flex justify-between"><span className="text-slate-500">Project</span><span className="font-semibold text-slate-800 truncate max-w-[220px]">{projectMeta.title||'Untitled'}</span></div>
                            <div className="flex justify-between"><span className="text-slate-500">Sections</span><span className="font-semibold text-slate-800">{info?.sections ?? '—'}</span></div>
                            {isZip && <div className="flex justify-between"><span className="text-slate-500">Bundled files</span><span className="font-semibold text-slate-800">{info ? scopeCount : '—'}</span></div>}
                            {isZip && hasMarkups && <div className="flex justify-between"><span className="text-slate-500">Review markups</span><span className="font-semibold text-orange-600">{mkCount} of {info.markupCount}</span></div>}
                            <div className="flex justify-between border-t border-slate-200 pt-2"><span className="text-slate-500">Estimated {isZip?'archive':'PDF'} size</span><span className={`font-bold ${big?'text-amber-600':'text-brand-blue'}`}>~{info ? fmtBytes(estBytes) : '…'}</span></div>
                        </div>
                        {/* Export note */}
                        {isZip && <div className="mb-4">
                            <label className="text-xs font-bold text-slate-500 uppercase block mb-1">Release note <span className="normal-case font-normal text-slate-300">(optional)</span></label>
                            <input type="text" value={note} onChange={e=>setNote(e.target.value)} maxLength={160} placeholder="e.g. Final calcs before client review" className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm outline-none focus:border-brand-blue"/>
                            <p className="text-[10px] text-slate-400 mt-1">Stored with this version and shown in the recipient's audit history.</p>
                        </div>}
                        {big && <div className="flex items-start gap-2 text-amber-700 text-xs bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4"><AlertTriangle className="w-4 h-4 shrink-0 mt-0.5"/><span>This is a large file. It may take a moment to build and download, and could be slow to copy to SharePoint.</span></div>}
                        <div className="flex justify-end gap-2">
                            <button onClick={onClose} disabled={exporting} className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-200 rounded disabled:opacity-50">Cancel</button>
                            <button onClick={onConfirm} disabled={exporting} className="px-4 py-2 bg-brand-blue text-white font-medium hover:bg-brand-blue-dk rounded flex items-center gap-2 disabled:opacity-60">
                                {exporting ? <><Loader2 className="w-4 h-4 animate-spin"/> Building…</> : <><FileDown className="w-4 h-4"/> {isZip?'Download .calcbinder.zip':'Download PDF'}</>}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- IMPORT CONFLICT MODAL (incoming UUID already exists locally) ---
        const CHANGE_ICON = { 'section-added':'＋', 'section-removed':'－', 'section-reordered':'↕', 'section-title-changed':'✎', 'pdf-replaced':'⇄', 'status-changed':'●', 'signoff-changed':'✍', 'note-edited':'✎' };
        const ImportConflictModal = ({ conflict, busy, onOverwrite, onCopy, onCancel }) => {
            const { existing, parsed, changes } = conflict;
            const inc = parsed.manifest.project;
            const exporter = parsed.manifest.exporter;
            const when = parsed.manifest.exportedAt ? new Date(parsed.manifest.exportedAt).toLocaleString() : null;
            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-1">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><AlertTriangle className="w-5 h-5 text-amber-500"/> This project already exists</h3>
                            <button onClick={onCancel} disabled={busy} className="p-1 hover:bg-slate-100 rounded-full text-slate-400 disabled:opacity-50"><X className="w-5 h-5"/></button>
                        </div>
                        <p className="text-xs text-slate-500 mb-4">You already have a copy of <span className="font-semibold text-slate-700">{existing.projectMeta?.title||'this project'}</span> (same project ID). Choose how to bring in the incoming version.</p>
                        <div className="grid grid-cols-2 gap-3 mb-4 text-sm">
                            <div className="bg-slate-50 border border-slate-200 rounded-lg p-3">
                                <div className="text-[10px] font-bold text-slate-400 uppercase mb-1">Your local copy</div>
                                <div className="font-semibold text-slate-800">v{existing.version||1}</div>
                                <div className="text-xs text-slate-500 truncate">{existing.projectMeta?.title}</div>
                            </div>
                            <div className="bg-brand-blue-pl border border-brand-blue rounded-lg p-3">
                                <div className="text-[10px] font-bold text-brand-blue uppercase mb-1">Incoming</div>
                                <div className="font-semibold text-brand-blue-dk">v{inc.version||1}</div>
                                <div className="text-xs text-brand-blue-dk truncate">{exporter?.name?`by ${exporter.name}`:''}{when?` · ${when}`:''}</div>
                            </div>
                        </div>
                        {parsed.manifest.note && <div className="text-xs bg-slate-50 border border-slate-200 rounded-lg p-3 mb-4"><span className="font-semibold text-slate-600">Release note:</span> <span className="text-slate-600">{parsed.manifest.note}</span></div>}
                        <div className="mb-4">
                            <div className="text-[10px] font-bold text-slate-400 uppercase mb-1">What overwriting would change ({changes.length})</div>
                            {changes.length === 0
                                ? <div className="text-xs text-slate-400 italic px-1">No differences detected between your copy and the incoming version.</div>
                                : <div className="border border-slate-200 rounded-lg divide-y divide-slate-100 max-h-52 overflow-y-auto">
                                    {changes.slice(0,50).map((c,i)=>(
                                        <div key={i} className="px-3 py-1.5 text-xs flex items-start gap-2">
                                            <span className="text-slate-400 shrink-0 w-4 text-center">{CHANGE_ICON[c.type]||'•'}</span>
                                            <span className="text-slate-600">{c.detail}</span>
                                        </div>
                                    ))}
                                    {changes.length>50 && <div className="px-3 py-1.5 text-[10px] text-slate-400">…and {changes.length-50} more</div>}
                                </div>}
                        </div>
                        <div className="flex flex-col gap-2">
                            <button onClick={onOverwrite} disabled={busy} className="w-full py-2 bg-brand-blue text-white font-medium hover:bg-brand-blue-dk rounded flex items-center justify-center gap-2 disabled:opacity-60">{busy?<Loader2 className="w-4 h-4 animate-spin"/>:<RefreshCw className="w-4 h-4"/>} Overwrite my copy (keeps full history)</button>
                            <button onClick={onCopy} disabled={busy} className="w-full py-2 bg-white border border-slate-300 text-slate-700 font-medium hover:bg-slate-100 rounded flex items-center justify-center gap-2 disabled:opacity-60"><Copy className="w-4 h-4"/> Import as a separate copy</button>
                            <button onClick={onCancel} disabled={busy} className="w-full py-1.5 text-slate-500 hover:text-slate-700 text-sm">Cancel</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- PROJECT AUDIT MODAL ---
        const ACTION_META = {
            'created':{label:'Created', icon:'✦', color:'text-slate-500'},
            'exported':{label:'Exported', icon:'⬆', color:'text-brand-blue'},
            'imported':{label:'Imported', icon:'⬇', color:'text-emerald-600'},
            'rolled-back':{label:'Rolled back', icon:'↺', color:'text-amber-600'},
            'section-added':{label:'Section added', icon:'＋', color:'text-emerald-600'},
            'section-removed':{label:'Section removed', icon:'－', color:'text-red-500'},
            'section-reordered':{label:'Reordered', icon:'↕', color:'text-slate-500'},
            'section-title-changed':{label:'Title changed', icon:'✎', color:'text-slate-500'},
            'pdf-replaced':{label:'PDF replaced', icon:'⇄', color:'text-brand-blue'},
            'status-changed':{label:'Status changed', icon:'●', color:'text-amber-600'},
            'signoff-changed':{label:'Sign-off changed', icon:'✍', color:'text-slate-500'},
            'note-edited':{label:'Note', icon:'✎', color:'text-slate-500'},
            'revision-added':{label:'Revision added', icon:'↻', color:'text-brand-blue'},
            'revision-restored':{label:'Revision restored', icon:'↺', color:'text-amber-600'},
            'signoff-invalidated':{label:'Sign-off cleared', icon:'⚠', color:'text-red-500'},
            'markup-attached':{label:'Markup attached', icon:'✎', color:'text-orange-600'},
            'markup-removed':{label:'Markup removed', icon:'✗', color:'text-red-500'},
            'qc-raised':{label:'QC item raised', icon:'◉', color:'text-orange-600'},
            'qc-resolved':{label:'QC item resolved', icon:'✓', color:'text-emerald-600'},
            'qc-closed':{label:'QC item closed', icon:'✔', color:'text-emerald-700'},
            'issue-created':{label:'Issue created', icon:'⚑', color:'text-brand-blue'},
            'issue-deleted':{label:'Issue removed', icon:'⚐', color:'text-red-500'},
            'history-pruned':{label:'History pruned', icon:'✂', color:'text-slate-500'},
            'revisions-merged':{label:'Revisions merged', icon:'⇄', color:'text-brand-blue'},
            'markups-merged':{label:'Markups merged', icon:'✎', color:'text-orange-600'},
            'title-changed':{label:'Title changed', icon:'✎', color:'text-slate-500'},
            'number-changed':{label:'Number changed', icon:'✎', color:'text-slate-500'},
            'settings-changed':{label:'Settings', icon:'⚙', color:'text-slate-500'},
            'watermark-changed':{label:'Watermark', icon:'⚙', color:'text-slate-500'},
            'theme-changed':{label:'Theme', icon:'⚙', color:'text-slate-500'},
            'logo-changed':{label:'Logo', icon:'⚙', color:'text-slate-500'},
            'cover-changed':{label:'Cover', icon:'⚙', color:'text-slate-500'},
            'customcover-changed':{label:'Custom cover', icon:'⚙', color:'text-slate-500'},
        };
        const actMeta = (a) => ACTION_META[a] || { label:a, icon:'•', color:'text-slate-500' };
        const AuditModal = ({ project, sections, onClose, onRollback, onRollbackSection }) => {
            const { audit=[], snapshots=[], projectMeta={}, uuid, version } = project;
            const [sel, setSel] = useState('project');   // 'project' | sectionId
            const [win, setWin] = useState('all');        // '7' | '30' | 'all'
            const [actorF, setActorF] = useState('all');
            const [actionF, setActionF] = useState('all');
            const [secQuery, setSecQuery] = useState('');
            const [openDiffs, setOpenDiffs] = useState({});
            const [sectionsOpen, setSectionsOpen] = useState(true);

            const actors = [...new Set(audit.map(a=>a.actor?.name).filter(Boolean))];
            const actions = [...new Set(audit.map(a=>a.action).filter(Boolean))];

            // Build the event list for the selected node
            const events = [];
            for (const e of audit) {
                if (sel === 'project') {
                    events.push({ key:e.id, ts:e.ts, actor:e.actor, action:e.action, version:e.version, note:e.note, detail:e.detail||e.summary, diff:e.diff||[] });
                } else {
                    if (e.sectionId === sel) events.push({ key:e.id, ts:e.ts, actor:e.actor, action:e.action, version:e.version, note:e.note, detail:e.detail||e.summary, diff:[] });
                    (e.diff||[]).forEach((d,i)=>{ if (d.scope==='section' && d.sectionId===sel) events.push({ key:e.id+'-'+i, ts:e.ts, actor:e.actor, action:d.type, version:e.version, detail:d.detail, viaExport:true, diff:[] }); });
                }
            }
            const cutoff = win==='all' ? 0 : Date.now() - parseInt(win)*86400000;
            const shown = events
                .filter(ev => win==='all' || new Date(ev.ts).getTime() >= cutoff)
                .filter(ev => actorF==='all' || ev.actor?.name===actorF)
                .filter(ev => actionF==='all' || ev.action===actionF)
                .sort((a,b)=> new Date(b.ts)-new Date(a.ts));

            const filteredSections = sections.filter(s => !secQuery.trim() || `${s.sectionLabel} ${s.sectionTitle||''}`.toLowerCase().includes(secQuery.toLowerCase()));
            // Snapshot versions available to restore (whole project)
            const restorable = [...snapshots].sort((a,b)=>b.version-a.version);
            // For a section, which snapshot versions contain it (with a PDF or as a record)
            const sectionSnaps = (sel!=='project') ? restorable.filter(s => (s.record?.files||[]).some(f=>f.id===sel)) : [];

            const nodeBtn = (active, label, sub, onClick, indent=false) => (
                <button onClick={onClick} className={`w-full text-left px-3 py-2 rounded-lg flex flex-col ${indent?'pl-6':''} ${active?'bg-brand-blue-pl border border-brand-blue':'hover:bg-slate-100 border border-transparent'}`}>
                    <span className={`text-sm font-medium truncate ${active?'text-brand-blue-dk':'text-slate-700'}`}>{label}</span>
                    {sub && <span className="text-[10px] text-slate-400 truncate">{sub}</span>}
                </button>
            );

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl flex flex-col" style={{height:'85vh'}}>
                        <div className="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50 rounded-t-xl">
                            <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2"><Clock className="w-5 h-5 text-brand-blue"/> Project Audit — {projectMeta.title||'Untitled'}</h2>
                            <button onClick={onClose} className="p-2 hover:bg-slate-200 rounded-full text-slate-400"><X className="w-5 h-5"/></button>
                        </div>
                        {/* Filters */}
                        <div className="flex flex-wrap items-center gap-2 px-4 py-2 border-b border-slate-100 text-xs">
                            <span className="text-slate-400 font-semibold uppercase text-[10px]">Filter</span>
                            <select value={win} onChange={e=>setWin(e.target.value)} className="border border-slate-300 rounded px-2 py-1 outline-none">
                                <option value="all">All time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option>
                            </select>
                            <select value={actorF} onChange={e=>setActorF(e.target.value)} className="border border-slate-300 rounded px-2 py-1 outline-none max-w-[150px]">
                                <option value="all">Everyone</option>{actors.map(a=><option key={a} value={a}>{a}</option>)}
                            </select>
                            <select value={actionF} onChange={e=>setActionF(e.target.value)} className="border border-slate-300 rounded px-2 py-1 outline-none max-w-[160px]">
                                <option value="all">All actions</option>{actions.map(a=><option key={a} value={a}>{actMeta(a).label}</option>)}
                            </select>
                            <span className="ml-auto text-slate-400">{shown.length} event{shown.length!==1?'s':''}</span>
                        </div>
                        <div className="flex-1 grid grid-cols-3 min-h-0">
                            {/* Tree */}
                            <div className="col-span-1 border-r border-slate-200 overflow-y-auto p-2 space-y-1 bg-slate-50/50">
                                {nodeBtn(sel==='project', `📁 ${projectMeta.title||'Project'}`, `v${version||1} · ${sections.length} sections`, ()=>setSel('project'))}
                                <div className="pt-1">
                                    <div className="flex items-center justify-between px-2 py-1">
                                        <button onClick={()=>setSectionsOpen(o=>!o)} className="text-[10px] font-bold text-slate-400 uppercase flex items-center gap-1">{sectionsOpen?<ChevronDown className="w-3 h-3"/>:<ChevronRight className="w-3 h-3"/>} Sections</button>
                                    </div>
                                    <div className="px-1 pb-1"><input value={secQuery} onChange={e=>setSecQuery(e.target.value)} placeholder="Find section…" className="w-full border border-slate-300 rounded px-2 py-1 text-[11px] outline-none focus:border-brand-blue"/></div>
                                    {sectionsOpen && filteredSections.map(s => nodeBtn(sel===s.id, `${s.sectionLabel} ${s.sectionTitle||'Untitled'}`, null, ()=>setSel(s.id), true))}
                                    {sectionsOpen && filteredSections.length===0 && <p className="text-[10px] text-slate-400 px-3 py-2">No sections match.</p>}
                                </div>
                            </div>
                            {/* Detail */}
                            <div className="col-span-2 overflow-y-auto p-4">
                                {sel==='project' ? (
                                    <div className="mb-4 text-xs bg-slate-50 border border-slate-200 rounded-lg p-3">
                                        <div className="text-slate-500">Project ID <span className="font-mono text-[10px] text-slate-400">{uuid}</span></div>
                                        <div className="text-slate-500">Current version <span className="font-semibold text-slate-700">v{version||1}</span></div>
                                    </div>
                                ) : null}
                                {/* Rollback strip */}
                                {sel==='project' && restorable.length>0 && (
                                    <div className="mb-4">
                                        <div className="text-[10px] font-bold text-slate-400 uppercase mb-1">Restore a previous version</div>
                                        <div className="flex flex-wrap gap-1.5">
                                            {restorable.map(s=>(
                                                <button key={s.version} onClick={()=>{ if(confirm(`Roll the whole project back to v${s.version}? Your current state is saved to history first.`)) onRollback(s.version); }} className="px-2 py-1 text-xs rounded border border-slate-300 hover:border-brand-blue hover:text-brand-blue font-medium flex items-center gap-1"><RotateCcw className="w-3 h-3"/> v{s.version}</button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {sel!=='project' && sectionSnaps.length>0 && (
                                    <div className="mb-4">
                                        <div className="text-[10px] font-bold text-slate-400 uppercase mb-1">Revert just this section</div>
                                        <div className="flex flex-wrap gap-1.5">
                                            {sectionSnaps.map(s=>(
                                                <button key={s.version} onClick={()=>{ if(confirm(`Revert this section to its v${s.version} state? Your current state is saved to history first.`)) onRollbackSection(sel, s.version); }} className="px-2 py-1 text-xs rounded border border-slate-300 hover:border-brand-blue hover:text-brand-blue font-medium flex items-center gap-1"><RotateCcw className="w-3 h-3"/> v{s.version}</button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {/* Events */}
                                {shown.length===0 ? (
                                    <div className="text-center text-slate-400 text-sm py-12">No history to show for this selection.</div>
                                ) : (
                                    <ul className="space-y-2">
                                        {shown.map(ev => {
                                            const m = actMeta(ev.action);

                    const rec = {

                        uuid: crypto.randomUUID(),   // stable identity that survives export/import
                        version: 1,
                        projectMeta: { ...projectMeta, title, number: "NEW" },
                        files: [],
                        logoBlobKey: null, coverImageBlobKey: null, customCoverBlobKey: null,
                        logoScale: 1, themeColor: '#377F99',
                        pageNumberPos: 'right', showPageHeader: true,
                        bookmarksEnabled: true, appendixEnabled: true, watermarkEnabled: false,
                        watermarkText: 'DRAFT', watermarkPages: 'all',
                        comments: {},
                        audit: [ makeAuditEntry('created', currentActor(), { version: 1, summary: 'Project created' }) ],
                        snapshots: [],
                        issues: [],
                        markups: [],
                        schema: CB_SCHEMA,
                        lastModified,
                    };
                    await idb.putProject(rec);
                    setProjects(prev=>[{ id, projectMeta: rec.projectMeta, lastModified }, ...prev]);
                    setActiveProjectId(id);
                } catch(e) { console.error(e); }
            };

            // ── EXPORT / IMPORT PROJECT (.calcbinder.zip) ─────────────────────────────
            // A full serializable copy of the current project's restorable content
            // (no audit/snapshots — those are history, stored separately).
            const fullSerializableRecord = () => ({
                projectMeta,
                files: files.map(({fileObj, downloadURL, ...r}) => r), // keep blobKey; drop transient handles
                logoBlobKey, coverImageBlobKey, customCoverBlobKey,
                logoScale: parseFloat(logoScale) || 1,
                themeColor, pageNumberPos, showPageHeader,
                bookmarksEnabled, appendixEnabled, watermarkEnabled, watermarkText, watermarkPages,
                comments,
                markups: binderMarkups,
            });
            // Every blob key referenced by a full record: current section PDFs, EVERY retained
            // revision in each section's chain, plus logo/cover/customcover.
            // NOTE: the revision walk must exist before anything writes a chain — gcBlobs deletes
            // whatever this misses, and it runs on export, project delete and both rollbacks.
            const blobKeysOfRecord = (rec) => {
                const keys = new Set();
                (rec.files||[]).forEach(f => {
                    if (f.blobKey) keys.add(f.blobKey);
                    (f.revisions||[]).forEach(r => {
                        if (!r) return;
                        if (r.blobKey) keys.add(r.blobKey);
                        // Stage 5: a redline is a blob like any other. Miss it here and the
                        // next export quietly deletes the reviewer's markup.
                        markupsOfRevision(r).forEach(m => { if (m && m.blobKey) keys.add(m.blobKey); });
                    });
                });
                (rec.markups||[]).forEach(m => { if (m && m.blobKey) keys.add(m.blobKey); });
                [rec.logoBlobKey, rec.coverImageBlobKey, rec.customCoverBlobKey].forEach(k => { if (k) keys.add(k); });
                return keys;
            };
            // Markups alone. They get their own axis on export rather than riding the
            // history scope: a binder markup is a full copy of the whole package and is
            // the fattest single object the app stores, so it deserves its own say.
            const markupKeysOfRecord = (rec) => {
                const keys = new Set();
                allMarkupsOfRecord(rec).forEach(m => { if (m.blobKey) keys.add(m.blobKey); });
                return keys;
            };
            // Markup keys across the current record AND every retained snapshot/issue,
            // split by scope so the export picker can price the two independently.
            const gatherMarkupKeys = (curRec, snaps, iss) => {
                const all = new Set(), section = new Set();
                const walk = (rec) => allMarkupsOfRecord(rec||{}).forEach(m => {
                    if (!m || !m.blobKey) return;
                    all.add(m.blobKey);
                    if (m.scope !== 'binder') section.add(m.blobKey);
                });
                walk(curRec);
                (snaps||[]).forEach(sn => walk(sn && sn.record));
                (iss||[]).forEach(i => walk(i && i.record));
                return { all, section };
            };
            // Only the section PDFs currently in play (no history) — used to split current vs history bytes
            const currentBlobKeysOfRecord = (rec) => {
                const keys = new Set();
                (rec.files||[]).forEach(f => { if (f.blobKey) keys.add(f.blobKey); });
                [rec.logoBlobKey, rec.coverImageBlobKey, rec.customCoverBlobKey].forEach(k => { if (k) keys.add(k); });
                return keys;
            };
            // All blob keys referenced by current state AND every retained snapshot AND every issue
            const gatherAllReferencedKeys = (curRec, snaps, iss) => {
                const keys = new Set(blobKeysOfRecord(curRec));
                (snaps||[]).forEach(s => blobKeysOfRecord(s.record||{}).forEach(k => keys.add(k)));
                (iss||[]).forEach(i => i && i.record && blobKeysOfRecord(i.record).forEach(k => keys.add(k)));
                return [...keys];
            };
            // Current PDFs plus every PDF a saved version or a stamped issue points at.
            // These are the ones you cannot drop without breaking a rollback or an issue.
            // Only the PDFs each one was actually pointing AT — a snapshot record carries
            // the whole revision chain along for the ride, and taking that literally would
            // make "pinned" mean "everything".
            const pinnedExportKeys = (curRec, snaps, iss) => {
                const keys = currentBlobKeysOfRecord(curRec);
                (snaps||[]).forEach(sn => sn && sn.record && currentBlobKeysOfRecord(sn.record).forEach(k=>keys.add(k)));
                (iss||[]).forEach(i => i && i.record && currentBlobKeysOfRecord(i.record).forEach(k=>keys.add(k)));
                return keys;
            };
            // Grab freshly-generated binder bytes without touching the protected generateBinder.
            // The on-screen PdfCanvasPreview feeds pdfData to PDF.js, which DETACHES the
            // ArrayBuffer — so we hide the preview during capture, then clone the intact bytes.
            // Where each section landed in the compiled binder, in ABSOLUTE 1-based
            // page numbers. The leading pages — a generated cover, or a custom cover
            // of any length, plus however many TOC pages — are worked out by
            // SUBTRACTION from the real page count rather than re-derived, because
            // generateBinder is protected and a map that disagreed with the actual
            // file would be worse than no map at all.
            const buildBinderPageMap = (totalPages) => {
                const tocPgs = Math.ceil(numberedFiles.length/25) || 1;
                let body = 0;
                const rel = numberedFiles.map(f => {
                    const at = body;
                    const content = f.isHeader ? 0 : (f.rawPages||1);
                    body += 1 + content;   // the divider page, then the calc itself
                    return { id:f.id, at, content };
                });
                const lead = totalPages - tocPgs - body;
                // A negative or absurd lead means our arithmetic and the real file
                // have parted ways. Ship nothing rather than something wrong.
                if (!(lead >= 0 && lead <= 60)) return null;
                return rel.map(r => {
                    const from = lead + tocPgs + r.at + 1;
                    return { id:r.id, from, to: from + r.content };
                });
            };
            // Stamp the binder's identity into its Info dictionary on the way out.
            // This lives at the getBinderBytes seam and never inside generateBinder —
            // the compiler itself stays byte-for-byte untouched.
            const stampBinderBytes = async (bytes) => {
                try {
                    const { PDFDocument } = window.PDFLib;
                    const doc = await PDFDocument.load(bytes, { ignoreEncryption:true });
                    const map = buildBinderPageMap(doc.getPageCount());
                    const enc = encodeBinderStamp({
                        u: projectUuid || null,
                        v: projectVersion || 0,
                        n: (projectMeta.number||'').slice(0,60),
                        t: (projectMeta.title||'').slice(0,120),
                        d: new Date().toISOString(),
                        p: map ? map.map(r=>[r.id, r.from, r.to]) : null,
                    });
                    // Written twice on purpose: if a reviewer's tool keeps one field
                    // and drops the other, the binder still knows what it is.
                    try { doc.setSubject(enc); } catch(e) {}
                    try { doc.setKeywords([enc]); } catch(e) {}
                    return new Uint8Array(await doc.save());
                } catch(e) { console.warn('Binder identity stamp skipped (binder still exported)', e); return null; }
            };
            const getBinderBytes = async () => {
                setCapturingBinder(true);
                await new Promise(r=>setTimeout(r,60)); // let the preview unmount
                try {
                    const before = pdfDataRef.current;
                    await generateBinder('preview');
                    const t0 = Date.now();
                    while (pdfDataRef.current === before && Date.now() - t0 < 15000) { await new Promise(r=>setTimeout(r,80)); }
                    const bytes = pdfDataRef.current;
                    // Clone into a fresh buffer so the copy survives the preview re-mounting
                    let out = null;
                    try { out = bytes ? new Uint8Array(bytes) : null; } catch(e) { out = null; }
                    // Stage 5: stamp the binder's identity in. Done BEFORE the appendix so the
                    // page map is computed on the binder proper; the appendix pages go on the
                    // end, and the appendix re-save carries the Info dictionary through with it.
                    if (out) { const stamped = await stampBinderBytes(out); if (stamped) out = stamped; }
                    // Stage 4: staple the revision/QC appendix on. If it fails for any reason
                    // the plain binder still goes out — an appendix is never worth losing a binder.

                    setCapturingBinder(false);

            };
            const extFromType = (t, fallback) => t==='image/png' ? 'png' : t==='image/jpeg' ? 'jpg' : t==='application/pdf' ? 'pdf' : (fallback||'bin');
            const todayStr = () => new Date().toISOString().split('T')[0];
            // Binder PDF filename: project name + export date (readable, filesystem-safe)
            const binderFileName = () => `${safeReadableName(projectMeta.title || projectMeta.number || 'Binder')} ${todayStr()}.pdf`;
            // Download the compiled binder with the project-named filename (reuses getBinderBytes so
            // the protected generateBinder stays untouched).
            const downloadBinder = async () => {
                const totalMB = files.reduce((a,f)=>a+(parseFloat(f.size)||0),0);
                if (totalMB>50 && !confirm(`Estimated output is large (~${totalMB.toFixed(0)}MB of source files). This may take a while. Continue?`)) return;
                const bytes = await getBinderBytes();
                if (!bytes) { alert("Could not generate the binder PDF."); return; }
                const blob = new Blob([bytes], { type:'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href=url; a.download=binderFileName();
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(()=>URL.revokeObjectURL(url), 4000);
            };
            // Human-readable READ ME bundled in the zip
            const buildReadme = (mode, sectionCount, exporter, historyCount, markupCount) => {
                const pm = projectMeta;
                const L = [];
                L.push('CalcBinder — Project Export');
                L.push('===========================');
                L.push('');
                L.push(`Project:   ${pm.title||'(untitled)'}`);
                if (pm.number) L.push(`Number:    ${pm.number}`);
                if (pm.client) L.push(`Client:    ${pm.client}`);
                L.push(`Version:   v${projectVersion}`);
                L.push(`Exported:  ${new Date().toLocaleString()}${exporter&&exporter.name&&exporter.name!=='Unknown user'?` by ${exporter.name}`:''}`);
                if (exportNote) L.push(`Note:      ${exportNote}`);
                L.push('');
                L.push("WHAT'S IN THIS ZIP");
                L.push('------------------');
                L.push('- manifest.json .... the project data (please do not edit by hand)');
                L.push(`- sections/ ........ each calculation section as its own PDF (${sectionCount} file${sectionCount!==1?'s':''})`);
                L.push('- assets/ .......... logo / cover images, if the project uses any');
                if (historyCount) L.push(`- history/ ......... superseded revisions of those sections (${historyCount} file${historyCount!==1?'s':''})`);
                if (markupCount) L.push(`- markups/ ......... reviewers' marked-up copies (${markupCount} file${markupCount!==1?'s':''})`);
                if (mode==='full') L.push('- <project> <date>.pdf .. the compiled binder PDF');
                L.push('- READ ME.txt ...... this file');
                L.push('');
                L.push('HOW TO OPEN THIS PROJECT');
                L.push('------------------------');
                L.push('1. Open the CalcBinder app (CalcBinder.html) in Chrome or Edge.');
                L.push('   Use your team\'s shared copy — the same file everyone opens the app with.');
                L.push('   (There is no install and no sign-in.)');
                L.push('2. In the left sidebar, click "Import Project".');
                L.push('3. Choose this .calcbinder.zip file.');
                L.push('The project loads with all sections, settings, sign-off, notes and history.');
                L.push('');
                L.push('GOOD TO KNOW');
                L.push('------------');
                L.push('- This is a fully self-contained copy — you do not need to re-attach any PDFs.');
                L.push(`- Revision history: ${exportHistoryScope==='all'?'every superseded PDF is included.'
                    : exportHistoryScope==='pinned'?'the current PDFs plus anything a stamped issue or saved version points at are included.'
                    : 'only the current PDFs are included.'}`);
                if (exportHistoryScope!=='all') L.push('  Older revisions still appear in each section\'s history, marked "PDF not included".');
                L.push(`- Review markups: ${exportMarkupScope==='all'?'every marked-up copy is included.'
                    : exportMarkupScope==='section'?'section redlines are included; marked-up binder copies are not.'
                    : 'none of the marked-up PDFs are included.'}`);
                if (exportMarkupScope!=='all') L.push('  The markup log still travels — who reviewed what, and when — marked "PDF not included".');
                L.push('- Stamped issues (Permit Set, 50% CD, and so on) travel with the project.');
                L.push('- CalcBinder saves your work in your browser only. After meaningful edits,');
                L.push('  export again and share the new zip so others get your changes.');
                L.push('- If you already have this project, CalcBinder will ask whether to overwrite');
                L.push('  your copy (keeping the combined history) or import a separate copy.');
                L.push('');
                L.push(`Generated by CalcBinder build ${BUILD_ID}.`);
                return L.join('\n');
            };
            // Open the export modal after measuring sizes (per-mode estimate computed in the modal)
            const handleOpenExport = async () => {
                try {
                    const curRec = fullSerializableRecord();
                    const allKeys = gatherAllReferencedKeys(curRec, snapshots, issues);
                    const curKeys = currentBlobKeysOfRecord(curRec);
                    const pinKeys = pinnedExportKeys(curRec, snapshots, issues);
                    const mk = gatherMarkupKeys(curRec, snapshots, issues);
                    let sourceBytes = 0, sectionBytes = 0, currentBytes = 0, pinnedBytes = 0;
                    let markupBytes = 0, sectionMarkupBytes = 0, fileCount = 0;
                    const sectionKeys = new Set((curRec.files||[]).map(f=>f.blobKey).filter(Boolean));
                    for (const k of allKeys) {
                        const b = await idb.getBlob(k); if (!b) continue;
                        // A markup blob is never a "bundled file" and never history —
                        // counting it in both places would double-bill the estimate.
                        if (mk.all.has(k)) {
                            markupBytes += b.size;
                            if (mk.section.has(k)) sectionMarkupBytes += b.size;
                            continue;
                        }
