                        fileCount++;
                        sourceBytes += b.size;
                        if (sectionKeys.has(k)) sectionBytes += b.size;
                        if (curKeys.has(k)) currentBytes += b.size;
                        if (pinKeys.has(k)) pinnedBytes += b.size;
                    }
                    setExportInfo({ sections: files.length, fileCount, sourceBytes, sectionBytes,
                        currentBytes, currentCount: curKeys.size, pinnedBytes, pinnedCount: pinKeys.size,
                        markupBytes, markupCount: mk.all.size, sectionMarkupBytes, sectionMarkupCount: mk.section.size });
                    setExportNote('');
                    setExportMode('full');
                    setExportMarkupScope('all');
                    setShowExportModal(true);
                } catch(e) { alert("Could not prepare export: " + e.message); }
            };
            // Build a .calcbinder.zip (manifest + section PDFs + assets [+ binder]) or, for
            // 'binder' mode, just download the compiled PDF.
            const doExportProject = async () => {
                setExporting(true);
                try {
                    const now = new Date().toISOString();
                    const actor = currentActor();

                    // ---- Binder-only mode: same output as Download PDF, logged but no version bump ----
                    if (exportMode === 'binder') {
                        const bytes = await getBinderBytes();
                        if (!bytes) throw new Error("Could not generate the binder PDF.");
                        const blob = new Blob([bytes], { type: 'application/pdf' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url;
                        a.download = binderFileName();
                        document.body.appendChild(a); a.click(); document.body.removeChild(a);
                        setTimeout(()=>URL.revokeObjectURL(url), 4000);
                        setAudit(prev => [...prev, makeAuditEntry('exported', actor, { version: projectVersion, note: exportNote||null, summary: 'Binder PDF exported' })]);
                        setLastExportedAt(now); setContentDirty(false);
                        setShowExportModal(false);
                        return;
                    }

                    // ---- Full / Sources modes: build a zip, bump version, snapshot, audit ----
                    if (typeof window.JSZip === 'undefined') throw new Error("Zip library (JSZip) not loaded.");
                    const curRec = fullSerializableRecord();
                    const newVersion = projectVersion + 1;
                    const prevSnap = snapshots[snapshots.length - 1];
                    const changes = diffProjects(prevSnap ? stateForDiffFromRecord(prevSnap.record) : null, stateForDiffFromRecord(curRec));
                    const newSnap = { version: newVersion, ts: now, actor, note: exportNote||null, record: curRec };
                    const newSnapshots = [...snapshots, newSnap];
                    const exportEntry = makeAuditEntry('exported', actor, { version: newVersion, note: exportNote||null, diff: changes, summary: `Exported v${newVersion} — ${exportMode==='sources'?'sources only':'full project'}` });
                    const newAudit = [...audit, exportEntry];

                    const zip = new window.JSZip();
                    // Bundle every referenced blob once; build blobKey → in-zip path map
                    const blobFiles = {};
                    const usedNames = new Set();
                    const uniquePath = (path) => {
                        const dot = path.lastIndexOf('.'); const base = dot>0?path.slice(0,dot):path; const ext = dot>0?path.slice(dot):'';
                        let out = path, n = 2;
                        while (usedNames.has(out.toLowerCase())) { out = `${base} (${n})${ext}`; n++; }
                        usedNames.add(out.toLowerCase()); return out;
                    };
                    const numbered = numberedFiles;
                    // Current section PDFs — human-readable names
                    for (const f of numbered) {
                        if (!f.blobKey || blobFiles[f.blobKey]) continue;
                        const b = await idb.getBlob(f.blobKey); if (!b) continue;
                        const rawName = (f.name || f.sectionTitle || 'section').replace(/\.pdf$/i,'');
                        const path = uniquePath(`sections/${safeReadableName(`${f.sectionLabel} ${rawName}`)}.pdf`);
                        zip.file(path, b); blobFiles[f.blobKey] = path;
                    }
                    // Current assets
                    const addAsset = async (key, base) => {
                        if (!key || blobFiles[key]) return;
                        const b = await idb.getBlob(key); if (!b) return;
                        const path = uniquePath(`assets/${base}.${extFromType(b.type)}`);
                        zip.file(path, b); blobFiles[key] = path;
                    };
                    await addAsset(logoBlobKey, 'logo');
                    await addAsset(coverImageBlobKey, 'cover');
                    await addAsset(customCoverBlobKey, 'custom-cover');
                    // Review markups → markups/, on their own scope. This runs BEFORE the
                    // history loop on purpose: gatherAllReferencedKeys can see markup
                    // blobs, and without this they would land in history/ and quietly
                    // ignore whatever the user chose on the markup axis.
                    const mkKeys = gatherMarkupKeys(curRec, newSnapshots, issues);
                    const markupKeys = exportMarkupScope === 'none' ? new Set()
                        : exportMarkupScope === 'section' ? mkKeys.section
                        : mkKeys.all;
                    for (const key of markupKeys) {
                        if (blobFiles[key]) continue;
                        const b = await idb.getBlob(key); if (!b) continue;
                        const path = uniquePath(`markups/${key}.${extFromType(b.type,'pdf')}`);
                        zip.file(path, b); blobFiles[key] = path;
                    }
                    const markupCount = Object.keys(blobFiles).filter(k=>blobFiles[k].startsWith('markups/')).length;
                    // Remaining referenced blobs → history/, as far as the chosen scope allows.
                    // Current section PDFs and assets are already in blobFiles, so they ride
                    // along under every scope; this loop only decides about the older ones.
                    const historyKeys = exportHistoryScope === 'none' ? new Set()
                        : exportHistoryScope === 'pinned' ? pinnedExportKeys(curRec, newSnapshots, issues)
                        : new Set(gatherAllReferencedKeys(curRec, newSnapshots, issues));
                    for (const key of historyKeys) {
                        if (blobFiles[key] || mkKeys.all.has(key)) continue;
                        const b = await idb.getBlob(key); if (!b) continue;
                        const path = uniquePath(`history/${key}.${extFromType(b.type,'pdf')}`);
                        zip.file(path, b); blobFiles[key] = path;
                    }
                    const historyCount = Object.keys(blobFiles).filter(k=>blobFiles[k].startsWith('history/')).length;
                    // A revision whose PDF was left out still belongs in the log — it just
                    // cannot be viewed or restored on the other side, and says so.
                    // Same for a markup: who reviewed what and when is the record, and it
                    // travels either way. Only the red ink itself can be left behind.
                    const markAbsentMarkups = (list) => (list||[]).map(m => (m && m.blobKey && !blobFiles[m.blobKey]) ? { ...m, blobKey:null, absent:true } : m);
                    const markAbsent = (f) => ({ ...f,
                        revisions: (f.revisions||[]).map(r => {
                            if (!r) return r;
                            const g = (Array.isArray(r.markups) && r.markups.length) ? { ...r, markups: markAbsentMarkups(r.markups) } : r;
                            return (g.blobKey && !blobFiles[g.blobKey]) ? { ...g, blobKey:null, absent:true } : g;
                        }) });
                    const stripRecord = (r) => r ? { ...r, markups: markAbsentMarkups(r.markups), files: (r.files||[]).map(f => {
                        const g = markAbsent(f);
                        return { ...g, blobKey: (f.blobKey && blobFiles[f.blobKey]) ? f.blobKey : null };
                    }) } : r;
                    // Compiled binder PDF (full mode only)
                    if (exportMode === 'full') {
                        const binderBytes = await getBinderBytes();
                        if (binderBytes) zip.file(binderFileName(), binderBytes);
                    }
                    // A plain-text READ ME explaining the contents + how to import
                    const sectionCount = Object.keys(blobFiles).filter(k=>blobFiles[k].startsWith('sections/')).length;
                    zip.file('READ ME.txt', buildReadme(exportMode, sectionCount, actor, historyCount, markupCount));
                    // Manifest
                    const manifest = {
                        format: CALCBINDER_FORMAT,
                        version: CALCBINDER_VERSION,
                        container: 'zip',
                        exportMode,
                        exportedAt: now,
                        appBuild: BUILD_ID,
                        exporter: actor,
                        note: exportNote || null,
                        project: {
                            uuid: projectUuid,
                            version: newVersion,
                            projectMeta,
                            files: numbered.map(({fileObj, downloadURL, sectionLabel, ...r}) => markAbsent(r)), // keep blobKey
                            logoBlobKey, coverImageBlobKey, customCoverBlobKey,
                            logoScale: parseFloat(logoScale) || 1,
                            themeColor, pageNumberPos, showPageHeader,
                            bookmarksEnabled, appendixEnabled, watermarkEnabled, watermarkText, watermarkPages,
                            comments,
                            markups: markAbsentMarkups(binderMarkups),
                            audit: newAudit,
                            snapshots: newSnapshots.map(sn => sn ? { ...sn, record: stripRecord(sn.record) } : sn),
                            issues: (issues||[]).map(i => i ? { ...i, record: stripRecord(i.record) } : i),
                            schema: CB_SCHEMA,
                        },
                        historyScope: exportHistoryScope,
                        markupScope: exportMarkupScope,
                        blobFiles,
                    };
                    zip.file('manifest.json', JSON.stringify(manifest, null, 2));

                    const outBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 3 } });
                    const url = URL.createObjectURL(outBlob);
                    const a = document.createElement('a'); a.href = url;
                    a.download = `${safeReadableName(projectMeta.title || projectMeta.number || 'project')}.calcbinder.zip`;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    setTimeout(()=>URL.revokeObjectURL(url), 4000);

                    // Commit the new version/history locally (persisted by autosave)
                    setProjectVersion(newVersion);
                    setSnapshots(newSnapshots);
                    setAudit(newAudit);
                    setLastExportedAt(now); setContentDirty(false);
                    setShowExportModal(false);
                    gcBlobs(); // reclaim any orphaned blobs (kept ones are held by current state or snapshots)
                } catch(e) {
                    console.error("Export failed", e);
                    alert("Export failed: " + e.message);
                } finally {
                    setExporting(false);
                }
            };
            // Read a .calcbinder.zip (Stage 3) or legacy .calcbinder JSON (Stage 2) → rebuild a project.
            const handleImportProjectFile = async (e) => {
                const file = e.target.files?.[0];
                if (file) await importProjectFromFile(file);
                if (importProjectInputRef.current) importProjectInputRef.current.value = '';
            };
            // Normalize either container into { manifest, allKeys, loadBlobByKey(oldKey)->Blob }
            const parseImportFile = async (file) => {
                const buf = await file.arrayBuffer();
                const head = new Uint8Array(buf.slice(0, 4));
                const isZip = head[0]===0x50 && head[1]===0x4B && (head[2]===0x03||head[2]===0x05||head[2]===0x07);
                if (isZip) {
                    if (typeof window.JSZip === 'undefined') throw new Error("Zip library (JSZip) not loaded.");
                    const zip = await window.JSZip.loadAsync(buf);
                    const mf = zip.file('manifest.json');
                    if (!mf) throw new Error("No manifest.json found in this archive.");
                    const manifest = JSON.parse(await mf.async('string'));
                    if (manifest.format !== CALCBINDER_FORMAT || !manifest.project) throw new Error("This archive is not a CalcBinder project.");
                    const loadBlobByKey = async (key) => {
                        const path = manifest.blobFiles?.[key]; if (!path) return null;
                        const f = zip.file(path); if (!f) return null;
                        return new Blob([await f.async('arraybuffer')], { type: typeFromPath(path) });
                    };
                    return { manifest, allKeys: Object.keys(manifest.blobFiles||{}), loadBlobByKey };
                }
                // Legacy Stage 2 JSON (.calcbinder), base64-embedded blobs
                const data = JSON.parse(new TextDecoder().decode(buf));
                if (data.format !== CALCBINDER_FORMAT || !data.project) throw new Error("This is not a valid .calcbinder file.");
                const blobs = data.blobs || {};
                const project = upgradeProjectRecord({ ...data.project }); // add uuid/version/audit/snapshots if missing
                const manifest = { format: data.format, version: data.version||1, exporter: data.exporter||null, note: data.note||null, project };
                const loadBlobByKey = async (key) => { const e2 = blobs[key]; return e2 ? new Blob([base64ToBytes(e2.data)], { type: e2.type||'application/octet-stream' }) : null; };
                return { manifest, allKeys: Object.keys(blobs), loadBlobByKey };
            };
            const importProjectFromFile = async (file) => {
                setImportingProject(true);
                try {
                    const parsed = await parseImportFile(file);
                    const incoming = parsed.manifest.project;
                    // Duplicate detection by stable UUID
                    const all = await idb.getAllProjects();
                    const existing = incoming.uuid ? all.find(p => p.uuid === incoming.uuid) : null;
                    if (existing) {
                        const changes = diffProjects(stateForDiffFromRecord(existing), stateForDiffFromRecord(incoming), { crossProject: true });
                        setImportConflict({ parsed, existing, changes });
                        setImportingProject(false);
                        return; // wait for the user's choice in ImportConflictModal
                    }
                    await finalizeImport(parsed, 'new', null);
                } catch(e) {
                    console.error("Import failed", e);
                    alert("Import failed: " + e.message);
                    setImportingProject(false);
                }
            };
            // Decode blobs → new keys, remap all references (current + snapshots), write the project.
            const finalizeImport = async (parsed, mode, existing, precomputedChanges) => {
                setImportingProject(true);
                try {
                    const { allKeys, loadBlobByKey } = parsed;
                    const p = parsed.manifest.project;
                    const now = new Date().toISOString();
                    const actor = currentActor();
                    // Decode every referenced blob under a fresh key
                    const keymap = {};
                    for (const oldKey of allKeys) {
                        const blob = await loadBlobByKey(oldKey);
                        if (!blob) continue;
                        const nk = crypto.randomUUID();
                        await idb.putBlob(nk, blob);
                        keymap[oldKey] = nk;
                    }
                    const remap = (k) => (k && keymap[k]) ? keymap[k] : null;
                    // Every blobKey in the payload has to be rewritten, including the ones
                    // inside each section's revision chain — miss those and the whole
                    // history arrives pointing at keys no blob in this browser answers to.
                    // Stage 5: markup blobKeys have to be rewritten alongside the revision
                    // ones. Miss these and every redline arrives pointing at a key no
                    // blob in this browser answers to — silently, since the record is
                    // intact and only the "view" button fails.
                    const remapMarkups = (list) => (list||[]).map(m => m ? { ...m, blobKey: remap(m.blobKey), absent: m.blobKey ? !remap(m.blobKey) : !!m.absent } : m);
                    const remapFile = ({fileObj,downloadURL,sectionLabel,...f}) => ({ ...f,
                        blobKey: remap(f.blobKey),
                        revisions: (f.revisions||[]).map(r => r ? { ...r, blobKey: remap(r.blobKey), absent: r.blobKey ? !remap(r.blobKey) : !!r.absent, markups: remapMarkups(r.markups) } : r),
                    });
                    const remapRecord = (r) => r ? ({ ...r,
                        files: (r.files||[]).map(remapFile),
                        markups: remapMarkups(r.markups),
                        logoBlobKey: remap(r.logoBlobKey), coverImageBlobKey: remap(r.coverImageBlobKey), customCoverBlobKey: remap(r.customCoverBlobKey),
                    }) : r;
                    let files = (p.files||[]).map(remapFile);
                    const incomingMarkups = remapMarkups(p.markups);
                    const countMarkups = (fs, recMs) => (fs||[]).reduce((n,f)=>n+(f.revisions||[]).reduce((k,r)=>k+markupsOfRevision(r).length,0),0) + (recMs||[]).length;
                    const incomingSnaps = (p.snapshots||[]).map(s => ({ ...s, record: remapRecord(s.record) }));
                    const incomingIssues = (p.issues||[]).filter(Boolean).map(i => ({ ...i, record: remapRecord(i.record) }));

                    let id, uuid, version, audit, snapshots, issuesOut, markupsOut, commentsOut;
                    if (mode === 'overwrite' && existing) {
                        id = existing.id; uuid = existing.uuid;
                        version = Math.max(existing.version||1, p.version||1);
                        const seen = new Set((existing.audit||[]).map(a=>a.id));
                        const mergedIncoming = (p.audit||[]).filter(a => a && a.id && !seen.has(a.id));
                        audit = [ ...(existing.audit||[]), ...mergedIncoming,
                            makeAuditEntry('imported', actor, { version: p.version, note: parsed.manifest.note||null, diff: precomputedChanges||null, summary: `Imported v${p.version} — overwrote local v${existing.version||1}` }) ];
                        const snapSeen = new Set((existing.snapshots||[]).map(s=>`${s.version}|${s.ts}`));
                        snapshots = [ ...(existing.snapshots||[]), ...incomingSnaps.filter(s=>!snapSeen.has(`${s.version}|${s.ts}`)) ];
                        const issueSeen = new Set((existing.issues||[]).map(i=>i&&i.id));
                        issuesOut = [ ...(existing.issues||[]), ...incomingIssues.filter(i=>!issueSeen.has(i.id)) ];
                        // Overwrite means "take their section list", not "throw my history away".
                        // Two people working from the same export each keep every PDF they took.
                        // QC items were being thrown away wholesale on overwrite — the
                        // incoming comments map simply replaced the local one. Merge them,
                        // and where the same item disagrees, the more open state wins.
                        commentsOut = mergeCommentMaps(existing.comments, p.comments);
                        const mkBefore = countMarkups(files, incomingMarkups);
                        const localById = new Map((existing.files||[]).map(f=>[f.id, f]));
                        let gained = 0, touched = 0;
                        files = files.map(f => {
                            const lf = localById.get(f.id);
                            if (!lf || !(lf.revisions||[]).length) return f;
                            const merged = mergeRevisionChains(lf.revisions, f.revisions, f.blobKey);
                            const add = merged.length - (f.revisions||[]).length;
                            if (add > 0) { gained += add; touched++; }
                            const head = merged.length ? merged[merged.length-1] : null;
                            return { ...f, revisions: merged, revision: head ? head.rev : f.revision,
                                blobKey: (head && head.blobKey) ? head.blobKey : f.blobKey };
                        });
                        if (gained > 0) audit.push(makeAuditEntry('revisions-merged', actor, { version,
                            summary: `Merged ${gained} revision${gained===1?'':'s'} from your local copy into ${touched} section${touched===1?'':'s'}`,
                            detail: 'The incoming project did not carry these revisions; they were kept from your copy rather than dropped.' }));
                        // Section markups rode in on mergeRevisionChains; binder markups
                        // have no chain to ride, so they union here.
                        markupsOut = mergeMarkupLists(existing.markups, incomingMarkups);
                        const mkGained = countMarkups(files, markupsOut) - mkBefore;
                        if (mkGained > 0) audit.push(makeAuditEntry('markups-merged', actor, { version,
                            summary: `Kept ${mkGained} review markup${mkGained===1?'':'s'} from your local copy`,
                            detail: 'The incoming project did not carry these markups; they were kept from your copy rather than dropped.' }));
                    } else if (mode === 'copy') {
                        id = crypto.randomUUID(); uuid = crypto.randomUUID(); version = p.version||1;
                        audit = [ ...(p.audit||[]), makeAuditEntry('imported', actor, { version, note: parsed.manifest.note||null, summary: 'Imported as a separate copy' }) ];
                        snapshots = incomingSnaps; issuesOut = incomingIssues;
                        markupsOut = incomingMarkups; commentsOut = p.comments || {};
                    } else { // new
                        id = crypto.randomUUID(); uuid = p.uuid || crypto.randomUUID(); version = p.version||1;
                        audit = [ ...(p.audit||[]), makeAuditEntry('imported', actor, { version, note: parsed.manifest.note||null, summary: `Imported v${version}` }) ];
                        snapshots = incomingSnaps; issuesOut = incomingIssues;
                        markupsOut = incomingMarkups; commentsOut = p.comments || {};
                    }

                    const rec = {
                        id, uuid, version,
                        projectMeta: p.projectMeta || { title:'Imported Project', number:'', client:'', date: now.split('T')[0], description:'', docType:'CALCULATION PACKAGE' },
                        files,
                        logoBlobKey: remap(p.logoBlobKey), coverImageBlobKey: remap(p.coverImageBlobKey), customCoverBlobKey: remap(p.customCoverBlobKey),
                        logoScale: p.logoScale !== undefined ? p.logoScale : 1,
                        themeColor: p.themeColor || '#377F99',
                        pageNumberPos: p.pageNumberPos || 'right',
                        showPageHeader: p.showPageHeader !== undefined ? p.showPageHeader : true,
                        bookmarksEnabled: p.bookmarksEnabled !== undefined ? p.bookmarksEnabled : true,
                        appendixEnabled: p.appendixEnabled !== undefined ? p.appendixEnabled : true,
                        watermarkEnabled: !!p.watermarkEnabled,
                        watermarkText: p.watermarkText !== undefined ? p.watermarkText : 'DRAFT',
                        watermarkPages: p.watermarkPages || 'all',
                        comments: commentsOut || {},
                        markups: markupsOut || [],
                        audit, snapshots, issues: issuesOut || [],
                        lastExportedAt: null, contentDirty: false,
                        lastModified: now,
                    };
                    await idb.putProject(rec);
                    setProjects(prev => {
                        const others = prev.filter(x => x.id !== id);
                        return [{ id, projectMeta: rec.projectMeta, lastModified: now }, ...others].sort((a,b)=>new Date(b.lastModified)-new Date(a.lastModified));
                    });
                    hydratedProjectRef.current = null; // force a fresh hydrate even if id is already active (overwrite)
                    if (activeProjectId === id) { const keep = id; setActiveProjectId(null); setTimeout(()=>setActiveProjectId(keep), 0); }
                    else setActiveProjectId(id);
                    setImportConflict(null);
                    alert(`✓ Imported "${rec.projectMeta.title || 'project'}" (v${version}) with ${files.length} section(s).`);
                } catch(e) {
                    console.error("Import failed", e);
                    alert("Import failed: " + e.message);
                } finally {
                    setImportingProject(false);
                }
            };
            // ── AUDIT LOG + ROLLBACK + BLOB GC (Stage 3 M4/M6) ────────────────────────
            // Append an audit entry attributed to the current user (persisted by autosave).
            const logAudit = (action, extra={}) => setAudit(prev => [...prev, makeAuditEntry(action, currentActor(), { version: projectVersion, ...extra })]);
            const sectionLabelOf = (id) => { const f = computeLabels(files).find(x=>x.id===id); return f ? f.sectionLabel : ''; };
            // Content-only fields of a full record (for snapshots / applying a rollback)
            const contentOf = (r) => ({
                projectMeta: r.projectMeta,
                files: (r.files||[]).map(({fileObj,downloadURL,sectionLabel,...f})=>f),
                logoBlobKey: r.logoBlobKey||null, coverImageBlobKey: r.coverImageBlobKey||null, customCoverBlobKey: r.customCoverBlobKey||null,
                logoScale: r.logoScale!==undefined?r.logoScale:1,
                themeColor: r.themeColor||'#377F99',
                pageNumberPos: r.pageNumberPos||'right',
                showPageHeader: r.showPageHeader!==undefined?r.showPageHeader:true,
                bookmarksEnabled: r.bookmarksEnabled!==undefined?r.bookmarksEnabled:true,
                appendixEnabled: r.appendixEnabled!==undefined?r.appendixEnabled:true,
                watermarkEnabled: !!r.watermarkEnabled,
                watermarkText: r.watermarkText!==undefined?r.watermarkText:'DRAFT',
                watermarkPages: r.watermarkPages||'all',
                comments: r.comments||{},
            });
            // Delete blobs not referenced by any project's current state OR any snapshot.
            const gcBlobs = async () => {
                try {
                    const all = await idb.getAllProjects();
                    const referenced = new Set();
                    for (const p of all) {
                        blobKeysOfRecord(p).forEach(k=>referenced.add(k));
                        (p.snapshots||[]).forEach(s => s.record && blobKeysOfRecord(s.record).forEach(k=>referenced.add(k)));
                        (p.issues||[]).forEach(i => i && i.record && blobKeysOfRecord(i.record).forEach(k=>referenced.add(k)));
                    }
                    const keys = await idb.getAllBlobKeys();
                    for (const k of keys) if (!referenced.has(k)) await idb.deleteBlob(k);
                } catch(e) { console.warn("Blob GC failed:", e); }
            };
            // ── STAGE 4 · STORAGE ACCOUNTING ─────────────────────────────────────
            // Walks IndexedDB, not React state, for the same reason gcBlobs does: what is
            // on disk is the only number worth showing the user.
            const scanStorage = async () => {
                setScanningStorage(true);
                try {
                    const all = await idb.getAllProjects();
                    const sizes = new Map();
                    try {
                        (await idb.getAllBlobs()).forEach(r=>{ if(r&&r.id!==undefined) sizes.set(r.id, (r.blob&&r.blob.size)||0); });
                    } catch(e) {
                        const keys = await idb.getAllBlobKeys();
                        for (const k of keys) { try { const b = await idb.getBlob(k); sizes.set(k,(b&&b.size)||0); } catch(e2){ sizes.set(k,0); } }
                    }
                    const bytesOf = (keys) => [...keys].reduce((n,k)=> n + (sizes.get(k)||0), 0);
                    const curAll = new Set(), refAll = new Set(), mkAll = new Set();
                    const rows = all.map(p => {
                        const cur = currentBlobKeysOfRecord(p);
                        const ref = new Set(blobKeysOfRecord(p));
                        (p.snapshots||[]).forEach(s => s && s.record && blobKeysOfRecord(s.record).forEach(k=>ref.add(k)));
                        (p.issues||[]).forEach(i => i && i.record && blobKeysOfRecord(i.record).forEach(k=>ref.add(k)));
                        // Markups are referenced, but they are not history: a prune will never
                        // free one. Counting them under "kept history" would promise back space
                        // that pruning cannot deliver, so they are pulled out into their own bucket.
                        const mk = markupKeysOfRecord(p);
                        (p.snapshots||[]).forEach(s => s && s.record && markupKeysOfRecord(s.record).forEach(k=>mk.add(k)));
                        (p.issues||[]).forEach(i => i && i.record && markupKeysOfRecord(i.record).forEach(k=>mk.add(k)));
                        cur.forEach(k=>curAll.add(k)); ref.forEach(k=>refAll.add(k)); mk.forEach(k=>mkAll.add(k));
                        const hist = [...ref].filter(k=>!cur.has(k) && !mk.has(k));
                        const live = (p.files||[]).filter(f=>!f.isHeader);
                        return {
                            id: p.id,
                            active: p.id === activeProjectIdRef.current,
                            name: (p.projectMeta && (p.projectMeta.title || p.projectMeta.number)) || 'Untitled project',
                            sections: live.length,
                            superseded: live.reduce((n,f)=> n + Math.max(0, ((f.revisions||[]).length) - 1), 0),
                            snapshots: (p.snapshots||[]).length,
                            issues: (p.issues||[]).length,
                            markups: mk.size,
                            currentBytes: bytesOf(cur),
                            historyBytes: bytesOf(hist),
                            markupBytes: bytesOf([...mk]),
                        };
                    });
                    const allKeys = [...sizes.keys()];
                    const history = allKeys.filter(k=> refAll.has(k) && !curAll.has(k) && !mkAll.has(k));
                    const markupKeys = allKeys.filter(k=> mkAll.has(k));
                    const orphans = allKeys.filter(k=> !refAll.has(k));
                    let quota = null;
                    try { if (navigator.storage && navigator.storage.estimate) quota = await navigator.storage.estimate(); } catch(e) {}
                    try { if (navigator.storage && navigator.storage.persisted) setPersistState({ supported: !!navigator.storage.persist, persisted: await navigator.storage.persisted() }); } catch(e) {}
                    setStorageStats({
                        blobs: allKeys.length,
                        totalBytes: bytesOf(allKeys),
                        currentBytes: bytesOf(curAll), currentCount: curAll.size,
                        historyBytes: bytesOf(history), historyCount: history.length,
                        markupBytes: bytesOf(markupKeys), markupCount: markupKeys.length,
                        orphanBytes: bytesOf(orphans), orphanCount: orphans.length,
                        quota: quota ? { usage: quota.usage, quota: quota.quota } : null,
                        rows, scannedAt: new Date().toISOString(),
                    });
                } catch(e) { console.error('Storage scan failed', e); setStorageStats({ error: e.message }); }
                finally { setScanningStorage(false); }
            };
            // Ask the browser not to evict this origin. It can say no; that is not an error.
            const requestPersistence = async () => {
                try {
                    if (!(navigator.storage && navigator.storage.persist)) { alert("This browser doesn't offer persistent storage. Keep exporting .calcbinder backups — that is the copy that always survives."); return; }
                    const ok = await navigator.storage.persist();
                    setPersistState({ supported:true, persisted: !!ok });
                    if (!ok) alert("The browser declined for now. It often grants persistence later, once the app has been used a few times or bookmarked. Your projects are still saved — they are just evictable if the disk runs very low.");
                } catch(e) { console.error('Persistence request failed', e); }
            };
            // Every revision identity a snapshot or a stamped issue points at. Pruning one of
            // these would cost the chain entry without freeing a byte — the snapshot still
            // holds the PDF — so they are protected and reported, never dropped.
            const pinnedRevisionRefs = () => {
                const revIds = new Set(), blobKeys = new Set();
                const walk = (rec) => {
                    if (!rec) return;
                    (rec.files||[]).forEach(f=>{
                        if (f.blobKey) blobKeys.add(f.blobKey);
                        (f.revisions||[]).forEach(r=>{ if(!r) return; if(r.revId) revIds.add(r.revId); if(r.blobKey) blobKeys.add(r.blobKey); });
                    });
                };
                (snapshots||[]).forEach(s => s && walk(s.record));
                (issues||[]).forEach(i => i && walk(i.record));
                return { revIds, blobKeys };
            };
            // Dry run: exactly what "keep the last N per section" would drop, and what it can't.
            const planPrune = (keepN) => {
                const keep = Math.max(1, keepN||1);
                const { revIds, blobKeys } = pinnedRevisionRefs();
                const plan = { keepN: keep, dropped:0, protectedCount:0, markupPinned:0, sections:[], keepBySection:{} };
                computeLabels(files).forEach(f=>{
                    if (f.isHeader) return;
                    const chain = f.revisions||[];
                    if (chain.length <= 1) return;
                    const cut = Math.max(0, chain.length - keep);   // entries before this index are candidates
                    let prot = 0, mk = 0;
                    const kept = chain.filter((rv,i)=>{
                        if (i >= cut) return true;                                              // inside the keep window
                        if (revIds.has(rv.revId) || (rv.blobKey && blobKeys.has(rv.blobKey))) { prot++; return true; }
                        // Stage 5: a revision someone actually wrote on is the one revision
                        // you cannot throw away. The markup is anchored to it — drop the
                        // revision and the redline points at pages that no longer exist.
                        // Pruning exists to reclaim space, not to erase a review.
                        if (markupsOfRevision(rv).length) { mk++; return true; }
                        return false;
                    });
                    const drop = chain.length - kept.length;
                    if (drop>0 || prot>0 || mk>0) plan.sections.push({ id:f.id, name:`${f.sectionLabel} ${f.sectionTitle||f.name||''}`.trim(), had:chain.length, kept:kept.length, dropped:drop, protectedCount:prot, markupPinned:mk });
                    if (drop>0) plan.keepBySection[f.id] = kept;
                    plan.dropped += drop; plan.protectedCount += prot; plan.markupPinned += mk;
                });
                return plan;
            };
            // Apply it. Order matters: prune the stored record FIRST, then React state, then
            // collect. gcBlobs reads IndexedDB — if the write came last, the 2s autosave
            // would put the dropped revisions back and the collection would spare their PDFs.
            const applyPrune = async (keepN) => {
                if (!activeProjectId || hydratedProjectRef.current !== activeProjectId) return null;
                const plan = planPrune(keepN);
                if (plan.dropped === 0) return plan;
                setPruning(true);
                try {
                    const d = upgradeProjectRecord(await idb.getProject(activeProjectId));
                    const prunedFiles = (d.files||[]).map(f=>{
                        const kept = plan.keepBySection[f.id];
                        return kept ? { ...f, revisions: kept.map(r=>({...r})) } : f;
                    });
                    const now = new Date().toISOString();
                    const detail = `Pruned ${plan.dropped} superseded revision${plan.dropped===1?'':'s'} — kept the last ${plan.keepN} of each section${plan.protectedCount?`; ${plan.protectedCount} older one${plan.protectedCount===1?'':'s'} kept because an issue or saved version pins ${plan.protectedCount===1?'it':'them'}`:''}${plan.markupPinned?`; ${plan.markupPinned} kept because a reviewer marked ${plan.markupPinned===1?'it':'them'} up`:''}`;
                    const nextAudit = [...(d.audit||[]), makeAuditEntry('history-pruned', currentActor(), { version: d.version||projectVersion, detail, summary: detail })];
                    await idb.putProject({ ...d, files: prunedFiles, audit: nextAudit, contentDirty:true, lastModified: now });
                    setFiles(prev=>prev.map(f=>{ const kept = plan.keepBySection[f.id]; return kept ? { ...f, revisions: kept.map(r=>({...r})) } : f; }));
                    setAudit(nextAudit);
                    setContentDirty(true);
                    await gcBlobs();
                    await scanStorage();
                    return plan;
                } catch(e) { console.error('Prune failed', e); alert('Prune failed: ' + e.message); return null; }
                finally { setPruning(false); }
            };
            // Re-hydrate the active project from IndexedDB (used after rollback/overwrite)
            const rehydrateActive = () => {
                hydratedProjectRef.current = null;
                const keep = activeProjectIdRef.current;
                setActiveProjectId(null);
                setTimeout(()=>setActiveProjectId(keep), 0);
            };
            // Full-project rollback to a snapshot — append-only (current state is snapshotted first).
            const rollbackToSnapshot = async (snapVersion) => {
                try {
                    const d = upgradeProjectRecord(await idb.getProject(activeProjectId));
                    const snap = (d.snapshots||[]).find(s=>s.version===snapVersion);
                    if (!snap || !snap.record) { alert("That version's snapshot isn't available."); return; }
                    const now = new Date().toISOString(); const actor = currentActor();
                    const snaps = [...(d.snapshots||[])];
                    // preserve current state so nothing is lost
                    if (!snaps.some(s=>s.version===d.version)) snaps.push({ version:d.version, ts:now, actor, note:'auto-saved before rollback', record: contentOf(d) });
                    const newVersion = (d.version||1) + 1;
                    const diff = diffProjects(stateForDiffFromRecord(d), stateForDiffFromRecord(snap.record));
                    const audit = [...(d.audit||[]), makeAuditEntry('rolled-back', actor, { version:newVersion, summary:`Rolled back to v${snap.version}`, diff })];
                    // Snapshot records are stored pre-migration (so import's version|ts dedup stays
                    // stable), so bring the restored content up to the current shape on the way out.
                    const restored = contentOf(snap.record);
                    (restored.files||[]).forEach(upgradeFileRecord);
                    restored.comments = upgradeComments(restored.comments||{});
                    const rec = { ...d, ...restored, version:newVersion, snapshots:snaps, audit, contentDirty:true, lastModified:now };
                    await idb.putProject(rec);
                    await gcBlobs();
                    setShowAuditModal(false);
                    rehydrateActive();
                    setProjects(prev=>prev.map(p=>p.id===activeProjectId?{...p,projectMeta:rec.projectMeta,lastModified:now}:p));
                } catch(e) { console.error(e); alert("Rollback failed: " + e.message); }
            };
            // Section-level rollback — revert one section's PDF/metadata from a snapshot.
            const rollbackSection = async (sectionId, snapVersion) => {
                try {
                    const d = upgradeProjectRecord(await idb.getProject(activeProjectId));
                    const snap = (d.snapshots||[]).find(s=>s.version===snapVersion);
                    const snapFile = snap && (snap.record.files||[]).find(f=>f.id===sectionId);
                    if (!snapFile) { alert("That section isn't present in the selected version."); return; }
                    const now = new Date().toISOString(); const actor = currentActor();
                    const snaps = [...(d.snapshots||[])];
                    if (!snaps.some(s=>s.version===d.version)) snaps.push({ version:d.version, ts:now, actor, note:'auto-saved before section rollback', record: contentOf(d) });
                    const exists = (d.files||[]).some(f=>f.id===sectionId);
                    const restoredFile = upgradeFileRecord({...snapFile});
                    const files = exists ? (d.files||[]).map(f=>f.id===sectionId?restoredFile:f) : [...(d.files||[]), restoredFile];
                    const newVersion = (d.version||1) + 1;
                    const lbl = computeLabels(files).find(f=>f.id===sectionId)?.sectionLabel || '';
                    const audit = [...(d.audit||[]), makeAuditEntry('rolled-back', actor, { version:newVersion, sectionId, sectionLabel:lbl, summary:`Reverted ${lbl} ${snapFile.sectionTitle||''} to v${snap.version}`.trim() })];
                    const rec = { ...d, files, version:newVersion, snapshots:snaps, audit, contentDirty:true, lastModified:now };
                    await idb.putProject(rec);
                    await gcBlobs();
                    setShowAuditModal(false);
                    rehydrateActive();
                } catch(e) { console.error(e); alert("Section rollback failed: " + e.message); }
            };
            // ── END EXPORT / IMPORT PROJECT ───────────────────────────────────────────

            const handleImportBinder = async (parsed) => {
                try {
                    const { PDFDocument } = window.PDFLib;
                    const date = new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
                    const sections = parsed.sections;

                    // Load the original binder bytes (stored on parsed object during parse)
                    const binderPdfDoc = await PDFDocument.load(parsed.binderBytes, { ignoreEncryption: true });

                    const importedFiles = [];

                    for (let i = 0; i < sections.length; i++) {
                        const s = sections[i];
                        const next = sections[i + 1];

                        // Update progress
                        setImportProgress({ current: i + 1, total: sections.length, name: s.title });

                        // Content pages. The number shown in the TOC equals the 0-based PDF
                        // page index (cover = index 0 with no number; footer prints i for i>=1,
                        // so shown page N sits at index N). The divider is therefore at index
                        // s.pageNum; content runs from the next page to just before the next divider.
                        const dividerIdx = s.pageNum;          // 0-based index of divider page
                        const contentStart = dividerIdx + 1;   // first content page (0-based)
                        const contentEnd = next
                            ? next.pageNum - 1                  // last content page before next divider
                            : binderPdfDoc.getPageCount() - 1; // last page of doc

                        let blobKey = null;
                        let actualPageCount = s.rawPages;
                        let isPlaceholder = true;
                        let sectionSize = null;

                        if (contentStart <= contentEnd && contentEnd < binderPdfDoc.getPageCount()) {
                            try {
                                // Extract content pages into a new PDF
                                const sectionPdf = await PDFDocument.create();
                                const pageIndices = [];
                                for (let p = contentStart; p <= contentEnd; p++) pageIndices.push(p);
                                const copiedPages = await sectionPdf.copyPages(binderPdfDoc, pageIndices);
                                copiedPages.forEach(p => sectionPdf.addPage(p));
                                actualPageCount = sectionPdf.getPageCount();

                                const sectionBytes = await sectionPdf.save();
                                sectionSize = sectionBytes.length;
                                blobKey = crypto.randomUUID();
                                await idb.putBlob(blobKey, new Blob([sectionBytes], { type: 'application/pdf' }));
                                isPlaceholder = false;
                            } catch(e) {
                                console.warn(`Could not extract pages for section ${s.label}:`, e);
                                // Fall back to placeholder
                            }
                        }

                        importedFiles.push({
                            id: crypto.randomUUID(),
                            name: `${s.label} ${s.title}.pdf`,
                            blobKey,
                            sectionTitle: s.title,
                            sectionSubtitle: s.subtitle || '',
                            designedBy:   s.designedBy   || '',
                            designedDate: s.designedDate  || '',
                            checkedBy:    s.checkedBy     || '',
                            checkedDate:  s.checkedDate   || '',
                            qcReviewBy:   s.qcReviewBy    || '',
                            qcReviewDate: s.qcReviewDate  || '',
                            revision: s.revision || '0',
                            status: 'draft',
                            uploadDate: date,
                            pageCount: actualPageCount,
                            rawPages: actualPageCount,
                            size: 'N/A',
                            depth: s.depth,
                            isPlaceholder,
                            isCollapsed: false,
                            customFields: s.customFields || [
                                { label:"Objective / Scope",        value:'', isVisible:true },
                                { label:"Design Code / References", value:'', isVisible:true },
                                { label:"Computer Program",         value:'', isVisible:true },
                                { label:"Conclusions",              value:'', isVisible:true },
                            ],
                            objective: '', program: '',
                            // The imported PDF becomes Rev 0 of this section's chain. A revision
                            // label read off the divider is treated as human-authored, so it is
                            // locked and auto-numbering works around it later.
                            revisions: blobKey ? [ makeRevision({
                                rev: String(s.revision || '0'),
                                revLocked: !!(s.revision && String(s.revision) !== '0'),
                                blobKey, name: `${s.label} ${s.title}.pdf`,
                                pageCount: actualPageCount, size: sectionSize,
                                actor: currentActor(), reason: 'import',
                            }) ] : [],
                            lastModifiedAt: new Date().toISOString(),
                        });
                    }

                    setImportProgress(null);

                    // Format date
                    let isoDate = new Date().toISOString().split('T')[0];
                    if (parsed.meta.date) {
                        const d = new Date(parsed.meta.date);
                        if (!isNaN(d)) isoDate = d.toISOString().split('T')[0];
                    }

                    const newId = crypto.randomUUID();
                    const lastModified = new Date().toISOString();
                    const rec = {
                        id: newId,
                        projectMeta: {
                            title: parsed.meta.title || 'Imported Project',
                            number: parsed.meta.number || '',
                            client: parsed.meta.client || '',
                            date: isoDate,
                            description: '',
                            docType: parsed.meta.docType || 'CALCULATION PACKAGE',
                        },
                        files: importedFiles,
                        logoBlobKey: null, coverImageBlobKey: null, customCoverBlobKey: null,
                        logoScale: 1, pageNumberPos: 'right', showPageHeader: true,
                        bookmarksEnabled: true, appendixEnabled: true, watermarkEnabled: false,
                        watermarkText: 'DRAFT', watermarkPages: 'all',
                        themeColor: '#377F99',
                        comments: {},
                        uuid: crypto.randomUUID(),
                        version: 1,
                        audit: [ makeAuditEntry('created', currentActor(), { version: 1, summary: `Imported from binder PDF (${importedFiles.length} sections)` }) ],
                        snapshots: [],
                        issues: [],
                        markups: [],
                        schema: CB_SCHEMA,
                        lastModified,
                    };
                    await idb.putProject(rec);
                    setProjects(prev=>[{ id: newId, projectMeta: rec.projectMeta, lastModified }, ...prev]);

                    setActiveProjectId(newId);
                    setShowImportModal(false);

                    const extracted = importedFiles.filter(f => !f.isPlaceholder).length;
                    const placeholders = importedFiles.filter(f => f.isPlaceholder).length;
                    alert(`✓ Import complete!\n\n• ${extracted} section(s) fully extracted and saved\n• ${placeholders} section(s) created as placeholders\n\nYou may need to re-enter sign-off info and reorder sections.`);

                } catch(e) {
                    console.error("Import failed", e);
                    setImportProgress(null);
                    alert("Import failed: " + e.message);
                }
            };

            const handleCopyProject = async (e,pid) => {
                e.stopPropagation(); setIsProcessing(true);
                try {
                    const d = upgradeProjectRecord(await idb.getProject(pid));
                    if (!d) throw new Error("Not found");
                    // Duplicate blobs under new keys so the copy is fully independent
                    // Memoized by source key: a section and its own history entries share blobs,
                    // so the head/tail invariant (file.blobKey === last revision's blobKey) survives.
                    const copiedKeys = new Map();
                    const copyBlob = async (key) => { if(!key) return null; if(copiedKeys.has(key)) return copiedKeys.get(key);
                        const b=await idb.getBlob(key); if(!b) return null; const nk=crypto.randomUUID(); await idb.putBlob(nk,b); copiedKeys.set(key,nk); return nk; };
                    const newFiles = [];
                    for (const f of (d.files||[])) {
                        const revisions = [];
                        for (const r of (f.revisions||[])) revisions.push({ ...r, blobKey: await copyBlob(r.blobKey), markups: [] });
                        newFiles.push({ ...f, id: crypto.randomUUID(), blobKey: await copyBlob(f.blobKey), revisions });
                    }
                    const newId = crypto.randomUUID();
                    const lastModified = new Date().toISOString();
                    const rec = {
                        ...d,
                        id: newId,
                        uuid: crypto.randomUUID(),   // a copy is a new project, not another instance of the same one
                        version: 1,
                        projectMeta: { ...d.projectMeta, title: `${d.projectMeta.title} (Copy)`, number: `${d.projectMeta.number}-CPY` },
                        files: newFiles,
                        logoBlobKey: await copyBlob(d.logoBlobKey),
                        coverImageBlobKey: await copyBlob(d.coverImageBlobKey),
                        customCoverBlobKey: await copyBlob(d.customCoverBlobKey),
                        comments: {},
                        audit: [ makeAuditEntry('created', currentActor(), { version: 1, summary: `Copied from "${d.projectMeta?.title||'project'}"` }) ],
                        snapshots: [],
                        issues: [],
                        markups: [],
                        schema: CB_SCHEMA,
                        lastExportedAt: null,
                        lastModified,
                    };
                    await idb.putProject(rec);
                    setProjects(prev=>[{ id: newId, projectMeta: rec.projectMeta, lastModified }, ...prev]);
                    setActiveProjectId(newId);
                } catch(e) { alert("Copy failed: "+e.message); }
                finally { setIsProcessing(false); }
            };
            const handleDeleteProject = async (pid,e) => {
                e.stopPropagation();
                if (!confirm("Delete project?")) return;
                try {
                    await idb.deleteProject(pid);
                    await gcBlobs(); // reclaim this project's blobs (current + snapshots), preserving others'
                    const rem = projects.filter(p=>p.id!==pid);
                    setProjects(rem);
                    if (pid===activeProjectId) {
                        if (rem.length>0) setActiveProjectId(rem[0].id);
                        else handleCreateProject("New Project");
                    }
                } catch(e) { console.error(e); }
            };

            // --- FILE HANDLERS ---
            const storeFileBlob = async (file) => { const key = crypto.randomUUID(); await idb.putBlob(key, file); return key; };

            // ── STAGE 4: REVISION CHAINS ────────────────────────────────────────────
            // Append `entry` to a section's chain, stamping supersededAt on the outgoing head.
            // Never truncates — nothing is ever silently lost.
            // If this exact PDF is already somewhere in the project, point at the blob we
            // already have instead of storing a second copy. Returns the existing key or null.
            const findExistingBlobByHash = (hash) => {
                if (!hash) return null;
                for (const f of files) {
                    for (const r of (f.revisions||[])) {
                        if (r && r.sha256 === hash && r.blobKey) return r.blobKey;
                    }
                }
                return null;
            };
            // Markups dedup against other markups only. A redline is never byte-identical
            // to a calc, and pointing a markup at a revision's blob would tie two
            // unrelated lifetimes together for no gain.
            const findExistingMarkupBlobByHash = (hash) => {
                if (!hash) return null;
                for (const f of files) for (const r of (f.revisions||[])) for (const m of markupsOfRevision(r)) {
                    if (m && m.sha256 === hash && m.blobKey) return m.blobKey;
                }
                for (const m of (binderMarkups||[])) if (m && m.sha256 === hash && m.blobKey) return m.blobKey;
                return null;
            };
            // One read of the file answers both questions we ask of every PDF the user
            // hands us: how long is it, and has someone drawn on it?
            const scanPdf = async (file) => {
                let pageCount = 0, annots = null, stamp = null;
                try {
                    const ab = await file.arrayBuffer();
                    const doc = await window.PDFLib.PDFDocument.load(ab, {ignoreEncryption:true});
                    pageCount = doc.getPageCount();
                    annots = countMarkupAnnots(doc);
                    // Third question, free with the same read: is this a CalcBinder
                    // binder coming home? A section attach uses it as a warning; a
                    // binder attach uses it as the whole identity.
                    stamp = readBinderStamp(doc);
                } catch(e) {}
                return { pageCount, annots, stamp };
            };
            const pushRevision = (f, entry) => {
                const prev = f.revisions || [];
                const marked = prev.map((r,i) => (i === prev.length-1 && !r.supersededAt) ? { ...r, supersededAt: entry.ts } : r);
                return [...marked, entry];
            };
            // Next auto number = count of entries that don't carry a human-typed label.
            // Locked labels ("A", "IFC", "P1") are skipped over, never renumbered.
            const nextRevLabel = (revs) => {
                const used = new Set((revs||[]).filter(r=>r.revLocked).map(r=>String(r.rev)));
                // Count the whole chain, not just unlocked entries: a chain whose only
                // revision is hand-labelled ("IFC") should still advance to 1, not restart at 0.
                let n = (revs||[]).length;
                while (used.has(String(n))) n++;
                return String(n);
            };
            const processFiles = async (fileList) => {
                const arr = Array.from(fileList).filter(f=>f.name.toLowerCase().endsWith('.pdf'));
                if (!arr.length) return;
                const date = new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
                for (let i=0; i<arr.length; i++) {
                    const file = arr[i];
                    setUploadProgress({ current:i+1, total:arr.length, name:file.name });
                    let pageCount='...', rawPages=0;
                    try { const ab=await file.arrayBuffer(); const pdf=await window.PDFLib.PDFDocument.load(ab,{ignoreEncryption:true}); rawPages=pdf.getPageCount(); pageCount=rawPages; } catch(e){ pageCount='?'; }
                    let blobKey=null;
                    try { blobKey=await storeFileBlob(file); } catch(e){ console.warn("Could not save PDF to local storage:", e); }
                    const newId=crypto.randomUUID();
                    const nowTs=new Date().toISOString();
                    const rev0=makeRevision({rev:'0',blobKey,sha256:await sha256Hex(file),name:file.name,pageCount:rawPages,size:file.size,ts:nowTs,actor:currentActor(),reason:'initial'});
                    logAudit('section-added',{sectionId:newId,detail:`Added ${file.name} (${pageCount} pg)`});
                    setFiles(prev=>[...prev,{id:newId,name:file.name,blobKey,downloadURL:null,fileObj:file,sectionTitle:file.name.replace('.pdf','').replace(/_/g,' '),sectionSubtitle:'',designedBy:'',checkedBy:'',revision:'0',status:'draft',uploadDate:date,pageCount,rawPages,size:(file.size/1024/1024).toFixed(2)+' MB',depth:0,isPlaceholder:false,isCollapsed:false,objective:'',program:'',revisions:blobKey?[rev0]:[],lastModifiedAt:nowTs}]);
                }
                setUploadProgress(null);
            };
            const handleFileUpload = e => { if(e.target.files?.length) processFiles(e.target.files); };
            const handleLogoUpload = e => { const f=e.target.files[0]; if(!f) return; if(f.size>500*1024){alert("Logo must be <500KB");return;} const r=new FileReader(); r.onloadend=async()=>{ setLogoUrl(r.result); try{ const key=crypto.randomUUID(); await idb.putBlob(key,f); setLogoBlobKey(key); /* old blob reclaimed by GC (may be held by a snapshot) */ }catch(err){ console.warn("Logo save failed:", err); } }; r.readAsDataURL(f); };
            const handleCoverImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) {
                    alert("Cover image must be under 5MB.");
                    return;
                }

                // Show a base64 preview immediately, then persist the bytes to IndexedDB
                const reader = new FileReader();
                reader.onloadend = async () => {
                    setCoverImagePreview(reader.result); // local preview while saving

                    try {
                        const key = crypto.randomUUID();
                        await idb.putBlob(key, file);
                        setCoverImageBlobKey(key); // old blob reclaimed by GC (may be held by a snapshot)
                        setCoverImageUrl(reader.result); // data: URL — used by preview and generateBinder
                        setCoverImagePreview(null);
                    } catch (err) {
                        console.warn("Cover image save failed:", err);
                        // Preview stays visible this session but won't persist
                    }
                };
                reader.readAsDataURL(file);
            };
            const handleCustomCoverUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.name.toLowerCase().endsWith('.pdf')) { alert("Please upload a PDF file."); return; }
                if (file.size > 20 * 1024 * 1024) { alert("Custom cover PDF must be under 20MB."); return; }
                setCustomCoverUploading(true);
                try {
                    const key = crypto.randomUUID();
                    await idb.putBlob(key, file);
                    setCustomCoverBlobKey(key); // old blob reclaimed by GC (may be held by a snapshot)
                    const url = URL.createObjectURL(file);
                    objectUrlsRef.current.push(url);
                    setCustomCoverUrl(url);
                } catch(err) {
                    alert("Save failed: " + err.message);
                } finally {
                    setCustomCoverUploading(false);
                    if (customCoverInputRef.current) customCoverInputRef.current.value = null;
                }
            };
            const removeCustomCover = () => {
                setCustomCoverBlobKey(null); // old blob reclaimed by GC
                setCustomCoverUrl(null);
                if (customCoverInputRef.current) customCoverInputRef.current.value = null;
            };
            const removeCoverImage = () => {
                setCoverImageBlobKey(null); // old blob reclaimed by GC
                setCoverImageUrl(null);
                setCoverImagePreview(null); // clear preview too
                if (coverImageInputRef.current) coverImageInputRef.current.value = "";
            };
            const handleReplaceFile = async (e,id) => {
                const file=e.target.files[0]; if(!file) return;
                const scan=await scanPdf(file);
                const old0=files.find(f=>f.id===id);
                const head0=old0?headRevision(old0):null;
                // The guard only makes sense when there is already a calc here to be the
                // "old" one. A first upload or a placeholder has nothing to attach to.
                if (scan.annots > 0 && head0 && head0.blobKey) {
                    setRedlineGuard({ sectionId:id, file, pageCount:scan.pageCount, annots:scan.annots,
                        name:file.name, sectionLabel:sectionLabelOf(id), headRev:head0.rev, headRevId:head0.revId,
                        nextRev:nextRevLabel(old0&&old0.revisions), hadSignoff:!!(old0.checkedBy||old0.qcReviewBy) });
                    return;
                }
                await doReplaceFile(id, file, scan.pageCount);
            };
            const doReplaceFile = async (id, file, pc) => {
                const hash=await sha256Hex(file);
                // Dedup: re-uploading a PDF the project already holds costs no new bytes.
                // A null hash means we couldn't check, so we always store.
                const dupKey=findExistingBlobByHash(hash);
                let blobKey=dupKey; let deduped=!!dupKey;
                if(!blobKey){ try{ blobKey=await storeFileBlob(file); }catch(e){ console.warn("Could not save PDF to local storage:", e); } }
                const old=files.find(f=>f.id===id);
                const lbl=sectionLabelOf(id), actor=currentActor(), ts=new Date().toISOString();
                // The superseded PDF is retained in the chain — blobKeysOfRecord walks it, so GC keeps it.
                const entry=makeRevision({rev:nextRevLabel(old&&old.revisions),blobKey,sha256:hash,name:file.name,pageCount:pc,size:file.size,ts,actor,reason:'replace',
                    note:deduped?'Identical to a PDF already stored — no extra space used':null});
                // QC rule: a signature can't ride on content it never saw.
                const hadSignoff=!!(old&&(old.checkedBy||old.qcReviewBy));
                logAudit('pdf-replaced', { sectionId:id, sectionLabel:lbl, detail:`PDF changed: ${old?.name||'—'} (${old?.pageCount||'?'} pg) → ${file.name} (${pc} pg)` });
                logAudit('revision-added', { sectionId:id, sectionLabel:lbl, detail:`Rev ${entry.rev} added — previous PDF retained in history` });
                if (hadSignoff) logAudit('signoff-invalidated', { sectionId:id, sectionLabel:lbl, detail:`Sign-off cleared on PDF replace (was Checked: ${old.checkedBy||'—'}, QC: ${old.qcReviewBy||'—'}); status → Revised` });
                setFiles(prev=>prev.map(f=>f.id!==id?f:{...f,name:file.name,blobKey,downloadURL:null,fileObj:file,pageCount:pc,rawPages:pc,size:(file.size/1024/1024).toFixed(2)+' MB',
                    revision:entry.rev, revisions:pushRevision(f,entry),
                    ...(hadSignoff?{checkedBy:'',checkedDate:'',qcReviewBy:'',qcReviewDate:'',status:'revised'}:{}),
                    lastModifiedAt:ts}));
            };
            // Answering the guard. "Revised calc" simply resumes the replace we paused.
            const resolveRedlineGuardAsReplace = async () => {
                const g = redlineGuard; if (!g) return;
                setRedlineGuard(null);
                await doReplaceFile(g.sectionId, g.file, g.pageCount);
            };
            // "Redline" hands the same already-scanned file to the attach dialog, aimed at
            // the head revision — the one the reviewer was actually looking at.
            const resolveRedlineGuardAsMarkup = () => {
                const g = redlineGuard; if (!g) return;
                setRedlineGuard(null);
                const sec = files.find(f=>f.id===g.sectionId);
                setMarkupPending({ sectionId:g.sectionId, revId:g.headRevId, file:g.file, name:g.file.name,
                    size:g.file.size, pageCount:g.pageCount, annots:g.annots,
                    revLabel:g.headRev, sectionLabel:g.sectionLabel, sectionTitle:sec?(sec.sectionTitle||''):'',
                    sectionStatus:sec?sec.status:'draft', defaultReviewer:'' });
            };

            // Bring an older revision back as the current PDF. This APPENDS a new chain
            // entry pointing at the same blob — no bytes are copied, and the revision you
            // are stepping away from stays in history, so the move is itself reversible.
            const restoreRevision = async (sectionId, revId) => {
                const f = files.find(x=>x.id===sectionId); if(!f) return;
                const src = (f.revisions||[]).find(r=>r.revId===revId); if(!src) return;
                const head = headRevision(f);
                if (head && head.revId === revId) { alert("That revision is already the current PDF."); return; }
                let blob = null;
                try { blob = src.blobKey ? await idb.getBlob(src.blobKey) : null; } catch(e) {}
                if (!blob) { alert("That PDF is no longer in this browser's local storage, so it can't be restored."); return; }
                const ts = new Date().toISOString(), lbl = sectionLabelOf(sectionId), actor = currentActor();
                const entry = makeRevision({ rev: nextRevLabel(f.revisions), blobKey: src.blobKey, name: src.name,
                    pageCount: src.pageCount, size: src.size, sha256: src.sha256, ts, actor,
                    reason: 'restore', note: `Restored from Rev ${src.rev}` });
                // Same QC rule as a replacement: a signature can't ride on content it never saw.
                const hadSignoff = !!(f.checkedBy || f.qcReviewBy);
                logAudit('revision-restored', { sectionId, sectionLabel:lbl, detail:`Rev ${src.rev} (${src.name||'—'}) made current as Rev ${entry.rev}` });
                if (hadSignoff) logAudit('signoff-invalidated', { sectionId, sectionLabel:lbl, detail:`Sign-off cleared on revision restore (was Checked: ${f.checkedBy||'—'}, QC: ${f.qcReviewBy||'—'}); status → Revised` });
                setFiles(prev=>prev.map(x=>x.id!==sectionId?x:{...x,
                    name: src.name || x.name, blobKey: src.blobKey,
                    fileObj: blob, downloadURL: null,            // Blob has .arrayBuffer(), same as a File
                    pageCount: src.pageCount!=null?src.pageCount:x.pageCount,
                    rawPages: src.pageCount!=null?src.pageCount:x.rawPages,
                    size: src.size!=null ? (src.size/1024/1024).toFixed(2)+' MB' : x.size,
                    revision: entry.rev, revisions: pushRevision(x, entry),
                    ...(hadSignoff?{checkedBy:'',checkedDate:'',qcReviewBy:'',qcReviewDate:'',status:'revised'}:{}),
                    lastModifiedAt: ts}));
                setHistoryFileId(null);
            };

            // ── STAGE 5: SECTION MARKUPS ────────────────────────────────────────────
            // Opening the dialog is separate from committing, because the same dialog is
            // reached two ways: deliberately from the revision history panel, and by
            // answering "it is a redline" to the guard on Replace.
            const requestAttachMarkup = async (sectionId, revId, file) => {
                const sec = files.find(f=>f.id===sectionId); if (!sec) return;
                const rv = (sec.revisions||[]).find(r=>r.revId===revId); if (!rv) return;
                setScanningRevId(revId);
                const scan = await scanPdf(file);
                setScanningRevId(null);
                setMarkupPending({ sectionId, revId, file, name:file.name, size:file.size,
                    pageCount:scan.pageCount, annots:scan.annots,
                    revLabel:rv.rev, sectionLabel:sectionLabelOf(sectionId), sectionTitle:sec.sectionTitle||'',
                    sectionStatus:sec.status, defaultReviewer:'', stamp:scan.stamp||null });
            };
            const commitAttachMarkup = async ({ reviewer, note, setCommented }) => {
                const ctx = markupPending; if (!ctx) return;
                setMarkupPending(null);
                const { sectionId, revId, file, pageCount, annots } = ctx;
                const hash = await sha256Hex(file);
                const dupKey = findExistingMarkupBlobByHash(hash);
                let blobKey = dupKey;
                if (!blobKey) { try { blobKey = await storeFileBlob(file); } catch(e) { console.warn("Could not save markup to local storage:", e); } }
                const rvName = (reviewer||'').trim() || null;
                const m = makeMarkup({ scope:'section', blobKey, sha256:hash, name:file.name,
                    pageCount, size:file.size, actor:currentActor(), reviewer:rvName,
                    note:(note||'').trim()||null, annotationCount:annots });
                const sec = files.find(f=>f.id===sectionId);
                const rv = sec ? (sec.revisions||[]).find(r=>r.revId===revId) : null;
                const lbl = sectionLabelOf(sectionId);
                logAudit('markup-attached', { sectionId, sectionLabel:lbl,
                    detail:`Review markup \u201c${file.name}\u201d attached to Rev ${rv?rv.rev:'?'}${rvName?` \u2014 marked up by ${rvName}`:''}${annots?` (${annots} annotation${annots!==1?'s':''})`:''}${dupKey?' \u2014 identical to a markup already stored, no extra space used':''}` });
                const willSet = !!setCommented && sec && sec.status !== 'commented';
                if (willSet) logAudit('status-changed', { sectionId, sectionLabel:lbl,
                    detail:`Status ${getStatusStyle(sec.status).label} \u2192 Comments Issued (review markup attached)` });
                // Sign-off is deliberately NOT cleared here, unlike a replace or a restore.
                // A markup is a comment ON the checked pages, not a change TO them, so the
                // signature still describes exactly what was signed.
                const ts = new Date().toISOString();
                setFiles(prev => prev.map(f => f.id!==sectionId ? f : {
                    ...f,
                    revisions: (f.revisions||[]).map(r => r.revId!==revId ? r : { ...r, markups:[...markupsOfRevision(r), m] }),

            const deleteSectionMarkup = (sectionId, revId, markupId) => {

                const m = markupsOfRevision(rv).find(x=>x.markupId===markupId); if (!m) return;
                if (!window.confirm(`Remove the markup \u201c${m.name||'markup'}\u201d from Rev ${rv.rev}?\n\nThe record goes now and the PDF is collected next time storage is tidied. If this is the only copy, you would have to get it back from whoever sent it.`)) return;
                logAudit('markup-removed', { sectionId, sectionLabel:sectionLabelOf(sectionId),
                    detail:`Review markup \u201c${m.name||'markup'}\u201d removed from Rev ${rv.rev}` });
                setFiles(prev => prev.map(f => f.id!==sectionId ? f : {
                    ...f,

            // ── STAGE 5 / N4: BINDER MARKUPS ────────────────────────────────────
            const requestAttachBinderMarkup = async (file) => {
                if (!file) return;

                // A stamped binder names the version it was built from. Line that up
                // with a stamped issue if one exists, so the markup files itself under
                // the package that actually went out rather than under "now".
                const matchIssue = (verdict==='match' && stamp && stamp.v != null)
                    ? (issues||[]).find(i => i.version === stamp.v) || null : null;
                setBinderMarkupPending({ file, name:file.name, size:file.size,

            };
            const commitAttachBinderMarkup = async ({ reviewer, note, issueId, projectVersion: pv, pageMap }) => {
                const ctx = binderMarkupPending; if (!ctx) return;

                const rvName = (reviewer||'').trim() || null;

            // ── ISSUES ──────────────────────────────────────────────────────────────

            // protected from collection the moment the issue exists.
            const stampIssue = (name, note) => {

            // Removing an issue only drops the pin. Nothing is deleted here — gcBlobs
            // decides later whether any blob is now unreferenced, and it will not touch
            // one that a live revision chain or another issue still holds.
            const deleteIssue = async (issueId) => {

            const handleAddPlaceholder = () => { const d=new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); const id=crypto.randomUUID(); logAudit('section-added',{sectionId:id,detail:'Added placeholder section'}); setFiles(p=>[...p,{id,fileObj:null,downloadURL:null,name:"Placeholder",sectionTitle:"New Placeholder",sectionSubtitle:'',designedBy:'',checkedBy:'',revision:'0',status:'draft',uploadDate:d,pageCount:5,rawPages:5,size:'N/A',depth:0,isPlaceholder:true,isCollapsed:false,objective:'',program:'',revisions:[]}]); };

            const removeLogo = () => { setLogoBlobKey(null); setLogoUrl(null); if(logoInputRef.current) logoInputRef.current.value=""; };
            const updateFileField = (id,field,value) => setFiles(p=>p.map(f=>f.id===id?{...f,[field]:value,lastModifiedAt:new Date().toISOString()}:f));
            const updateMeta = (field,value) => setProjectMeta(p=>({...p,[field]:value}));
            const handleUpdateFileDetails = (id,details) => {
                const old = files.find(f=>f.id===id);

                    const lbl = sectionLabelOf(id);

                    const sig=x=>`${x.designedBy||''}|${x.checkedBy||''}|${x.qcReviewBy||''}`;

                    if (details.revision!==undefined && String(old.revision||'')!==String(details.revision||'')) logAudit('revision-added',{sectionId:id,sectionLabel:lbl,detail:`Revision label set manually: ${old.revision||'—'} → ${details.revision||'—'} (locked; auto-numbering will work around it)`});
