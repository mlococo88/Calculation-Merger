                    // types wins: it is written onto the head revision and locked there, and
                    // nextRevLabel() then skips that value instead of reusing it.
                    if (details.revision!==undefined && String(details.revision||'')!==String(f.revision||'')) {
                        const rs = merged.revisions||[];
                        if (rs.length) merged.revisions = rs.map((r,i)=> i===rs.length-1 ? {...r, rev:String(details.revision||''), revLocked:true} : r);
                    }

                }));
            };
            const moveFile = (idx,dir) => { if((dir===-1&&idx===0)||(dir===1&&idx===files.length-1)) return; const nf=[...files]; const movedId=nf[idx].id; [nf[idx],nf[idx+dir]]=[nf[idx+dir],nf[idx]]; if(idx+dir===0)nf[0].depth=0; logAudit('section-reordered',{sectionId:movedId,sectionLabel:computeLabels(nf).find(f=>f.id===movedId)?.sectionLabel,detail:`Reordered ${nf.find(f=>f.id===movedId)?.sectionTitle||'section'} (position ${idx+1} → ${idx+dir+1})`}); setFiles(nf); };
            const changeDepth = (idx,delta) => { const nf=[...files]; const nd=nf[idx].depth+delta; if(nd>=0&&nd<=2&&!(idx===0&&nd>0)){ const cid=nf[idx].id; nf[idx].depth=nd; logAudit('section-reordered',{sectionId:cid,sectionLabel:computeLabels(nf).find(f=>f.id===cid)?.sectionLabel,detail:`Hierarchy changed (depth → ${nd})`}); setFiles(nf); } };
            const toggleCollapse = id => setFiles(p=>p.map(f=>f.id===id?{...f,isCollapsed:!f.isCollapsed}:f));

            // Drag
            const handleDragStart = (e,idx) => { setDragItem({index:idx,x:e.clientX}); e.dataTransfer.effectAllowed="move"; };
            const handleDragEnter = (_,idx) => setDragOverIndex(idx);
            const handleDragEnd = () => { setDragItem(null); setDragOverIndex(null); };
            const handleDrop = (e,idx) => { e.preventDefault(); e.stopPropagation(); if(e.dataTransfer.files?.length){processFiles(e.dataTransfer.files);return;} if(dragItem===null) return; if(dragItem.index===idx) return; const nf=[...files]; const [m]=nf.splice(dragItem.index,1); m.depth=Math.max(0,Math.min(2,m.depth+Math.round((e.clientX-dragItem.x)/40))); nf.splice(idx,0,m); logAudit('section-reordered',{sectionId:m.id,sectionLabel:computeLabels(nf).find(f=>f.id===m.id)?.sectionLabel,detail:`Reordered ${m.sectionTitle||'section'} (drag)`}); setFiles(nf); };

            const numberedFiles = useMemo(()=>{ let m=0,s=0,ss=0; return files.map(f=>{ let l=""; if(f.depth===0){m++;s=0;ss=0;l=`${m}`;} else if(f.depth===1){s++;ss=0;l=`${m}.${s}`;} else{ss++;l=`${m}.${s}.${ss}`;} return{...f,sectionLabel:l}; }); },[files]);

            // --- PDF HELPERS ---
            const cleanText = t=>!t?"":String(t).replace(/[\r\n]+/g," ").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/[^\x00-\x7F]/g,"");
            const getWrappedLines = (text,size,font,maxW)=>{ if(!text) return []; const ws=String(text).split(' '); let lines=[],cur=ws[0]; for(let i=1;i<ws.length;i++){if(font.widthOfTextAtSize(`${cur} ${ws[i]}`,size)<maxW)cur+=` ${ws[i]}`;else{lines.push(cur);cur=ws[i];}} lines.push(cur); return lines; };
            const drawWrappedText = (page,text,y,size,font,rgb,color=[0,0,0],maxW,align='center')=>{ if(!text) return; const {width}=page.getSize(); const sw=maxW||(width-100); const lines=getWrappedLines(cleanText(text),size,font,sw); const lh=size*1.3; const ci=(lines.length-1)/2; lines.forEach((l,i)=>{ const tw=font.widthOfTextAtSize(l,size); const x=align==='left'?50:align==='right'?width-50-tw:(width-tw)/2; page.drawText(l,{x,y:y+(ci-i)*lh,size,font,color:rgb(...color)}); }); };

            const drawFormalDivider = (page,fileData,projMeta,embLogo,fonts,rgb,theme)=>{
                try {
                    const {width,height}=page.getSize(); const {fontBold,fontRegular}=fonts;
                    const margin=40,cw=width-(margin*2);
                    // Header bar
                    const logoReserve = embLogo ? 110 : 0;

                    // Logo — top right, contained within the band
                    if (embLogo){const lh=44;const sc=lh/embLogo.height;const lw=Math.min(embLogo.width*sc,100);page.drawImage(embLogo,{x:width-margin-lw,y:height-58,width:lw,height:lh});}
                    // Project label + number on one line
                    page.drawText(`PROJECT:  ${cleanText(projMeta.number)}`,{x:margin,y:height-18,size:7,font:fontBold,color:rgb(...theme.pale)});
                    // Project title below, respecting logo space

                    projLines.slice(0,2).forEach((l,i)=>page.drawText(l,{x:margin,y:height-34-(i*14),size:11,font:fontBold,color:rgb(1,1,1)}));
                    // Section info
                    const tY=height-130;
                    const statusObj=STATUS_OPTIONS.find(s=>s.value===fileData.status)||STATUS_OPTIONS[0];
                    page.drawText(`SECTION ${fileData.sectionLabel}`,{x:margin,y:tY,size:22,font:fontBold,color:rgb(...theme.dark)});
                    drawWrappedText(page,fileData.sectionTitle||"Untitled",tY-30,16,fontBold,rgb,[0,0,0],cw-100,'left');
                    if(fileData.sectionSubtitle)drawWrappedText(page,fileData.sectionSubtitle,tY-52,12,fontRegular,rgb,[0.3,0.3,0.3],cw-100,'left');
                    // Status badge
                    if(fileData.status&&fileData.status!=='draft'){
                        const sl=statusObj.label.toUpperCase();

                        page.drawRectangle({x:width-margin-sw2,y:tY-4,width:sw2,height:16,color:rgb(fileData.status==='approved'?0.13:0.95,fileData.status==='approved'?0.67:0.75,fileData.status==='approved'?0.3:0.15)});
                        page.drawText(sl,{x:width-margin-sw2+6,y:tY+1,size:8,font:fontBold,color:rgb(1,1,1)});

                    // Separator line
                    page.drawLine({start:{x:margin,y:tY-65},end:{x:width-margin,y:tY-65},thickness:0.5,color:rgb(0.8,0.8,0.8)});

                    let curY=tY-90;
                    const drawBlock=(label,text)=>{ if(!text||curY<(margin+65+40)) return; page.drawText(label,{x:margin,y:curY,size:8,font:fontBold,color:rgb(0.4,0.4,0.4)}); const ls=getWrappedLines(cleanText(text),10,fontRegular,cw-10); ls.forEach((l,i)=>{const ly=curY-14-(i*13);if(ly>(margin+75))page.drawText(l,{x:margin,y:ly,size:10,font:fontRegular,color:rgb(0,0,0)});}); curY-=(ls.length*13)+28; };
                    (fileData.customFields||[{label:"OBJECTIVE/SCOPE",value:fileData.objective,isVisible:!!fileData.objective},{label:"COMPUTER PROGRAM",value:fileData.program,isVisible:!!fileData.program}]).forEach(f=>{if(f.isVisible&&f.value&&f.label)drawBlock(f.label.toUpperCase()+":",f.value);});

                        cell(0,"DESIGNED BY",fileData.designedBy,fileData.designedDate);

                    }
                } catch(e){ console.error("Divider error",e); }
            };

            const drawPageHeader = (page,projMeta,fonts,rgb)=>{
                const {width,height}=page.getSize();
                const {fontBold,fontRegular}=fonts;
                page.drawLine({start:{x:40,y:height-20},end:{x:width-40,y:height-20},thickness:0.5,color:rgb(0.8,0.8,0.8)});
                page.drawText(cleanText(projMeta.number),{x:40,y:height-15,size:7,font:fontBold,color:rgb(0.5,0.5,0.5)});
                const tt=cleanText(projMeta.title); const tw=fontRegular.widthOfTextAtSize(tt,7); page.drawText(tt,{x:(width-tw)/2,y:height-15,size:7,font:fontRegular,color:rgb(0.5,0.5,0.5)});
            };

            // --- PDF BOOKMARKS HELPER ---
            const addPDFBookmarks = (pdfDoc, sections) => {
                // sections = [{ title, pageIndex, depth }]
                // Builds a 2-level outline tree (depth 0 = top level, depth > 0 = children of last top item)
                try {
                    const { PDFName, PDFString, PDFNumber } = window.PDFLib;
                    const ctx = pdfDoc.context;
                    if (!sections || sections.length === 0) return;

                    // Build tree
                    const tree = [];
                    let lastRoot = null;
                    for (const s of sections) {
                        if (s.depth === 0) {
                            lastRoot = { ...s, children: [] };
                            tree.push(lastRoot);
                        } else if (lastRoot) {
                            lastRoot.children.push(s);
                        }
                    }
                    if (tree.length === 0) return;

                    // Helper: create Dest array pointing to top of a page
                    const makeDest = (pageIndex) => {
                        const pg = pdfDoc.getPage(pageIndex);
                        const { height: pgH } = pg.getSize();
                        return ctx.obj([pg.ref, PDFName.of('XYZ'), PDFNumber.of(0), PDFNumber.of(pgH), PDFNumber.of(0)]);
                    };

                    const rootRef = ctx.nextRef();

                    // Pre-allocate all refs so we can link Prev/Next before writing
                    const nodes = tree.map(n => ({
                        node: n,
                        ref: ctx.nextRef(),
                        childRefs: n.children.map(() => ctx.nextRef()),
                    }));

                    // Write child outline items
                    for (const nd of nodes) {
                        for (let j = 0; j < nd.node.children.length; j++) {
                            const c = nd.node.children[j];
                            const cRef = nd.childRefs[j];
                            const cEntry = {
                                Title: PDFString.of(cleanText(c.title).slice(0, 90) || 'Section'),
                                Parent: nd.ref,
                                Dest: makeDest(c.pageIndex),
                            };
                            if (j > 0) cEntry.Prev = nd.childRefs[j - 1];
                            if (j < nd.childRefs.length - 1) cEntry.Next = nd.childRefs[j + 1];
                            ctx.assign(cRef, ctx.obj(cEntry));
                        }
                    }

                    // Write top-level outline items
                    for (let i = 0; i < nodes.length; i++) {
                        const nd = nodes[i];
                        const entry = {
                            Title: PDFString.of(cleanText(nd.node.title).slice(0, 90) || 'Section'),
                            Parent: rootRef,
                            Dest: makeDest(nd.node.pageIndex),
                        };
                        if (i > 0) entry.Prev = nodes[i - 1].ref;
                        if (i < nodes.length - 1) entry.Next = nodes[i + 1].ref;
                        if (nd.childRefs.length > 0) {
                            entry.First = nd.childRefs[0];
                            entry.Last = nd.childRefs[nd.childRefs.length - 1];
                            entry.Count = PDFNumber.of(nd.childRefs.length);
                        }
                        ctx.assign(nd.ref, ctx.obj(entry));
                    }

                    // Write outline root
                    const totalCount = nodes.reduce((s, nd) => s + 1 + nd.childRefs.length, 0);
                    ctx.assign(rootRef, ctx.obj({
                        Type: PDFName.of('Outlines'),
                        First: nodes[0].ref,
                        Last: nodes[nodes.length - 1].ref,
                        Count: PDFNumber.of(totalCount),
                    }));

                    // Attach to document catalog and open bookmarks pane by default
                    pdfDoc.catalog.set(PDFName.of('Outlines'), rootRef);
                    pdfDoc.catalog.set(PDFName.of('PageMode'), PDFName.of('UseOutlines'));

                } catch(e) {
                    console.warn("PDF bookmarks failed (non-fatal):", e);
                }
            };

            // --- HEX TO RGB HELPER ---
            const hexToRgb01 = (hex) => {
                const clean = hex.replace('#','');
                const r = parseInt(clean.substring(0,2),16)/255;
                const g = parseInt(clean.substring(2,4),16)/255;
                const b = parseInt(clean.substring(4,6),16)/255;
                return [r, g, b];
            };
            // Darken a [r,g,b] color by a factor (0=black, 1=unchanged)
            const darken = ([r,g,b], f=0.75) => [r*f, g*f, b*f];
            // Lighten toward white by factor
            const lighten = ([r,g,b], f=0.85) => [r+(1-r)*f, g+(1-g)*f, b+(1-b)*f];

            // ── STAGE 4 · BINDER APPENDIX ───────────────────────────────────────
            // Component-scope theme values. generateBinder derives its own copies
            // inside its own scope and stays untouched; these exist for exportTOC and
            // the appendix, which until now referenced names that only lived inside
            // generateBinder — which is exactly why the TOC-only export button threw.
            const themePrimary = hexToRgb01(themeColor);
            const themeDark    = darken(themePrimary, 0.72);
            const themeAccent  = themePrimary;
            const themePale    = lighten(themePrimary, 0.88);
            const themeText    = darken(themePrimary, 0.65);

            const fmtStamp = (iso) => { if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); };
            const REASON_WORD = { initial:'First issue', replace:'Replaced', restore:'Restored', import:'Imported' };

            // The appendix is built as its own document and copied onto the END of the
            // finished binder. End placement is deliberate: every page number the TOC
            // printed is derived from the sections ahead of it, so appending here cannot
            // make the TOC lie. It also means the appendix never appears in the on-screen
            // preview, which renders raw generateBinder output — the header bar says so.
            const buildAppendixDoc = async () => {
                const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
                const secs = numberedFiles.filter(f=>!f.isHeader);
                if (!secs.length) return null;
                const doc  = await PDFDocument.create();
                const bold = await doc.embedFont(StandardFonts.HelveticaBold);
                const reg  = await doc.embedFont(StandardFonts.Helvetica);
                const obl  = await doc.embedFont(StandardFonts.HelveticaOblique);
                const W=612, H=792, L=40, R=572;
                let page=null, y=0, running='';
                // Letters are handed out in order rather than hardcoded, so a package with
                // no markups still reads A, B, C instead of skipping one.
                let partN = 0;
                const partLetter = () => String.fromCharCode(65 + partN++);

                const banner = () => {
                    page = doc.addPage([W,H]);
                    page.drawRectangle({x:0,y:H-55,width:W,height:55,color:rgb(...themeDark)});
                    page.drawText('APPENDIX',{x:L,y:H-35,size:18,font:bold,color:rgb(1,1,1)});
                    page.drawText(`${cleanText(projectMeta.number||'')} — ${cleanText(projectMeta.title||'')}`,{x:L,y:H-50,size:7,font:reg,color:rgb(...themePale)});
                    const st = `Compiled ${fmtStamp(new Date().toISOString())}`;
                    page.drawText(st,{x:R-reg.widthOfTextAtSize(st,7),y:H-50,size:7,font:reg,color:rgb(...themePale)});
                    y = H-82;
                    if (running) { page.drawText(running+'  (continued)',{x:L,y,size:9,font:obl,color:rgb(0.55,0.55,0.55)}); y-=16; }
                };
                const ensure = (h) => { if (!page || y-h < 56) banner(); };
                const part = (title) => {
                    running = '';
                    if (page) y -= 14;
                    ensure(64);
                    page.drawText(title,{x:L,y,size:13,font:bold,color:rgb(...themeText)}); y -= 6;
                    page.drawLine({start:{x:L,y},end:{x:R,y},thickness:1.2,color:rgb(...themeAccent)}); y -= 16;
                    running = title;
                };
                const wrap = (text,x,w,size,font,color) => {
                    getWrappedLines(cleanText(text),size,font,w).forEach(l=>{ ensure(size*1.4); page.drawText(l,{x,y,size,font,color:rgb(...color)}); y -= size*1.4; });
                };

                // ── A · revision log ────────────────────────────────────────
                part(partLetter()+' · REVISION LOG');
                wrap('Every retained revision of every section, oldest first. A chain is only ever added to: replacing a PDF keeps the one it replaced, and restoring an old one appends rather than rewinds.', L, R-L, 8, obl, [0.5,0.5,0.5]);
                y -= 6;
                const CX = { rev:L, date:L+54, by:L+122, how:L+180, note:L+250 };
                const colHead = () => {
                    ensure(22);
                    [['REV',CX.rev],['DATE',CX.date],['BY',CX.by],['HOW',CX.how],['NOTE',CX.note]]
                        .forEach(([t,x])=>page.drawText(t,{x,y,size:6.5,font:bold,color:rgb(0.55,0.55,0.55)}));
                    y -= 5;
                    page.drawLine({start:{x:L,y},end:{x:R,y},thickness:0.5,color:rgb(0.82,0.82,0.82)});
                    y -= 11;
                };
                let anyLocked = false;
                secs.forEach(f=>{
                    const chain = f.revisions || [];
                    ensure(58);
                    page.drawText(`${f.sectionLabel}  ${cleanText(f.sectionTitle||f.name||'Untitled')}`,{x:L,y,size:10,font:bold,color:rgb(0.15,0.18,0.22)});
                    const badge = (getStatusStyle(f.status||'draft').label||'').toUpperCase();
                    page.drawText(badge,{x:R-bold.widthOfTextAtSize(badge,7),y:y+1,size:7,font:bold,color:rgb(...themeAccent)});
                    y -= 12;
                    const signed = [ `Designed ${cleanText(f.designedBy)||'—'}`,
                                     `Checked ${cleanText(f.checkedBy)||'—'}${f.checkedBy&&f.checkedDate?' '+fmtStamp(f.checkedDate):''}`,
                                     `QC review ${cleanText(f.qcReviewBy)||'—'}${f.qcReviewBy&&f.qcReviewDate?' '+fmtStamp(f.qcReviewDate):''}` ].join('   ·   ');
                    page.drawText(signed,{x:L,y,size:7.5,font:reg,color:rgb(0.45,0.45,0.45)});
                    y -= 13;
                    colHead();
                    if (!chain.length) {
                        ensure(15);
                        page.drawText('No revision history recorded for this section.',{x:CX.rev,y,size:8,font:obl,color:rgb(0.6,0.6,0.6)});
                        y -= 15;
                    }
                    chain.forEach((rv,i)=>{
                        if (rv.revLocked) anyLocked = true;
                        const noteTxt = [rv.note, rv.name].filter(Boolean).join(' — ');
                        const noteLines = noteTxt ? getWrappedLines(cleanText(noteTxt), 7.5, reg, R-CX.note).slice(0,3) : [];
                        const rowH = Math.max(13, noteLines.length*9.5 + 4);
                        ensure(rowH+2);
                        const isHead = i === chain.length-1;
                        const col = isHead ? [0.15,0.18,0.22] : [0.5,0.5,0.5];
                        page.drawText(`Rev ${cleanText(rv.rev)}${rv.revLocked?' *':''}`,{x:CX.rev,y,size:8,font:isHead?bold:reg,color:rgb(...col)});
                        page.drawText(fmtStamp(rv.ts),{x:CX.date,y,size:7.5,font:reg,color:rgb(...col)});
                        page.drawText(cleanText((rv.actor&&(rv.actor.initials||rv.actor.name))||'—').slice(0,11),{x:CX.by,y,size:7.5,font:reg,color:rgb(...col)});
                        page.drawText(REASON_WORD[rv.reason]||cleanText(rv.reason)||'—',{x:CX.how,y,size:7.5,font:reg,color:rgb(...col)});
                        let ny = y;
                        noteLines.forEach(l=>{ page.drawText(l,{x:CX.note,y:ny,size:7.5,font:reg,color:rgb(0.45,0.45,0.45)}); ny -= 9.5; });
                        y -= rowH;
                    });
                    y -= 10;
                });
                if (anyLocked) {
                    ensure(16);
                    page.drawText('*  revision label was typed by hand; automatic numbering works around it.',{x:L,y,size:7,font:obl,color:rgb(0.6,0.6,0.6)});
                    y -= 12;
                }

                // ── B · open QC items ───────────────────────────────────────
                const withOpen = secs.map(f=>({ f, items:(comments[f.id]||[]).filter(c=>c.kind==='qc'&&c.status!=='closed') })).filter(x=>x.items.length);
                part(partLetter()+' · OPEN QC ITEMS');
                if (!withOpen.length) {
                    wrap('Nothing is open. Every tracked QC item raised against this package has been resolved and closed by a checker.', L, R-L, 9, reg, [0.3,0.3,0.3]);
                } else {
                    const n = withOpen.reduce((a,x)=>a+x.items.length,0);
                    wrap(`${n} item${n!==1?'s':''} still open across ${withOpen.length} section${withOpen.length!==1?'s':''}. An item stays open until a checker closes it, so anything marked Resolved below is still waiting on a backcheck.`, L, R-L, 8, obl, [0.5,0.5,0.5]);
                    y -= 6;
                    withOpen.forEach(({f,items})=>{
                        ensure(42);
                        page.drawText(`${f.sectionLabel}  ${cleanText(f.sectionTitle||f.name||'Untitled')}`,{x:L,y,size:10,font:bold,color:rgb(0.15,0.18,0.22)});
                        y -= 14;
                        const head = headRevision(f);
                        items.forEach(c=>{
                            const heavy = c.severity==='hold' || c.severity==='major';
                            const stale = !!(c.revId && head && c.revId !== head.revId);
                            ensure(32);
                            page.drawText((sevStyle(c.severity).label||'').toUpperCase(),{x:L,y,size:7,font:bold,color:rgb(...(heavy?[0.72,0.16,0.16]:[0.45,0.45,0.45]))});
                            const tag = [ c.pageRef?cleanText(c.pageRef):null,
                                          c.revLabel?`raised at Rev ${cleanText(c.revLabel)}`:null,
                                          stale?'RAISED AGAINST A SUPERSEDED REVISION':null,
                                          (QC_STATE[c.status]||{}).label ].filter(Boolean).join('   ·   ');
                            page.drawText(tag,{x:L+50,y,size:7,font:reg,color:rgb(0.55,0.55,0.55)});
                            y -= 11;
                            wrap(c.text||'', L+12, R-L-12, 8.5, reg, [0.2,0.2,0.2]);
                            ensure(12);
                            page.drawText(`${cleanText(c.author||'—')} · ${fmtStamp(c.timestamp)}`,{x:L+12,y,size:7,font:reg,color:rgb(0.55,0.55,0.55)});
                            y -= 11;
                            if (c.resolutionText) wrap(`Response — ${c.resolutionText}  (${cleanText(c.resolvedBy||'—')})`, L+12, R-L-12, 7.5, obl, [0.25,0.4,0.28]);
                            y -= 6;
                        });
                        y -= 6;
                    });
                }

                // ── review markups ──────────────────────────────────────────
                // The register, not the redlines. A binder that goes out should be able to
                // say on its own face what review has been done to it and by whom, even
                // when the marked-up PDFs themselves stayed behind in the app.
                const secMk = secs.map(f=>({ f, rows: (f.revisions||[]).flatMap(r => markupsOfRevision(r).map(m=>({m, rv:r}))) })).filter(x=>x.rows.length);
                const binMk = [...(binderMarkups||[])].sort((a,b)=>String(a.ts||'').localeCompare(String(b.ts||'')));
                if (secMk.length || binMk.length) {
                    part(partLetter()+' · REVIEW MARKUPS');
                    const tot = secMk.reduce((n,x)=>n+x.rows.length,0) + binMk.length;
                    wrap(`${tot} marked-up cop${tot===1?'y':'ies'} held against this package. The markups themselves are not reproduced here — this is the register of who marked up what, and against which revision, so a reader can ask for one by name.`, L, R-L, 8, obl, [0.5,0.5,0.5]);
                    y -= 6;
                    const mkLine = (m, lead) => {
                        ensure(26);
                        page.drawText(cleanText(lead).slice(0,16),{x:L+12,y,size:8,font:bold,color:rgb(0.15,0.18,0.22)});
                        const tag = [ cleanText(m.reviewer)||'reviewer not named',
                                      fmtStamp(m.ts),
                                      m.annotationCount ? `${m.annotationCount} annotation${m.annotationCount!==1?'s':''}` : 'no annotation objects',
                                      m.absent ? 'PDF NOT IN THIS PACKAGE' : null ].filter(Boolean).join('   ·   ');
                        page.drawText(tag,{x:L+100,y,size:7,font:reg,color:rgb(0.5,0.5,0.5)});
                        y -= 10;
                        if (m.name) { page.drawText(cleanText(m.name).slice(0,90),{x:L+100,y,size:7,font:reg,color:rgb(0.58,0.58,0.58)}); y -= 10; }
                        if (m.note) wrap(`"${m.note}"`, L+100, R-L-100, 7.5, obl, [0.45,0.45,0.45]);
                        y -= 4;
                    };
                    secMk.forEach(({f,rows})=>{
                        ensure(32);
                        page.drawText(`${f.sectionLabel}  ${cleanText(f.sectionTitle||f.name||'Untitled')}`,{x:L,y,size:10,font:bold,color:rgb(0.15,0.18,0.22)});
                        y -= 13;
                        rows.forEach(({m,rv})=> mkLine(m, `Rev ${rv.rev}`));
                        y -= 6;
                    });
                    if (binMk.length) {
                        ensure(32);
                        page.drawText('Whole binder',{x:L,y,size:10,font:bold,color:rgb(0.15,0.18,0.22)});
                        y -= 13;
                        binMk.forEach(m=>{
                            const iss = (issues||[]).find(i=>i.id===m.issueId);
                            mkLine(m, iss ? iss.name : `Version ${m.projectVersion!=null?m.projectVersion:'?'}`);
                        });
                        y -= 6;
                    }
                }

                // ── issue history ───────────────────────────────────────────
                if ((issues||[]).length) {
                    part(partLetter()+' · ISSUE HISTORY');
                    [...issues].sort((a,b)=>new Date(a.ts)-new Date(b.ts)).forEach(iss=>{
                        ensure(30);
                        page.drawText(cleanText(iss.name),{x:L,y,size:10,font:bold,color:rgb(0.15,0.18,0.22)});
                        const ds = fmtStamp(iss.ts);
                        page.drawText(ds,{x:R-reg.widthOfTextAtSize(ds,8),y,size:8,font:reg,color:rgb(0.5,0.5,0.5)});
                        y -= 11;
                        const sn = ((iss.record&&iss.record.files)||[]).filter(f=>!f.isHeader).length;
                        page.drawText(`${sn} section${sn!==1?'s':''} pinned · stamped by ${cleanText((iss.actor&&iss.actor.name)||'—')}${iss.openQcAtIssue?` · ${iss.openQcAtIssue} QC item${iss.openQcAtIssue!==1?'s':''} open at the time`:''}`,{x:L,y,size:7.5,font:reg,color:rgb(0.5,0.5,0.5)});
                        y -= 11;
                        if (iss.note) wrap(`"${iss.note}"`, L, R-L, 7.5, obl, [0.5,0.5,0.5]);
                        y -= 8;
                    });
                }

                ensure(28);
                y -= 6;
                page.drawLine({start:{x:L,y},end:{x:R,y},thickness:0.5,color:rgb(0.82,0.82,0.82)});
                y -= 12;
                page.drawText('Compiled by CalcBinder from the project record. This appendix describes the package at the moment the binder was generated.',{x:L,y,size:7,font:obl,color:rgb(0.6,0.6,0.6)});
                return doc;
            };

            // Staple the appendix onto finished binder bytes, continuing the binder's own
            // page numbering (cover is page 0 and unnumbered, so page index i prints as i).
            const appendAppendixPages = async (binderBytes) => {
                try {
                    const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
                    const src = await buildAppendixDoc();
                    if (!src) return null;
                    const binder = await PDFDocument.load(binderBytes, { ignoreEncryption:true });
                    const offset = binder.getPageCount();
                    const copied = await binder.copyPages(src, src.getPageIndices());
                    const reg = await binder.embedFont(StandardFonts.Helvetica);
                    copied.forEach((pg,i)=>{
                        binder.addPage(pg);
                        const pw = pg.getSize().width;
                        const txt = String(offset+i);
                        const tw = reg.widthOfTextAtSize(txt,9);
                        const x = pageNumberPos==='left' ? 40 : pageNumberPos==='center' ? (pw-tw)/2 : pw-40-tw;
                        pg.drawText(txt,{x,y:18,size:9,font:reg,color:rgb(0.4,0.4,0.4)});
                        if (pageNumberPos!=='left') pg.drawText('APPENDIX',{x:40,y:18,size:8,font:reg,color:rgb(0.6,0.6,0.6)});
                    });
                    return new Uint8Array(await binder.save());
                } catch(e) {
                    console.error('Appendix could not be appended (binder still exported)', e);
                    return null;
                }
            };

            // --- GENERATE BINDER ---
            const generateBinder = async (action='download', isAuto=false, singleFileId=null) => {
                if (!isAuto) setIsProcessing(true);
                // Size warning for full download
                if (action==='download'&&!singleFileId) {
                    const totalMB = files.reduce((acc,f)=>{ const mb=parseFloat(f.size)||0; return acc+mb; },0);
                    if (totalMB>50&&!confirm(`Estimated output is large (~${totalMB.toFixed(0)}MB of source files). This may take a while. Continue?`)) { setIsProcessing(false); return; }
                }
                try {
                    const {PDFDocument,StandardFonts,rgb}=window.PDFLib;
                    // Theme color derived values (hex → pdf-lib rgb floats)
                    const themePrimary = hexToRgb01(themeColor);
                    const themeDark    = darken(themePrimary, 0.72);
                    const themeAccent  = themePrimary;
                    const themePale    = lighten(themePrimary, 0.88);
                    const themeText    = darken(themePrimary, 0.65);
                    const pdf=await PDFDocument.create();
                    const fontBold=await pdf.embedFont(StandardFonts.HelveticaBold);
                    const fontRegular=await pdf.embedFont(StandardFonts.Helvetica);
                    const fontOblique=await pdf.embedFont(StandardFonts.HelveticaOblique);
                    const fonts={fontBold,fontRegular,fontOblique};
                    let embLogo=null;
                    if(logoUrl){try{const res=await fetch(logoUrl);const lb=await res.arrayBuffer();embLogo=logoUrl.startsWith('data:image/png')?await pdf.embedPng(lb):await pdf.embedJpg(lb);}catch(e){}}
                    const SZ=[612,792]; const width=612, height=792;

                    // Per-section divider preview
                    if (singleFileId) {
                        const f=numberedFiles.find(f=>f.id===singleFileId);
                        if (!f){setIsProcessing(false);return;}
                        const dp=pdf.addPage(SZ); drawFormalDivider(dp,f,projectMeta,embLogo,fonts,rgb,{dark:themeDark,pale:themePale,accent:themeAccent,text:themeText});
                        const bytes=await pdf.save();
                        const blob=new Blob([bytes],{type:'application/pdf'});
                        window.open(URL.createObjectURL(blob),'_blank');
                        setIsProcessing(false);
                        return;
                    }

                    // Cover page — use custom PDF if uploaded, else generate automatically
                    if (customCoverUrl) {
                        try {
                            const r = await fetch(customCoverUrl);
                            if (!r.ok) throw new Error(`HTTP ${r.status}`);
                            const customBytes = await r.arrayBuffer();
                            const customPdf = await PDFDocument.load(customBytes, { ignoreEncryption: true });
                            const copiedPages = await pdf.copyPages(customPdf, customPdf.getPageIndices());
                            copiedPages.forEach(p => pdf.addPage(p));
                        } catch(e) {
                            console.warn("Custom cover load failed, falling back to auto cover:", e);
                            // fall through to auto cover below
                        }
                    }
                    if (!customCoverUrl) { // auto-generated cover
                    const cover=pdf.addPage(SZ);

                    // Embed cover image first — determines which layout to use
                    let embCoverImage = null;
                    const activeCoverImage = coverImageUrl || coverImagePreview;
                    if (activeCoverImage) {
                        try {
                            const res = await fetch(activeCoverImage);
                            const imgBytes = await res.arrayBuffer();
                            const isPng = activeCoverImage.startsWith('data:image/png');
                            embCoverImage = isPng ? await pdf.embedPng(imgBytes) : await pdf.embedJpg(imgBytes);
                        } catch(e) { console.warn("Cover image embed failed", e); }
                    }

                    // Top band
                    cover.drawRectangle({x:0,y:height-120,width:width,height:120,color:rgb(...themeDark)});
                    if(embLogo){const ls=52/embLogo.height;const lw=embLogo.width*ls;cover.drawImage(embLogo,{x:(width-lw)/2,y:height-96,width:lw,height:52});}
                    // Accent stripe
                    cover.drawRectangle({x:0,y:height-124,width:width,height:4,color:rgb(...themeAccent)});
                    // Bottom band
                    cover.drawRectangle({x:0,y:0,width:width,height:30,color:rgb(...themeDark)});

                    // Title block — same position in both layouts
                    const titleY = height - 168;
                    drawWrappedText(cover, projectMeta.title.toUpperCase(), titleY, 20, fontBold, rgb, themeDark, width-80);

                    // Accent line below title
                    const accentY = titleY - 30;
                    cover.drawLine({start:{x:60,y:accentY},end:{x:width-60,y:accentY},thickness:0.75,color:rgb(...themeAccent)});

                    // Doc type below accent
                    drawWrappedText(cover, (projectMeta.docType||"CALCULATION PACKAGE").toUpperCase(), accentY-18, 11, fontRegular, rgb, [0.35,0.35,0.35], width-80);

                    // Project info — two-column layout so colons align
                    // Labels are right-aligned to page center; values left-aligned from center
                    const metaStartY = accentY - 38;
                    const metaLineH  = 14;
                    const metaRows = [
                        projectMeta.number ? ['Project No:', cleanText(projectMeta.number)] : null,
                        projectMeta.client  ? ['Client:',     cleanText(projectMeta.client)]  : null,
                        projectMeta.date    ? ['Date:',       cleanText(projectMeta.date)]    : null,
                    ].filter(Boolean);
                    const colGap = 8; // gap between label and value
                    metaRows.forEach(([label, value], i) => {
                        const y = metaStartY - (i * metaLineH);
                        const labelW = fontBold.widthOfTextAtSize(label, 9);
                        // Label: right-aligned to page center
                        cover.drawText(label, {
                            x: (width / 2) - labelW - colGap,
                            y, size: 9, font: fontBold, color: rgb(0.45, 0.45, 0.45),
                        });
                        // Value: left-aligned from page center
                        cover.drawText(value, {
                            x: (width / 2) + colGap,
                            y, size: 9, font: fontRegular, color: rgb(0.2, 0.2, 0.2),
                        });
                    });

                    if (embCoverImage) {
                        // ── WITH COVER IMAGE: image fills middle, description shown below image ──
                        // Calculate how much space description needs
                        const descLines = projectMeta.description
                            ? getWrappedLines(cleanText(projectMeta.description), 9, fontOblique, width-120)
                            : [];
                        const descH = descLines.length > 0 ? (descLines.length * 12) + 8 : 0;
                        // Image sits between meta rows and description+bottom band
                        const imgTop = metaStartY - (metaRows.length * metaLineH) - 12;
                        const imgBot = 35 + descH; // leave room for description above bottom band
                        const imgAreaH = imgTop - imgBot;
                        const scl = Math.min((width-60)/embCoverImage.width, imgAreaH/embCoverImage.height);
                        const imgW = embCoverImage.width*scl, imgH = embCoverImage.height*scl;
                        cover.drawImage(embCoverImage, {
                            x: (width-imgW)/2,
                            y: imgBot + (imgAreaH-imgH)/2,
                            width: imgW,
                            height: imgH
                        });
                        // Description below image, above bottom band
                        if (descLines.length > 0) {
                            descLines.forEach((line, i) => {
                                const lw = fontOblique.widthOfTextAtSize(line, 9);
                                cover.drawText(line, {
                                    x: (width-lw)/2,
                                    y: 38 + ((descLines.length-1-i) * 12),
                                    size: 9, font: fontOblique, color: rgb(0.5,0.5,0.5)
                                });
                            });
                        }
                    } else {
                        // ── WITHOUT COVER IMAGE: description near bottom ──
                        if(projectMeta.description) {
                            drawWrappedText(cover, projectMeta.description, 100, 9, fontOblique, rgb, [0.4,0.4,0.4], width-120);
                        }
                    }

                    } // end auto-generated cover

                    // TOC
                    const epp=25, tocPgs=Math.ceil(numberedFiles.length/epp)||1;
                    let rpn=tocPgs;
                    const analysis=numberedFiles.map(f=>{const e={...f,startPage:rpn+1};rpn+=f.isHeader?1:(1+(f.rawPages||1));return e;});
                    for(let p=0;p<tocPgs;p++){
                        const tp=pdf.addPage(SZ);
                        // TOC header
                        tp.drawRectangle({x:0,y:height-55,width:width,height:55,color:rgb(...themeDark)});
                        tp.drawText("TABLE OF CONTENTS",{x:40,y:height-35,size:18,font:fontBold,color:rgb(1,1,1)});
                        tp.drawText(`${projectMeta.number} — ${cleanText(projectMeta.title)}`,{x:40,y:height-50,size:7,font:fontRegular,color:rgb(...themePale)});
                        let yPos=height-80;
                        for(let i=p*epp;i<Math.min((p+1)*epp,analysis.length);i++){
                            const item=analysis[i];
                            const indent=item.depth===0?40:item.depth===1?60:80;
                            const font=item.depth===0?fontBold:fontRegular;
                            const fontSize=item.depth===0?11:10;
                            const titleText=cleanText(item.sectionTitle||"Untitled");
                            const pageStr=item.startPage.toString();
                            const pageStrW=font.widthOfTextAtSize(pageStr,fontSize);
                            const labelW=font.widthOfTextAtSize(item.sectionLabel+" ",fontSize);
                            const titleMaxW=width-indent-labelW-pageStrW-80;
                            const lines=getWrappedLines(titleText,fontSize,font,titleMaxW);
                            // Status dot
                            if(item.status&&item.status!=='draft'){const sc=item.status==='approved'?rgb(0.13,0.67,0.3):rgb(0.95,0.65,0.1);tp.drawCircle({x:indent-8,y:yPos+3,size:3,color:sc});}
                            tp.drawText(item.sectionLabel,{x:indent,y:yPos,size:fontSize,font});
                            lines.forEach((l,li)=>tp.drawText(l,{x:indent+labelW,y:yPos-(li*13),size:fontSize,font}));
                            // Dot leader
                            const titleW=font.widthOfTextAtSize(lines[0]||"",fontSize);
                            const dotStart=indent+labelW+titleW+4;
                            const dotEnd=width-50-pageStrW-4;
                            if(dotEnd>dotStart+10){
                                const dotStr=".";const dotW=fontRegular.widthOfTextAtSize(dotStr,fontSize);
                                let dx=dotStart;while(dx<dotEnd-dotW){tp.drawText(dotStr,{x:dx,y:yPos,size:fontSize,font:fontRegular,color:rgb(0.7,0.7,0.7)});dx+=dotW+1;}
                            }
                            tp.drawText(pageStr,{x:width-50-pageStrW,y:yPos,size:fontSize,font});
                            yPos-=(lines.length*13)+8;
                            if(item.depth===0)yPos-=2;
                        }
                    }

                    // Sections
                    // dividerPageIndices: page indices of section divider pages
                    // pageSection: page index -> { label, title } for uploaded content pages
                    // bookmarkData: flat list for outline tree
                    const dividerPageIndices = new Set();
                    const pageSection = new Map();
                    const bookmarkData = [];

                    for(const f of numberedFiles){
                        // Divider page — record its index for bookmarks + page header skip
                        const divPageIdx = pdf.getPageCount();
                        dividerPageIndices.add(divPageIdx);
                        bookmarkData.push({
                            title: `${f.sectionLabel}  ${f.sectionTitle||'Untitled'}`,
                            pageIndex: divPageIdx,
                            depth: f.depth,
                        });
                        const dp=pdf.addPage(SZ);
                        drawFormalDivider(dp,f,projectMeta,embLogo,fonts,rgb,{dark:themeDark,pale:themePale,accent:themeAccent,text:themeText});

                        if(!f.isHeader){
                            if(f.isPlaceholder){
                                for(let k=0;k<(f.rawPages||1);k++){
                                    const pgIdx=pdf.getPageCount();
                                    pageSection.set(pgIdx,{label:f.sectionLabel,title:f.sectionTitle||''});
                                    const p=pdf.addPage(SZ);
                                    drawWrappedText(p,"PLACEHOLDER",height/2,20,fontBold,rgb,[0.8,0.8,0.8]);
                                }
                            } else {
                                try {
                                    let bytes;
                                    if(f.fileObj) bytes=await f.fileObj.arrayBuffer();
                                    else if(f.downloadURL){const r=await fetch(f.downloadURL);if(!r.ok)throw new Error(`HTTP ${r.status}`);bytes=await r.arrayBuffer();}
                                    if(bytes){
                                        const src=await PDFDocument.load(bytes,{ignoreEncryption:true});
                                        const copied=await pdf.copyPages(src,src.getPageIndices());
                                        copied.forEach(pg=>{
                                            const pgIdx=pdf.getPageCount();
                                            pageSection.set(pgIdx,{label:f.sectionLabel,title:f.sectionTitle||''});
                                            pdf.addPage(pg);
                                        });
                                    }
                                } catch(e){
                                    const pgIdx=pdf.getPageCount();
                                    pageSection.set(pgIdx,{label:f.sectionLabel,title:f.sectionTitle||''});
                                    const ep=pdf.addPage(SZ);
                                    ep.drawText("Error loading: "+cleanText(f.name),{x:50,y:700,size:10,font:fontRegular});
                                }
                            }
                        }
                    }

                    // Attach PDF bookmarks (outline sidebar in Acrobat/Reader)
                    if (bookmarksEnabled && bookmarkData.length > 0) {
                        addPDFBookmarks(pdf, bookmarkData);
                    }

                    // Footer pass — page numbers + section footers + watermark
                    // Page numbering starts at TOC (page index 1), cover has no number
                    const cnt=pdf.getPageCount();
                    const { degrees } = window.PDFLib;
                    for(let i=0;i<cnt;i++){
                        const p=pdf.getPage(i);
                        const { width: pgW, height: pgH } = p.getSize();

                        // Page number — skip cover page (i===0), number starts at 1 from TOC
                        if (i > 0) {
                            const txt=`${i}`; // i===1 → "1" on first TOC page
                            const tw=fontRegular.widthOfTextAtSize(txt,9);
                            const numX=pageNumberPos==='left'?40:pageNumberPos==='center'?(pgW-tw)/2:pgW-40-tw;
                            p.drawText(txt,{x:numX,y:18,size:9,font:fontRegular,color:rgb(0.4,0.4,0.4)});
                        }

                        // Section label + title — left footer, content pages only
                        const sec=pageSection.get(i);
                        if(sec){
                            const rawFooter=`${sec.label}  ${cleanText(sec.title)}`;
                            const maxFooterW=(pgW/2)-30;
                            const fWords=rawFooter.split(' ');
                            let fLine=fWords[0]||'';
                            for(let w=1;w<fWords.length;w++){
                                const test=fLine+' '+fWords[w];
                                if(fontBold.widthOfTextAtSize(test,8)<maxFooterW) fLine=test;
                                else break;
                            }
                            p.drawText(fLine,{x:40,y:18,size:8,font:fontBold,color:rgb(0.4,0.4,0.4)});
                        }

                        // Watermark — diagonal stamp
                        if (watermarkEnabled && watermarkText.trim()) {
                            const wText = watermarkText.trim().toUpperCase();
                            // Skip pages based on scope setting
                            const isCover = i === 0;
                            const isTOC = i > 0 && i <= tocPgs;
                            const isDivider = dividerPageIndices.has(i);
                            const isAppPage = isCover || isTOC || isDivider;
                            if (watermarkPages === 'all' || !isAppPage) {
                                // Scale font size to text length so it fills the page nicely
                                const wmSize = Math.min(72, Math.max(24, Math.floor(320 / Math.max(wText.length, 4))));
                                const wmW = fontBold.widthOfTextAtSize(wText, wmSize);
                                // Center on page, rotated 45 degrees
                                // When rotated, the text origin is at the center
                                const cx = pgW / 2;
                                const cy = pgH / 2;
                                // Offset so centered text rotates around page center
                                const offsetX = cx - (wmW / 2) * Math.cos(Math.PI/4) + (wmSize / 2) * Math.sin(Math.PI/4);
                                const offsetY = cy - (wmW / 2) * Math.sin(Math.PI/4) - (wmSize / 2) * Math.cos(Math.PI/4);
                                p.drawText(wText, {
                                    x: offsetX,
                                    y: offsetY,
                                    size: wmSize,
                                    font: fontBold,
                                    color: rgb(0.75, 0.75, 0.75),
                                    opacity: 0.22,
                                    rotate: degrees(45),
                                });
                            }
                        }
                    }

                    
                    const bytes=await pdf.save();
                    if(action==='preview'){setPdfData(bytes);}
                    else{const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;if(action==='open')a.target='_blank';else a.download=`Binder_${projectMeta.number}.pdf`;document.body.appendChild(a);a.click();document.body.removeChild(a);}

                    }
                    const bytes=await pdf.save();
                    const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`TOC_${projectMeta.number}.pdf`;document.body.appendChild(a);a.click();document.body.removeChild(a);
                } catch(e){alert("TOC Export Error: "+e.message);}
                finally{setIsProcessing(false);}

                    {/* Header */}
                    <div className="flex-none bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm z-10">
