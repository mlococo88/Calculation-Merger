<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CalcBinder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans', sans-serif; }
        .preview-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .preview-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .preview-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .preview-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .drag-ghost { opacity: 0.5; background: white; border: 1px solid #ccc; }

        /* Brand color utilities (defined explicitly since Tailwind CDN JIT
           doesn't reliably generate custom color classes at runtime) */
        :root {
            --brand-blue:    #377F99;
            --brand-blue-dk: #265f75;
            --brand-blue-md: #2d7289;
            --brand-blue-lt: #5aa3bc;
            --brand-blue-pl: #e6f3f8;
            --brand-gray:    #54585A;
            --brand-red:     #C8102E;
        }
        .bg-brand-blue       { background-color: var(--brand-blue)    !important; }
        .bg-brand-blue-dk    { background-color: var(--brand-blue-dk)  !important; }
        .bg-brand-blue-md    { background-color: var(--brand-blue-md)  !important; }
        .bg-brand-blue-lt    { background-color: var(--brand-blue-lt)  !important; }
        .bg-brand-blue-pl    { background-color: var(--brand-blue-pl)  !important; }
        .text-brand-blue     { color: var(--brand-blue)    !important; }
        .text-brand-blue-dk  { color: var(--brand-blue-dk)  !important; }
        .text-brand-blue-lt  { color: var(--brand-blue-lt)  !important; }
        .border-brand-blue   { border-color: var(--brand-blue) !important; }
        .ring-brand-blue     { --tw-ring-color: var(--brand-blue) !important; }

        .hover\:bg-brand-blue:hover    { background-color: var(--brand-blue)    !important; }
        .hover\:bg-brand-blue-dk:hover { background-color: var(--brand-blue-dk)  !important; }
        .hover\:bg-brand-blue-pl:hover { background-color: var(--brand-blue-pl)  !important; }
        .hover\:text-brand-blue:hover  { color: var(--brand-blue) !important; }

        .focus\:border-brand-blue:focus { border-color: var(--brand-blue) !important; }
        .focus\:ring-brand-blue:focus   { --tw-ring-color: var(--brand-blue) !important; }

        .border-brand-blue  { border-color: var(--brand-blue) !important; }
        .ring-2.ring-brand-blue { --tw-ring-color: var(--brand-blue) !important; }
        .border-l-4.border-brand-blue { border-left-color: var(--brand-blue) !important; }
        .border-t-2.border-t-brand-blue { border-top-color: var(--brand-blue) !important; }
    </style>
</head>
<body class="bg-slate-100 overflow-hidden">
    <div id="root" class="h-screen flex flex-col"></div>
    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useMemo, useEffect, useCallback } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { Upload, FileText, ArrowUp, ArrowDown, ArrowRight, ArrowLeft, Trash2, Save, FilePlus, Settings, Eye, AlertCircle, AlignLeft, AlignCenter, AlignRight, Image as ImageIcon, X, FileQuestion, RefreshCw, Check, Loader2, Lock, Key, RotateCcw, AlertTriangle, FolderPlus, Layout, LogOut, Globe, PenTool, ClipboardList, Type, Copy, GripVertical, ExternalLink, ChevronLeft, ChevronRight, ChevronDown, ChevronUp, Search, Tag, FileDown, Clock, User, Hash, MessageSquare, Send, Trash, Mail, FileUp, BookOpen, HardDrive, Highlighter, Paperclip } from 'https://esm.sh/lucide-react@0.263.1';

        // --- BUILD MARKER (bump when shipping a new revision so a stale cached copy is obvious) ---
        const BUILD_ID = '2026-07-29-s5n6';
        console.log(`%cCalcBinder build ${BUILD_ID} — Stage 4 M1–M3: schema v4, revision chains, QC status ladder, revision history panel`, 'color:#377F99;font-weight:bold');

        // --- LOCAL STORAGE LAYER (IndexedDB) ---
        // Database "calcbinder" (v2) with three stores:
        //   projects — project metadata + section records + audit/version history (keyPath: id)
        //   blobs    — PDF and image bytes as native Blobs (keyPath: id)
        //   settings — app-wide settings, e.g. the local user profile (keyPath: id)
        const DB_NAME = 'calcbinder';
        const DB_VERSION = 2;
        let _dbPromise = null;
        const openDB = () => {
            if (!_dbPromise) {
                _dbPromise = new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = () => {
                        const d = req.result;
                        if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'id' });
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
                });
            }
            return _dbPromise;
        };
        const idbOp = async (store, mode, fn) => {
            const d = await openDB();
            return new Promise((resolve, reject) => {
                const tx = d.transaction(store, mode);
                const req = fn(tx.objectStore(store));
                tx.oncomplete = () => resolve(req ? req.result : undefined);
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
            });
        };
        const idb = {
            getAllProjects: () => idbOp('projects', 'readonly',  os => os.getAll()),
            getProject:    (id) => idbOp('projects', 'readonly',  os => os.get(id)),
            putProject:   (rec) => idbOp('projects', 'readwrite', os => os.put(rec)),
            deleteProject: (id) => idbOp('projects', 'readwrite', os => os.delete(id)),
            putBlob: (id, blob) => idbOp('blobs', 'readwrite', os => os.put({ id, blob })),
            getBlob: async (id) => { const r = await idbOp('blobs', 'readonly', os => os.get(id)); return r ? r.blob : null; },
            getAllBlobKeys: () => idbOp('blobs', 'readonly', os => os.getAllKeys()),
            getAllBlobs:    () => idbOp('blobs', 'readonly', os => os.getAll()),
            deleteBlob:    (id) => idbOp('blobs', 'readwrite', os => os.delete(id)),
            getSetting:    (id) => idbOp('settings', 'readonly',  os => os.get(id)),
            putSetting:   (rec) => idbOp('settings', 'readwrite', os => os.put(rec)),
        };
        // Blob → data: URL (used for images so generateBinder's PNG/JPG sniffing keeps working)
        const blobToDataURL = (blob) => new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onloadend = () => resolve(r.result);
            r.onerror = () => reject(r.error || new Error('FileReader failed'));
            r.readAsDataURL(blob);
        });
        // Blob → raw base64 (no data: prefix), for .calcbinder export
        const blobToBase64 = async (blob) => {
            const dataUrl = await blobToDataURL(blob);
            return dataUrl.slice(dataUrl.indexOf(',') + 1);
        };
        // base64 → Uint8Array, for .calcbinder import (chunked so large strings don't choke)
        const base64ToBytes = (b64) => {
            const bin = atob(b64);
            const len = bin.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        };
        const CALCBINDER_FORMAT = 'calcbinder-project';
        const CALCBINDER_VERSION = 4; // payload schema version (1=Stage 2, 2=Stage 3, 3=Stage 4: issues + revision chains, 4=Stage 5: review markups)
        // ── STAGE 4 · CONTENT HASH ────────────────────────────────────────────────
        // SHA-256 of the PDF bytes, used to recognise a re-upload of a file we already
        // hold. crypto.subtle is unavailable on insecure origins, and Mario opens this
        // file straight off disk, so EVERY caller must tolerate a null hash: a null
        // simply means "can't prove it's a duplicate", and we store the bytes again.
        // Annotation subtypes a human actually draws. Link is generated by the
        // authoring tool, Popup is the child window of another annotation, and Widget
        // is a form field — none of them are evidence that anyone reviewed anything.
        const MARKUP_SUBTYPES = new Set(['Text','FreeText','Line','Square','Circle','Polygon','PolyLine',
            'Highlight','Underline','Squiggly','StrikeOut','Stamp','Caret','Ink','FileAttachment','Sound','Redact']);
        // Returns a count, or null when the PDF could not be walked. Null is not zero:
        // "I could not tell" and "there is nothing there" lead to different sentences.
        // Zero is also not proof of a clean file — Bluebeam and Acrobat can flatten
        // markups into page content, where they are ink on the page and invisible here.
        const countMarkupAnnots = (pdfDoc) => {
            try {
                const PDFName = window.PDFLib.PDFName;
                let n = 0;
                for (const page of pdfDoc.getPages()) {
                    const annots = page.node.Annots ? page.node.Annots() : null;
                    if (!annots || typeof annots.size !== 'function') continue;
                    for (let i = 0; i < annots.size(); i++) {
                        let d = null;
                        try { d = annots.lookup(i); } catch(e) { continue; }
                        if (!d || typeof d.get !== 'function') continue;
                        const st = d.get(PDFName.of('Subtype'));
                        if (!st) continue;
                        if (MARKUP_SUBTYPES.has(String(st).replace(/^\//,''))) n++;
                    }
                }
                return n;
            } catch(e) { return null; }
        };
        const sha256Hex = async (blobOrFile) => {
            try {
                if (!window.crypto || !window.crypto.subtle) return null;
                const buf = await blobOrFile.arrayBuffer();
                const digest = await window.crypto.subtle.digest('SHA-256', buf);
                return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
            } catch(e) { return null; }
        };

        const fmtBytes = (n) => n >= 1048576 ? (n/1048576).toFixed(1)+' MB' : n >= 1024 ? (n/1024).toFixed(0)+' KB' : n+' B';
        const safeFileName = (s) => (String(s||'project').replace(/[^a-zA-Z0-9 _-]/g,'').trim().replace(/\s+/g,'_') || 'project');
        // Filesystem-safe but readable (keeps spaces and dots; strips only illegal chars) — for in-zip section filenames
        const safeReadableName = (s) => (String(s||'file').replace(/[\\/:*?"<>|\x00-\x1f]/g,'-').replace(/\s+/g,' ').trim().slice(0,120) || 'file');
        // MIME type inferred from an in-zip path extension (JSZip async('blob') loses type)
        const typeFromPath = (p) => { const m=/\.([a-z0-9]+)$/i.exec(p||''); const e=(m?m[1]:'').toLowerCase();
            return e==='pdf'?'application/pdf':e==='png'?'image/png':(e==='jpg'||e==='jpeg')?'image/jpeg':'application/octet-stream'; };

        // --- USER PROFILE + AUDIT MODEL (Stage 3) ---
        const SETTINGS_PROFILE_ID = 'profile';
        const deriveInitials = (name) => String(name||'').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,3);
        const blankProfile = () => ({ name:'', title:'', office:'', email:'', initials:'' });
        // A frozen copy of who performed an action, stamped into each audit entry
        const actorFromProfile = (p) => {
            const prof = p || blankProfile();
            const name = (prof.name||'').trim();
            return { name: name || 'Unknown user', title: prof.title||'', office: prof.office||'', email: prof.email||'', initials: (prof.initials||deriveInitials(name)||'?') };
        };
        // action: 'created'|'exported'|'imported'|'section-added'|'section-removed'|'section-reordered'
        //         |'pdf-replaced'|'status-changed'|'signoff-changed'|'note-edited'|'settings-changed'|'rolled-back'
        const makeAuditEntry = (action, actor, extra={}) => ({
            id: crypto.randomUUID(),
            ts: new Date().toISOString(),
            actor,
            action,
            version: extra.version,
            sectionId: extra.sectionId || null,
            sectionLabel: extra.sectionLabel || null,
            note: extra.note || null,
            diff: extra.diff || null,       // array of change descriptors (see diffProjects)
            detail: extra.detail || null,   // human-readable description of this specific change
            summary: extra.summary || null,
        });
        // --- STAGE 4: RECORD SCHEMA ---
        // Bump CB_SCHEMA whenever the *shape* of a stored record changes. The hydrate guard
        // compares against it, so a migration is written back exactly once per record.
        const CB_SCHEMA = 5;

        // A tracked QC item. Comments used to be free text; Stage 4 gives each one an
        // identity, an open/resolved lifecycle and the revision it was raised against,
        // so "was this comment addressed?" has an answer the binder can print.
        const QC_SEVERITY = [
            { value:'comment',  label:'Comment',  color:'bg-slate-100 text-slate-600',    dot:'bg-slate-400'  },
            { value:'minor',    label:'Minor',    color:'bg-sky-100 text-sky-700',        dot:'bg-sky-500'    },
            { value:'major',    label:'Major',    color:'bg-orange-100 text-orange-700',  dot:'bg-orange-500' },
            { value:'hold',     label:'Hold',     color:'bg-red-100 text-red-700',        dot:'bg-red-500'    },
        ];
        const sevStyle = (v) => QC_SEVERITY.find(x=>x.value===v) || QC_SEVERITY[0];
        const QC_STATE = {
            open:     { label:'Open',     color:'bg-amber-100 text-amber-700'   },
            resolved: { label:'Resolved', color:'bg-sky-100 text-sky-700'       },
            closed:   { label:'Closed',   color:'bg-green-100 text-green-700'   },
        };
        const makeQcItem = (o={}) => ({
            id: o.id || crypto.randomUUID(),
            kind: o.kind || 'note',            // 'note' = plain remark, 'qc' = tracked item
            text: o.text || '',
            status: o.status || 'open',        // open → resolved (by designer) → closed (by checker)
            severity: o.severity || 'comment',
            author: o.author || 'Unknown user',
            authorInitials: o.authorInitials || '?',
            timestamp: o.timestamp || new Date().toISOString(),
            pageRef: o.pageRef || null,        // free text: "p. 4", "sheet S2.1"
            revId: o.revId || null,            // the revision this was raised against
            revLabel: o.revLabel || null,
            resolvedBy: o.resolvedBy || null, resolvedAt: o.resolvedAt || null, resolutionText: o.resolutionText || null,
            closedBy: o.closedBy || null, closedAt: o.closedAt || null,
            replies: o.replies || [],
        });

        // A section's revision chain entry. INVARIANT: when revisions.length > 0,
        // file.blobKey === revisions[revisions.length-1].blobKey. Everything downstream
        // (generateBinder, export, gcBlobs) keeps reading file.blobKey and needs no change.
        // The current PDF of a section is always the last entry in its chain.
        // Module scope: the QC dashboard is defined outside App and needs this too.
        const headRevision = (f) => { const rs = f && f.revisions; return (rs && rs.length) ? rs[rs.length-1] : null; };
        const makeRevision = (o={}) => ({
            revId: o.revId || crypto.randomUUID(),  // stable identity; the merge key across copies
            rev: o.rev !== undefined ? String(o.rev) : '0',
            revLocked: !!o.revLocked,               // true once a human types their own label
            blobKey: o.blobKey || null,
            sha256: o.sha256 || null,               // filled in a later milestone (dedup)
            name: o.name || '',
            pageCount: o.pageCount !== undefined ? o.pageCount : null,
            size: o.size !== undefined ? o.size : null,   // bytes, numeric
            ts: o.ts || new Date().toISOString(),
            actor: o.actor || null,
            note: o.note || null,
            supersededAt: o.supersededAt || null,   // ISO when a newer entry took over; null on the head
            reason: o.reason || 'replace',          // 'initial'|'replace'|'restore'|'import'
            synthetic: !!o.synthetic,               // fabricated by migration, not observed
            markups: Array.isArray(o.markups) ? o.markups : [],  // Stage 5: redlines drawn on THIS revision
        });

        // --- STAGE 5: REVIEW MARKUPS ---
        // A markup is NOT a revision of the calc. It is a comment carrier bolted to
        // one exact set of pages, so it hangs off a revision entry rather than off the
        // section: attach it to the section and the moment Rev 2 lands the markup is
        // silently pointing at pages that no longer exist.
        //
        // Two scopes, matching the two review rounds:
        //   'section' — lives on revision.markups[]; the detail check, one calc at a time
        //   'binder'  — lives on record.markups[];  the QC review, read as a package
        // A binder markup has no single revision to belong to, so it pins the project
        // version it was drawn on and carries the page ranges needed to resolve any
        // annotation back to the section that owns it.
        const makeMarkup = (o={}) => ({
            markupId: o.markupId || crypto.randomUUID(),  // stable identity; the merge key across copies
            scope: o.scope === 'binder' ? 'binder' : 'section',
            blobKey: o.blobKey || null,
            sha256: o.sha256 || null,               // collapses the same redline attached on two machines
            name: o.name || '',
            pageCount: o.pageCount !== undefined ? o.pageCount : null,
            size: o.size !== undefined ? o.size : null,   // bytes, numeric
            ts: o.ts || new Date().toISOString(),
            actor: o.actor || null,                 // who attached it to the project
            reviewer: o.reviewer || null,           // who drew on it, when that is someone else
            note: o.note || null,
            absent: !!o.absent,                     // the record travelled, the PDF did not
            annotationCount: o.annotationCount !== undefined ? o.annotationCount : null,
            extracted: !!o.extracted,               // QC items have already been generated from it
            // binder scope only — null on a section markup
            projectVersion: o.projectVersion !== undefined ? o.projectVersion : null,
            issueId: o.issueId || null,             // the stamped issue this binder went out as, if any
            pageMap: o.pageMap || null,             // [{id, from, to}] — resolves a page back to its section
        });
        const markupsOfRevision = (r) => (r && Array.isArray(r.markups)) ? r.markups : [];
        // Every markup in a record, section-level and binder-level alike.
        const allMarkupsOfRecord = (rec) => {
            const out = [];
            (rec && rec.files || []).forEach(f => (f.revisions||[]).forEach(r => markupsOfRevision(r).forEach(m => { if (m) out.push(m); })));
            (rec && rec.markups || []).forEach(m => { if (m) out.push(m); });
            return out;
        };

        // Merge two copies of the same markup list. Identity is markupId; the same
        // redline attached independently on two machines gets two ids, so sha256
        // collapses those. A copy that still holds its PDF always beats one that
        // lost it in transit — "absent" is a fact about an archive, not about the
        // markup, and it must never travel back onto a copy that has the bytes.
        const mergeMarkupLists = (localMs, incomingMs) => {
            const local = (localMs||[]).filter(Boolean);
            const incoming = (incomingMs||[]).filter(Boolean);
            if (!local.length) return incoming.map(m=>({...m}));
            if (!incoming.length) return local.map(m=>({...m}));
            const byId = new Map();
            const absorb = (m) => {
                const prev = byId.get(m.markupId);
                if (!prev) { byId.set(m.markupId, {...m}); return; }
                const blobKey = prev.blobKey || m.blobKey || null;
                byId.set(m.markupId, { ...prev, ...m,
                    blobKey,
                    absent: blobKey ? false : !!(prev.absent || m.absent),
                    reviewer: prev.reviewer || m.reviewer || null,
                    note: prev.note || m.note || null,
                    actor: prev.actor || m.actor || null,
                    // Once either side has pulled QC items out of a redline, doing it
                    // again on the other side would duplicate every comment.
                    extracted: !!(prev.extracted || m.extracted),
                    annotationCount: (prev.annotationCount !== null && prev.annotationCount !== undefined) ? prev.annotationCount : m.annotationCount,
                    // Earliest observation wins — that is when the review happened.
                    ts: (prev.ts && m.ts) ? (prev.ts < m.ts ? prev.ts : m.ts) : (prev.ts || m.ts),
                });
            };
            local.forEach(absorb); incoming.forEach(absorb);
            const ordered = [...byId.values()].sort((a,b)=>String(a.ts||'').localeCompare(String(b.ts||'')));
            const bySha = new Map(); const out = [];
            for (const m of ordered) {
                const prev = m.sha256 ? bySha.get(m.sha256) : null;
                if (!prev) { if (m.sha256) bySha.set(m.sha256, m); out.push(m); continue; }
                prev.blobKey = prev.blobKey || m.blobKey || null;
                if (prev.blobKey) prev.absent = false;
                prev.note = prev.note || m.note || null;
                prev.reviewer = prev.reviewer || m.reviewer || null;
                prev.extracted = !!(prev.extracted || m.extracted);
            }
            return out;
        };

        // Merging two review rounds, THE MORE OPEN STATE WINS. If one side closed an
        // item and the other never saw the close, the item stays open. That is
        // deliberately asymmetric: losing a close costs one click, losing an open
        // comment costs a check.
        const QC_OPENNESS = { open:0, resolved:1, closed:2 };
        const mergeQcItems = (localItems, incomingItems) => {
            const byId = new Map();
            const replyKey = (r) => `${(r&&r.author)||''}|${(r&&r.timestamp)||''}|${((r&&r.text)||'').slice(0,80)}`;
            const absorb = (it) => {
                if (!it || !it.id) return;
                const prev = byId.get(it.id);
                if (!prev) { byId.set(it.id, {...it}); return; }
                const pr = QC_OPENNESS[prev.status] ?? 0, nr = QC_OPENNESS[it.status] ?? 0;
                const winner = nr < pr ? it : prev;   // lower rank = more open
                const seen = new Set(); const replies = [];
                [...(prev.replies||[]), ...(it.replies||[])].forEach(r => { const k = replyKey(r); if (!seen.has(k)) { seen.add(k); replies.push(r); } });
                replies.sort((a,b)=>String((a&&a.timestamp)||'').localeCompare(String((b&&b.timestamp)||'')));
                byId.set(it.id, { ...prev, ...it,
                    status: winner.status,
                    resolvedBy: winner.resolvedBy||null, resolvedAt: winner.resolvedAt||null, resolutionText: winner.resolutionText||null,
                    closedBy: winner.closedBy||null, closedAt: winner.closedAt||null,
                    // A comment is written once, by its author. The earliest copy is
                    // the one that has not been through a round trip.
                    text: prev.text || it.text || '',
                    timestamp: (prev.timestamp && it.timestamp) ? (prev.timestamp < it.timestamp ? prev.timestamp : it.timestamp) : (prev.timestamp || it.timestamp),
                    replies,
                });
            };
            (localItems||[]).forEach(absorb); (incomingItems||[]).forEach(absorb);
            return [...byId.values()].sort((a,b)=>String(a.timestamp||'').localeCompare(String(b.timestamp||'')));
        };
        const mergeCommentMaps = (localC, incomingC) => {
            const out = {};
            new Set([...Object.keys(localC||{}), ...Object.keys(incomingC||{})]).forEach(sid => {
                out[sid] = mergeQcItems((localC||{})[sid], (incomingC||{})[sid]);
            });
            return out;
        };

        // Give a pre-Stage-4 file a one-entry chain describing the PDF it already holds.
        const upgradeFileRecord = (f) => {
            if (!f) return f;
            if (f.status === 'review') f.status = 'for-check';
            (f.revisions||[]).forEach(r => { if (r && !Array.isArray(r.markups)) r.markups = []; });
            if (!Array.isArray(f.revisions)) {
                f.revisions = f.blobKey ? [makeRevision({
                    rev: String(f.revision || '0'),
                    revLocked: !!f.revision && f.revision !== '0',

        };

        // Give every note a stable id and QC-item fields. MUST only run once per record —
        // re-running mints fresh ids and would wipe resolution state, hence the schema guard.
        const upgradeComments = (c) => {
            const out = {};
            for (const sid of Object.keys(c || {})) {
                out[sid] = (c[sid] || []).map(m => (m && m.id) ? m : makeQcItem({

        };

        // Lazily bring an older project record up to the current shape (non-destructive, idempotent)
        // Merge one section's revision chain across two copies of the same project.
        // Identity is revId. The same PDF uploaded independently on two machines gets
        // two revIds, so sha256 collapses those. Two rules are non-negotiable:
        //   • the head must end up last  — file.blobKey === revisions.at(-1).blobKey
        //   • a hand-typed label is a fixed point — auto-numbering works around it
        const mergeRevisionChains = (localRevs, incomingRevs, headBlobKey) => {
            const local = (localRevs||[]).filter(Boolean);
            const incoming = (incomingRevs||[]).filter(Boolean);
            if (!local.length) return incoming.map(r=>({...r}));
            if (!incoming.length) return local.map(r=>({...r}));

            const byId = new Map();
            const absorb = (r) => {
                const prev = byId.get(r.revId);
                if (!prev) { byId.set(r.revId, {...r}); return; }

                // except for the head, where the key the file points at has to win.
                const blobKey = (headBlobKey && (prev.blobKey === headBlobKey || r.blobKey === headBlobKey))

                    absent: blobKey ? false : !!(prev.absent || r.absent),
                    // Two people each attached a redline to the same revision. Both
                    // are real comments on the same pages; neither gets dropped.
                    markups: mergeMarkupLists(prev.markups, r.markups),
                    revLocked: locked,

                    note: prev.note || r.note || null,
                    actor: prev.actor || r.actor || null,
                    // Earliest observation wins — that is when the revision actually happened.
                    ts: (prev.ts && r.ts) ? (prev.ts < r.ts ? prev.ts : r.ts) : (prev.ts || r.ts),
                });
            };
            local.forEach(absorb); incoming.forEach(absorb);
            // ── collapse identical bytes, oldest kept ─────────────────────────
            const ordered = [...byId.values()].sort((a,b)=>String(a.ts||'').localeCompare(String(b.ts||'')));

            for (const r of ordered) {
                const prev = r.sha256 ? bySha.get(r.sha256) : null;

                if (headBlobKey && r.blobKey === headBlobKey) prev.blobKey = headBlobKey;

            // ── renumber the unlocked labels around the locked ones ───────────

        const upgradeProjectRecord = (rec) => {

                if ((pf.title||'') !== (f.title||'')) changes.push({ scope:'section', type:'section-title-changed', sectionId:id, sectionLabel:f.label, detail:`Title: "${pf.title||''}" → "${f.title||''}"` });

        // --- UTILS ---
        const isEqual = (a, b) => { if (a === b) return true; if (a && b && typeof a === 'object' && typeof b === 'object') { if (Array.isArray(a) !== Array.isArray(b)) return false; const keys = Object.keys(a); if (keys.length !== Object.keys(b).length) return false; return keys.every(k => b.hasOwnProperty(k) && isEqual(a[k], b[k])); } return false; };

        // Stage 4: the QC check/backcheck ladder. drawFormalDivider reads this array BY VALUE
        // (find-by-value, badge suppressed only for 'draft', green only for 'approved'), so adding
        // entries here needs no change to any protected function. 'review' is retained as a hidden
        // legacy value so pre-Stage-4 records and snapshots still render a sensible label.
        const STATUS_OPTIONS = [
            { value: 'draft',       label: 'Draft',           color: 'bg-slate-100 text-slate-600'   },
            { value: 'for-check',   label: 'For Check',       color: 'bg-sky-100 text-sky-700'       },
            { value: 'commented',   label: 'Comments Issued', color: 'bg-orange-100 text-orange-700' },
            { value: 'revised',     label: 'Revised',         color: 'bg-amber-100 text-amber-700'   },
            { value: 'backchecked', label: 'Backchecked',     color: 'bg-violet-100 text-violet-700' },
            { value: 'approved',    label: 'Approved',        color: 'bg-green-100 text-green-700'   },
            { value: 'review',      label: 'In Review',       color: 'bg-amber-100 text-amber-700', hidden: true },
        ];
        const VISIBLE_STATUS_OPTIONS = STATUS_OPTIONS.filter(s => !s.hidden);
        const getStatusStyle = (v) => STATUS_OPTIONS.find(s => s.value === v) || STATUS_OPTIONS[0];

        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {

        // --- PDF CANVAS PREVIEW ---
        const PdfCanvasPreview = ({ pdfData }) => {
            const canvasRef = useRef(null), containerRef = useRef(null);
            const [pdfDoc, setPdfDoc] = useState(null), [pageNum, setPageNum] = useState(1), [numPages, setNumPages] = useState(0), [baseWidth, setBaseWidth] = useState(0), [renderError, setRenderError] = useState(null);

                                    </div>
                                </div>

                                {/* Per-project */}
                                <div className="bg-white border border-slate-200 rounded-lg overflow-hidden">
                                    <p className="text-[11px] font-bold uppercase tracking-wide text-slate-400 px-3 pt-3 pb-2">By project</p>
                                    <table className="w-full text-xs">
                                        <thead><tr className="text-[10px] uppercase tracking-wide text-slate-400 border-b border-slate-100">
                                            <th className="text-left font-bold px-3 py-1.5">Project</th>
                                            <th className="text-right font-bold px-2 py-1.5">Sections</th>
                                            <th className="text-right font-bold px-2 py-1.5">Superseded</th>
                                            <th className="text-right font-bold px-2 py-1.5">Markups</th>
                                            <th className="text-right font-bold px-2 py-1.5">Current</th>
                                            <th className="text-right font-bold px-3 py-1.5">History</th>
                                        </tr></thead>
                                        <tbody>
                                            {stats.rows.map(r=>(
                                                <tr key={r.id} className={`border-b border-slate-50 last:border-0 ${r.active?'bg-brand-blue-pl':''}`}>
                                                    <td className="px-3 py-1.5 text-slate-700 truncate max-w-[240px]">{r.name}{r.active&&<span className="ml-1.5 text-[9px] font-bold uppercase text-brand-blue">open</span>}</td>
                                                    <td className="px-2 py-1.5 text-right text-slate-500">{r.sections}</td>
                                                    <td className="px-2 py-1.5 text-right text-slate-500">{r.superseded}</td>
                                                    <td className="px-2 py-1.5 text-right text-slate-500">{r.markups ? <span className="text-orange-600 font-medium" title={`${fmtDisk(r.markupBytes)} of reviewer markups`}>{r.markups}</span> : <span className="text-slate-300">—</span>}</td>
                                                    <td className="px-2 py-1.5 text-right text-slate-600 font-medium">{fmtDisk(r.currentBytes)}</td>
                                                    <td className="px-3 py-1.5 text-right text-slate-600 font-medium">{fmtDisk(r.historyBytes)}</td>
                                                </tr>
                                            ))}
                                            {stats.rows.length===0&&<tr><td colSpan={6} className="px-3 py-4 text-center text-slate-400">No projects stored</td></tr>}
                                        </tbody>
                                    </table>
                                </div>

                                {/* Prune */}
                                <div className="bg-white border border-slate-200 rounded-lg p-3">
                                    <p className="text-[11px] font-bold uppercase tracking-wide text-slate-400 mb-2">Prune history — open project only</p>
                                    {!hasProject ? (
                                        <p className="text-xs text-slate-400">Open a project to prune its revision history.</p>
                                    ) : (<>
                                        <div className="flex items-center gap-2 mb-2">
                                            <span className="text-xs text-slate-500">Keep the last</span>
                                            {KEEP_CHOICES.map(k=>(
                                                <button key={k} onClick={()=>setKeepN(k)} className={`w-8 py-1 text-xs font-bold rounded border transition-colors ${keepN===k?'border-brand-blue bg-brand-blue-pl text-brand-blue':'border-slate-200 text-slate-500 hover:border-slate-300'}`}>{k}</button>
                                            ))}
                                            <span className="text-xs text-slate-500">revision{keepN===1?'':'s'} of each section</span>
                                        </div>
                                        {plan && plan.sections.length>0 && (
                                            <div className="border border-slate-100 rounded-md divide-y divide-slate-50 mb-2 max-h-40 overflow-y-auto">
                                                {plan.sections.map(s=>(
                                                    <div key={s.id} className="flex items-center justify-between px-2 py-1">
                                                        <span className="text-[11px] text-slate-600 truncate">{s.name}</span>
                                                        <span className="text-[11px] shrink-0 ml-2">
                                                            {s.dropped>0&&<span className="text-red-600 font-semibold">drop {s.dropped}</span>}
                                                            {s.dropped>0&&s.protectedCount>0&&<span className="text-slate-300"> · </span>}
                                                            {s.protectedCount>0&&<span className="text-emerald-700 font-semibold">{s.protectedCount} pinned</span>}
                                                            {(s.dropped>0||s.protectedCount>0)&&s.markupPinned>0&&<span className="text-slate-300"> · </span>}
                                                            {s.markupPinned>0&&<span className="text-orange-600 font-semibold">{s.markupPinned} marked up</span>}
                                                            <span className="text-slate-400"> · {s.had}→{s.kept}</span>
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        <p className="text-[11px] text-slate-500 mb-2">
                                            {plan ? (plan.dropped>0
                                                ? <>This drops <strong>{plan.dropped}</strong> superseded revision{plan.dropped===1?'':'s'}. The current PDF of every section is always kept{plan.protectedCount>0?<>, and <strong>{plan.protectedCount}</strong> older one{plan.protectedCount===1?' is':'s are'} pinned by a stamped issue or a saved version and will be kept too</>:''}{plan.markupPinned>0?<>. <strong>{plan.markupPinned}</strong> older revision{plan.markupPinned===1?' is':'s are'} kept because a reviewer marked {plan.markupPinned===1?'it':'them'} up</>:''}.</>
                                                : <>Nothing to drop at this setting{plan.protectedCount>0?` — ${plan.protectedCount} older revision${plan.protectedCount===1?' is':'s are'} pinned by an issue or a saved version`:''}{plan.markupPinned>0?`${plan.protectedCount>0?', and':' —'} ${plan.markupPinned} ${plan.markupPinned===1?'is':'are'} kept because a reviewer marked ${plan.markupPinned===1?'it':'them'} up`:''}.</>) : 'Preview unavailable.'}
                                        </p>
                                        {done && <p className="text-[11px] text-emerald-700 font-semibold mb-2">Pruned {done.dropped} revision{done.dropped===1?'':'s'}. Rescan below to see the space come back.</p>}
                                        {!confirming ? (
                                            <button onClick={()=>setConfirming(true)} disabled={busy||!plan||plan.dropped===0}
                                                className="px-3 py-1.5 text-xs font-bold rounded-md border border-red-200 text-red-600 hover:bg-red-50 disabled:opacity-40 disabled:hover:bg-transparent">
                                                Prune {plan&&plan.dropped>0?`${plan.dropped} revision${plan.dropped===1?'':'s'}`:'history'}…
                                            </button>
                                        ) : (
                                            <div className="flex items-center gap-2 bg-red-50 border border-red-200 rounded-md px-2 py-1.5">
                                                <AlertTriangle className="w-4 h-4 text-red-500 shrink-0"/>
                                                <span className="text-[11px] text-red-700 flex-1">Those PDFs are deleted for good. Anything a stamped issue or a saved version points at is kept regardless, and so is any revision a reviewer marked up. Markups themselves are never pruned.</span>
                                                <button onClick={()=>setConfirming(false)} disabled={busy} className="px-2 py-1 text-[11px] font-semibold text-slate-500 hover:text-slate-700">Cancel</button>
                                                <button onClick={async()=>{ const r = await onPrune(keepN); setConfirming(false); if(r) setDone(r); }} disabled={busy}
                                                    className="px-2.5 py-1 text-[11px] font-bold text-white rounded bg-red-600 hover:bg-red-700 disabled:opacity-40">{busy?'Pruning…':'Prune'}</button>
                                            </div>
                                        )}
                                    </>)}
                                </div>

                                <p className="text-[10px] text-slate-400 text-center">Sizes are measured from the stored PDFs themselves. A .calcbinder export is the only copy that survives clearing your browser data.</p>
                            </>)}
                        </div>
                    </div>
                </div>
            );
        };

        const OutputConfigModal = ({ onClose, pageNumberPos, setPageNumberPos, showPageHeader, setShowPageHeader,
            bookmarksEnabled, setBookmarksEnabled, appendixEnabled, setAppendixEnabled, watermarkEnabled, setWatermarkEnabled,
            watermarkText, setWatermarkText, watermarkPages, setWatermarkPages, totalFiles }) => (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                <div className="bg-white rounded-lg shadow-xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
                    <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                        <h3 className="font-bold text-slate-800 flex items-center gap-2"><Settings className="w-5 h-5 text-brand-blue"/> Output Settings</h3>
                        <button onClick={onClose} className="p-1 hover:bg-slate-100 rounded-full text-slate-400"><X className="w-5 h-5"/></button>
                    </div>
                    <div className="space-y-5">
                        {/* Page numbering */}
                        <div>
                            <label className="text-xs font-bold text-slate-500 uppercase block mb-2">Page Numbering Position</label>
                            <div className="flex bg-slate-100 p-1 rounded-md">
                                {['left','center','right'].map(pos => (
                                    <button key={pos} onClick={() => setPageNumberPos(pos)} className={`flex-1 py-2 rounded text-sm font-medium transition-all capitalize flex items-center justify-center gap-1 ${pageNumberPos===pos?'bg-white shadow text-brand-blue':'text-slate-500 hover:text-slate-700'}`}>
                                        {pos==='left'&&<AlignLeft className="w-3 h-3"/>}{pos==='center'&&<AlignCenter className="w-3 h-3"/>}{pos==='right'&&<AlignRight className="w-3 h-3"/>} {pos.charAt(0).toUpperCase()+pos.slice(1)}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* General toggles */}
                        <div className="space-y-2">
                            <label className="text-xs font-bold text-slate-500 uppercase block">General</label>
                            {[
                                { label:'Table of Contents', sub:'Auto-Generated', checked:true, disabled:true, onChange:()=>{} },
                                { label:'Section Dividers', sub:'Enabled', checked:true, disabled:true, onChange:()=>{} },
                                { label:'Page Headers', sub:'Project No + Title', checked:showPageHeader, disabled:false, onChange:e=>setShowPageHeader(e.target.checked) },
                                { label:'PDF Bookmarks', sub:'Sidebar outline in Acrobat', checked:bookmarksEnabled, disabled:false, onChange:e=>setBookmarksEnabled(e.target.checked) },
                                { label:'Revision & QC Appendix', sub:'Added at the end', checked:appendixEnabled, disabled:false, onChange:e=>setAppendixEnabled(e.target.checked) },
                            ].map(item=>(
                                <div key={item.label} className="flex items-center justify-between py-1">
                                    <div className="flex items-center gap-2">
                                        <input type="checkbox" checked={item.checked} disabled={item.disabled} onChange={item.onChange} className="rounded text-brand-blue disabled:opacity-60"/>
                                        <span className={`text-sm font-medium ${item.disabled?'text-slate-400':'text-slate-700'}`}>{item.label}</span>
                                    </div>
                                    <span className="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded">{item.sub}</span>
                                </div>
                            ))}
                        </div>

                        {/* Watermark */}
                        <div className="space-y-3 pt-3 border-t border-slate-100">
                            <div className="flex items-center justify-between">
                                <label className="text-xs font-bold text-slate-500 uppercase">Watermark</label>
                                <button onClick={()=>setWatermarkEnabled(!watermarkEnabled)} className={`relative w-10 h-5 rounded-full transition-colors ${watermarkEnabled?'bg-brand-blue':'bg-slate-300'}`}>
                                    <div className={`absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform ${watermarkEnabled?'translate-x-5':'translate-x-0'}`}/>
                                </button>
                            </div>
                            {watermarkEnabled && (
                                <div className="space-y-3 pl-1">
                                    {/* Presets */}
                                    <div className="flex flex-wrap gap-1.5">
                                        {WATERMARK_PRESETS.map(p=>(
                                            <button key={p} onClick={()=>setWatermarkText(p)} className={`px-2 py-1 text-xs rounded border font-medium transition-all ${watermarkText===p?'bg-brand-blue text-white border-brand-blue':'bg-white text-slate-600 border-slate-300 hover:border-brand-blue'}`}>{p}</button>
                                        ))}
                                    </div>
                                    {/* Custom text */}
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Custom Text</label>
                                        <input type="text" value={watermarkText} onChange={e=>setWatermarkText(e.target.value.toUpperCase())} maxLength={20} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm font-mono tracking-widest outline-none focus:border-brand-blue" placeholder="DRAFT"/>
                                    </div>
                                    {/* Page scope */}
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Apply To</label>
                                        <div className="flex bg-slate-100 p-0.5 rounded-md">
                                            <button onClick={()=>setWatermarkPages('all')} className={`flex-1 py-1.5 rounded text-xs font-medium transition-all ${watermarkPages==='all'?'bg-white shadow text-brand-blue':'text-slate-500'}`}>All Pages</button>
                                            <button onClick={()=>setWatermarkPages('content')} className={`flex-1 py-1.5 rounded text-xs font-medium transition-all ${watermarkPages==='content'?'bg-white shadow text-brand-blue':'text-slate-500'}`}>Content Only</button>
                                        </div>
                                        <p className="text-[10px] text-slate-400 mt-1">{watermarkPages==='content'?'Skips cover, TOC, and divider pages':'Applied to every page including cover and TOC'}</p>
                                    </div>
                                    {/* Preview badge */}
                                    <div className="flex items-center justify-center h-14 bg-slate-50 border border-slate-200 rounded-lg overflow-hidden relative">
                                        <span className="text-slate-200 font-bold text-2xl tracking-widest select-none" style={{transform:'rotate(-15deg)',opacity:0.7}}>{watermarkText||'DRAFT'}</span>
                                        <span className="text-[9px] text-slate-400 absolute bottom-1 right-2">Preview</span>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="pt-3 border-t border-slate-100 text-center">
                            <span className="text-xs text-slate-400">Total Sections: <span className="font-mono font-bold text-slate-600">{totalFiles}</span></span>
                        </div>
                        <button onClick={onClose} className="w-full py-2 bg-brand-blue-dk text-white rounded font-medium hover:bg-brand-blue">Done</button>
                    </div>
                </div>
            </div>
        );

        // --- COVER SHEET MODAL ---

        // ── STAGE 4 · REVISION HISTORY PANEL ──────────────────────────────────────
        const REV_REASON = {
            initial: { label: 'Original upload', color: 'bg-slate-100 text-slate-600'  },
            replace: { label: 'PDF replaced',    color: 'bg-sky-100 text-sky-700'      },
            restore: { label: 'Restored',        color: 'bg-amber-100 text-amber-700'  },
            import:  { label: 'Imported',        color: 'bg-violet-100 text-violet-700'},
        };

        // Read-only view of one section's revision chain. Every superseded PDF is still
        // in local storage (gcBlobs walks revisions[]), so "View" can always open it and
        // "Make current" can always bring it back.

        // One QC item / note. Shared by the side panel and the Details dialog so the
        // lifecycle behaves identically in both places.
        const QcItemCard = ({ item, stale, compact, onDelete, onSetState }) => {
            const [resolving, setResolving] = useState(false);
            const [resText, setResText] = useState('');
            const d = new Date(item.timestamp);
            const when = d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
            const isQc = item.kind === 'qc';
            const sev = sevStyle(item.severity);
            const st = QC_STATE[item.status] || QC_STATE.open;
            return (
                <div className={`relative group bg-white border rounded-lg px-3 py-2 shadow-sm ${isQc&&item.status==='open'?'border-l-4 border-l-orange-400 border-slate-200':'border-slate-200'}`}>
                    <div className="text-[10px] text-slate-500 mb-1 flex items-center gap-1.5 flex-wrap">
                        {isQc && <span className={`font-bold px-1.5 py-0.5 rounded-full ${sev.color}`}>{sev.label}</span>}
                        {isQc && <span className={`font-bold px-1.5 py-0.5 rounded-full ${st.color}`}>{st.label}</span>}
                        <span className="font-semibold text-slate-600">{item.author||'Unknown user'}</span>
                        <span className="text-slate-300">·</span>
                        <span className="text-slate-400 flex items-center gap-1"><Clock className="w-2.5 h-2.5"/>{when}</span>
                        {item.pageRef && <span className="text-slate-400">· {item.pageRef}</span>}
                        {item.revLabel != null && <span className="text-slate-400 font-mono">· Rev {item.revLabel}</span>}
                    </div>
                    <div className={`${compact?'text-xs':'text-sm'} text-slate-800 whitespace-pre-wrap`}>{item.text}</div>

                    {stale && item.status !== 'closed' && (
                        <div className="mt-1.5 text-[10px] text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1 flex items-start gap-1">
                            <AlertTriangle className="w-3 h-3 shrink-0 mt-px"/>
                            <span>Raised against Rev {item.revLabel} — the PDF has been revised since. Confirm this still applies.</span>
                        </div>
                    )}
                    {item.resolutionText && (
                        <div className="mt-1.5 text-[11px] text-slate-600 bg-slate-50 border border-slate-200 rounded px-2 py-1">
                            <span className="font-semibold">Response{item.resolvedBy?` — ${item.resolvedBy}`:''}:</span> {item.resolutionText}
                        </div>
                    )}
                    {item.status==='closed' && item.closedBy && (
                        <div className="mt-1 text-[10px] text-green-700 flex items-center gap-1"><Check className="w-3 h-3"/> Backchecked by {item.closedBy}</div>
                    )}

                    {isQc && onSetState && (
                        resolving ? (
                            <div className="mt-2 flex gap-1.5 items-end">
                                <textarea autoFocus value={resText} onChange={e=>setResText(e.target.value)} rows={2} placeholder="What did you change? (optional)" className="flex-1 border border-slate-300 rounded px-2 py-1 text-[11px] resize-none outline-none focus:border-brand-blue"/>
                                <button onClick={()=>{onSetState(item.id,'resolved',resText);setResolving(false);setResText('');}} className="px-2 py-1 text-[10px] font-bold text-white bg-brand-blue hover:bg-brand-blue-dk rounded shrink-0">Save</button>
                                <button onClick={()=>{setResolving(false);setResText('');}} className="px-2 py-1 text-[10px] text-slate-500 hover:bg-slate-100 rounded shrink-0">Cancel</button>
                            </div>
                        ) : (
                            <div className="mt-2 flex gap-1.5 flex-wrap">
                                {item.status==='open'     && <button onClick={()=>setResolving(true)} className="px-2 py-0.5 text-[10px] font-bold text-sky-700 bg-sky-50 border border-sky-200 hover:bg-sky-100 rounded">Mark resolved</button>}
                                {item.status==='resolved' && <button onClick={()=>onSetState(item.id,'closed')} className="px-2 py-0.5 text-[10px] font-bold text-green-700 bg-green-50 border border-green-200 hover:bg-green-100 rounded">Backcheck &amp; close</button>}
                                {item.status!=='open'     && <button onClick={()=>onSetState(item.id,'open')} className="px-2 py-0.5 text-[10px] font-bold text-slate-500 bg-slate-50 border border-slate-200 hover:bg-slate-100 rounded">Reopen</button>}
                            </div>
                        )
                    )}
                    {onDelete && (
                        <button onClick={()=>onDelete(item.id)} className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-red-500 text-white rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity" title="Delete">
                            <X className="w-2.5 h-2.5"/>
                        </button>
                    )}
                </div>
            );
        };

        // Composer: a plain note, or a tracked QC item with severity and a page reference.
        const QcComposer = ({ onSubmit, compact }) => {
            const [text, setText] = useState('');
            const [kind, setKind] = useState('note');
            const [severity, setSeverity] = useState('comment');
            const [pageRef, setPageRef] = useState('');
            const send = () => { if(!text.trim()) return; onSubmit(text, { kind, severity, pageRef }); setText(''); setPageRef(''); };
            return (
                <div className="space-y-1.5">
                    <div className="flex items-center gap-1.5 flex-wrap">
                        <div className="flex rounded-md overflow-hidden border border-slate-300">
                            <button onClick={()=>setKind('note')} className={`px-2 py-0.5 text-[10px] font-bold ${kind==='note'?'bg-brand-blue text-white':'bg-white text-slate-500 hover:bg-slate-50'}`}>Note</button>
                            <button onClick={()=>setKind('qc')}   className={`px-2 py-0.5 text-[10px] font-bold ${kind==='qc'  ?'bg-brand-blue text-white':'bg-white text-slate-500 hover:bg-slate-50'}`}>QC Item</button>
                        </div>
                        {kind==='qc' && (
                            <>
                                <select value={severity} onChange={e=>setSeverity(e.target.value)} className="text-[10px] border border-slate-300 rounded px-1 py-0.5 outline-none bg-white">
                                    {QC_SEVERITY.map(x=><option key={x.value} value={x.value}>{x.label}</option>)}
                                </select>
                                <input type="text" value={pageRef} onChange={e=>setPageRef(e.target.value)} placeholder="p. 4 (optional)" className="text-[10px] border border-slate-300 rounded px-1.5 py-0.5 w-24 outline-none"/>
                            </>
                        )}
                    </div>
                    <div className="flex gap-2 items-end">
                        <textarea value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }} rows={2}
                            placeholder={kind==='qc'?'Describe the QC item… (Enter to save)':'Add a note… (Enter to save)'}
                            className={`flex-1 border border-slate-300 rounded-xl px-3 py-2 ${compact?'text-xs':'text-sm'} resize-none outline-none focus:border-brand-blue`}/>
                        <button onClick={send} disabled={!text.trim()} className="p-2.5 rounded-xl text-white disabled:opacity-40 transition-colors shrink-0" style={{backgroundColor:'var(--brand-blue)'}}><Send className="w-4 h-4"/></button>
                    </div>
                </div>
            );
        };

        // ── STAGE 4 · NAMED ISSUES ──────────────────────────────────────────────
        // An issue is a name pinned to a moment: "50% CD", "Permit Set". It stores a
        // full record the same way an export snapshot does, which means it pins each
        // section's revId — and because a revId points at a blob the chain already
        // holds, stamping an issue copies NO PDF bytes. Deleting one releases nothing
        // that a live chain still needs; gcBlobs works that out.
        const ISSUE_PRESETS = ['50% CD','75% CD','90% CD','Permit Set','Bid Set','IFC','Record Set'];

        const IssuesModal = ({ issues, sections, binderMarkups, onClose, onStamp, onDelete, busy }) => {
            const [name, setName] = useState('');
            const [note, setNote] = useState('');
            const [openId, setOpenId] = useState(null);
            const [confirmDel, setConfirmDel] = useState(null);

            const list = [...(issues||[])].sort((a,b)=> new Date(b.ts) - new Date(a.ts));
            const live = sections.filter(f=>!f.isHeader);

            // What moved between an issue and the package as it stands now.
            const compare = (iss) => {
                const then = (iss.record?.files||[]).filter(f=>!f.isHeader);
                const byId = {}; then.forEach(f=>byId[f.id]=f);
                const seen = new Set();
                const rows = live.map(f=>{
                    seen.add(f.id);
                    const t = byId[f.id];
                    if (!t) return { id:f.id, name:`${f.sectionLabel} ${f.sectionTitle||f.name||''}`.trim(), state:'added', then:null, now:f.revision||'0' };
                    const tHead = headRevision(t), nHead = headRevision(f);
                    // Compare identity, not label: a hand-edited label must not read as a change.
                    const changed = (tHead&&nHead) ? tHead.revId !== nHead.revId : (t.blobKey !== f.blobKey);
                    return { id:f.id, name:`${f.sectionLabel} ${f.sectionTitle||f.name||''}`.trim(),
                        state: changed?'changed':'same', then: t.revision||'0', now: f.revision||'0' };
                });
                then.forEach(t=>{ if(!seen.has(t.id)) rows.push({ id:t.id, name:t.sectionTitle||t.name||'Removed section', state:'removed', then:t.revision||'0', now:null }); });
                return rows;
            };

            const STATE = {
                same:    { label:'unchanged', color:'text-slate-400' },
                changed: { label:'revised since', color:'text-amber-700 font-semibold' },
                added:   { label:'added since', color:'text-emerald-700 font-semibold' },
                removed: { label:'removed since', color:'text-red-600 font-semibold' },
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-slate-50 rounded-xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col" onClick={e=>e.stopPropagation()}>
                        <div className="flex-none px-5 py-3 border-b border-slate-200 bg-white rounded-t-xl flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <Tag className="w-5 h-5 text-brand-blue"/>
                                <div>
                                    <h2 className="text-base font-bold text-slate-800">Issues</h2>
                                    <p className="text-[11px] text-slate-500">{list.length} stamped · pins every section at its current revision</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-1 hover:bg-slate-100 rounded text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {/* Stamp */}
                            <div className="bg-white border border-slate-200 rounded-lg p-3">
                                <p className="text-[11px] font-bold uppercase tracking-wide text-slate-400 mb-2">Stamp the package as it stands</p>
                                <div className="flex gap-1.5 flex-wrap mb-2">
                                    {ISSUE_PRESETS.map(x=>(
                                        <button key={x} onClick={()=>setName(x)} className={`px-2 py-1 text-[11px] font-semibold rounded border transition-colors ${name===x?'border-brand-blue bg-brand-blue-pl text-brand-blue':'border-slate-200 text-slate-500 hover:border-slate-300'}`}>{x}</button>
                                    ))}
                                </div>
                                <div className="flex gap-2">
                                    <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Issue name" className="w-48 border border-slate-300 rounded-md px-2 py-1.5 text-sm outline-none focus:border-brand-blue"/>
                                    <input type="text" value={note} onChange={e=>setNote(e.target.value)} placeholder="Note (optional)" className="flex-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm outline-none focus:border-brand-blue"/>
                                    <button onClick={()=>{ if(!name.trim())return; onStamp(name.trim(), note.trim()); setName(''); setNote(''); }}
                                        disabled={!name.trim()||busy}
                                        className="px-3 py-1.5 text-xs font-bold text-white rounded-md shrink-0 disabled:opacity-40" style={{backgroundColor:'var(--brand-blue)'}}>
                                        {busy?'Stamping…':'Stamp issue'}
                                    </button>
                                </div>
                                <p className="text-[10px] text-slate-400 mt-1.5">No PDFs are copied — the issue points at the revisions already stored, so stamping costs nothing.</p>
                            </div>

                            {/* Issue list */}
                            {list.length===0 ? (
                                <div className="text-center py-10 text-slate-400">
                                    <Tag className="w-9 h-9 mx-auto mb-2 opacity-30"/>
                                    <p className="text-sm">No issues stamped yet</p>
                                    <p className="text-xs opacity-70 mt-1">Stamp one when the package goes out, so you can always see exactly what was sent.</p>
                                </div>
                            ) : list.map(iss=>{
                                const rows = compare(iss), open = openId===iss.id;
                                const moved = rows.filter(r=>r.state!=='same').length;
                                const d = new Date(iss.ts);
                                return (
                                    <div key={iss.id} className="bg-white border border-slate-200 rounded-lg overflow-hidden">
                                        <div className="px-3 py-2.5 flex items-center gap-2">
                                            <button onClick={()=>setOpenId(open?null:iss.id)} className="flex-1 min-w-0 text-left">
                                                <p className="text-sm font-bold text-slate-800 flex items-center gap-2">
                                                    <Tag className="w-3.5 h-3.5 text-brand-blue shrink-0"/>{iss.name}
                                                    <span className="text-[10px] font-normal text-slate-400">{d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}</span>
                                                </p>
                                                <p className="text-[11px] text-slate-500 mt-0.5">
                                                    {(iss.record?.files||[]).filter(f=>!f.isHeader).length} sections · stamped by {iss.actor?.name||'—'}
                                                    {moved>0 ? <span className="text-amber-700 font-semibold"> · {moved} changed since</span> : <span className="text-green-700 font-semibold"> · matches the package today</span>}
                                                    {(()=>{ const n=(binderMarkups||[]).filter(m=>m&&(m.issueId===iss.id||(m.issueId==null&&m.projectVersion===iss.version))).length;
                                                        return n>0 ? <span className="text-orange-600 font-semibold"> · {n} review markup{n!==1?'s':''}</span> : null; })()}
                                                </p>
                                                {iss.note && <p className="text-[11px] text-slate-500 italic mt-0.5">“{iss.note}”</p>}
                                            </button>
                                            <button onClick={()=>setOpenId(open?null:iss.id)} className="p-1 text-slate-400 hover:text-slate-600 shrink-0">{open?<ChevronUp className="w-4 h-4"/>:<ChevronDown className="w-4 h-4"/>}</button>
                                            <button onClick={()=>setConfirmDel(confirmDel===iss.id?null:iss.id)} title="Remove this issue" className="p-1 text-slate-300 hover:text-red-500 shrink-0"><Trash2 className="w-4 h-4"/></button>
                                        </div>
                                        {confirmDel===iss.id && (
                                            <div className="px-3 py-2 bg-red-50 border-t border-red-200 flex items-center gap-2">
                                                <AlertTriangle className="w-3.5 h-3.5 text-red-500 shrink-0"/>
                                                <p className="text-[11px] text-red-700 flex-1">Remove “{iss.name}”? Any superseded PDF held only by this issue is released at the next cleanup.</p>
                                                <button onClick={()=>{onDelete(iss.id);setConfirmDel(null);}} className="px-2 py-1 text-[10px] font-bold text-white bg-red-500 hover:bg-red-600 rounded shrink-0">Remove</button>
                                                <button onClick={()=>setConfirmDel(null)} className="px-2 py-1 text-[10px] text-slate-500 hover:bg-slate-100 rounded shrink-0">Cancel</button>
                                            </div>
                                        )}
                                        {open && (
                                            <div className="border-t border-slate-100">
                                                <table className="w-full text-xs">
                                                    <thead className="bg-slate-50 text-slate-400 text-[10px] uppercase tracking-wide">
                                                        <tr>
                                                            <th className="text-left font-semibold px-3 py-1.5">Section</th>
                                                            <th className="text-left font-semibold px-2 py-1.5 w-20">At issue</th>
                                                            <th className="text-left font-semibold px-2 py-1.5 w-20">Now</th>
                                                            <th className="text-left font-semibold px-2 py-1.5 w-32"></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {rows.map(r=>(
                                                            <tr key={r.id} className="border-t border-slate-100">
                                                                <td className="px-3 py-1.5 text-slate-700">{r.name}</td>
                                                                <td className="px-2 py-1.5 font-mono text-slate-500">{r.then==null?'—':`Rev ${r.then}`}</td>
                                                                <td className="px-2 py-1.5 font-mono text-slate-500">{r.now==null?'—':`Rev ${r.now}`}</td>
                                                                <td className={`px-2 py-1.5 ${STATE[r.state].color}`}>{STATE[r.state].label}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        <div className="flex-none px-5 py-2.5 border-t border-slate-200 bg-white rounded-b-xl flex items-center justify-between">
                            <p className="text-[10px] text-slate-400">Issues never change. Keep working — the stamp still points at what went out.</p>
                            <button onClick={onClose} className="px-4 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-md">Close</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ── STAGE 4 · QC DASHBOARD ──────────────────────────────────────────────
        // One screen that answers "where is this package stuck?". Everything here is
        // derived — the dashboard never owns state, it only reads sections + QC items
        // and offers the same manual actions you'd take on the section row.
        const DAY = 86400000;
        const daysSince = (iso) => { if(!iso) return null; const d=(Date.now()-new Date(iso).getTime())/DAY; return isNaN(d)?null:Math.floor(d); };

        const QcDashboardModal = ({ sections, comments, onClose, onJumpSection, onSetStatus }) => {
            const [statusFilter, setStatusFilter] = useState('all');
            const [onlyOpen, setOnlyOpen] = useState(false);

            // Per-section rollup. A QC item counts as "open" until it is closed —
            // resolved-but-not-backchecked is still somebody's problem.
            const rows = useMemo(()=> sections.filter(f=>!f.isHeader).map(f=>{
                const items = comments[f.id] || [];
                const qc = items.filter(c=>c.kind==='qc');
                const open = qc.filter(c=>c.status!=='closed');
                const head = headRevision(f);
                const stale = open.filter(c=>c.revId && head && head.revId!==c.revId);
                const worst = ['hold','major','minor','comment'].find(sv=>open.some(c=>c.severity===sv)) || null;
                return { f, items, qc, open, stale, worst,
                    notes: items.filter(c=>c.kind!=='qc').length,
                    versions: (f.revisions||[]).length,
                    idle: daysSince(f.lastModifiedAt),
                    hasPdf: !!(f.blobKey || f.fileObj || f.downloadURL) };
            }), [sections, comments]);

            const total = rows.length;
            const counts = {};
            STATUS_OPTIONS.forEach(o=>counts[o.value]=0);
            rows.forEach(r=>{ const v=r.f.status||'draft'; counts[v]=(counts[v]||0)+1; });
            const ladder = VISIBLE_STATUS_OPTIONS.filter(o=>counts[o.value]>0 || o.value==='draft' || o.value==='approved' || statusFilter===o.value);

            const allOpen   = rows.reduce((n,r)=>n+r.open.length,0);
            const allStale  = rows.reduce((n,r)=>n+r.stale.length,0);
            const holds     = rows.reduce((n,r)=>n+r.open.filter(c=>c.severity==='hold'||c.severity==='major').length,0);
            const checked   = rows.filter(r=>!!r.f.checkedBy).length;
            const qcSigned  = rows.filter(r=>!!r.f.qcReviewBy).length;
            const approved  = rows.filter(r=>(r.f.status||'draft')==='approved').length;
            const pct = (n) => total ? Math.round((n/total)*100) : 0;

            // ── Nudges. Each one is a specific, actionable discrepancy — never a
            // generic "review this". Warnings are contradictions; info is just a
            // suggestion about what to do next.
            const nudges = [];
            rows.forEach(r=>{
                const st = r.f.status||'draft', nm = `${r.f.sectionLabel} ${r.f.sectionTitle||r.f.name||''}`.trim();
                if (!r.hasPdf)
                    nudges.push({ sid:r.f.id, id:r.f.id+'-nopdf', level:'warn', name:nm, text:'No PDF attached yet.' });
                if (r.stale.length)
                    nudges.push({ sid:r.f.id, id:r.f.id+'-stale', level:'warn', name:nm, text:`${r.stale.length} open QC item${r.stale.length>1?'s were':' was'} raised against an earlier revision. Confirm ${r.stale.length>1?'they':'it'} still applies.` });
                if ((st==='backchecked'||st==='approved') && r.open.length)
                    nudges.push({ sid:r.f.id, id:r.f.id+'-openafter', level:'warn', name:nm, text:`Marked ${getStatusStyle(st).label} with ${r.open.length} QC item${r.open.length>1?'s':''} still open.` });
                if (st==='approved' && !r.f.checkedBy)
                    nudges.push({ sid:r.f.id, id:r.f.id+'-nochecker', level:'warn', name:nm, text:'Approved, but no checker is recorded.' });
                if (st==='commented' && r.qc.length && !r.open.length)
                    nudges.push({ sid:r.f.id, id:r.f.id+'-allres', level:'info', name:nm, text:'All QC items are closed — ready to move to Revised or Backchecked.', to:'revised' });
                if (st==='revised' && !r.open.length && r.qc.length)
                    nudges.push({ sid:r.f.id, id:r.f.id+'-ready', level:'info', name:nm, text:'Revised with nothing open — ready for backcheck.', to:'backchecked' });
                if (st==='for-check' && !r.items.length && r.idle!=null && r.idle>=7)
                    nudges.push({ sid:r.f.id, id:r.f.id+'-quiet', level:'info', name:nm, text:`Out for check ${r.idle} days with no comments logged yet.` });
                if (st!=='approved' && r.idle!=null && r.idle>=21)
                    nudges.push({ sid:r.f.id, id:r.f.id+'-idle', level:'info', name:nm, text:`No activity for ${r.idle} days.` });
            });
            const warns = nudges.filter(n=>n.level==='warn'), infos = nudges.filter(n=>n.level==='info');

            const shown = rows.filter(r=>
                (statusFilter==='all' || (r.f.status||'draft')===statusFilter) &&
                (!onlyOpen || r.open.length>0));

            const Stat = ({ label, value, sub, tone }) => (
                <div className={`flex-1 min-w-[110px] rounded-lg border px-3 py-2 ${tone||'bg-white border-slate-200'}`}>
                    <p className="text-[10px] font-semibold uppercase tracking-wide text-slate-400">{label}</p>
                    <p className="text-xl font-bold text-slate-800 leading-tight">{value}</p>
                    {sub && <p className="text-[10px] text-slate-500">{sub}</p>}
                </div>
            );

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-slate-50 rounded-xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col" onClick={e=>e.stopPropagation()}>
                        <div className="flex-none px-5 py-3 border-b border-slate-200 bg-white rounded-t-xl flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <ClipboardList className="w-5 h-5 text-brand-blue"/>
                                <div>
                                    <h2 className="text-base font-bold text-slate-800">QC Dashboard</h2>
                                    <p className="text-[11px] text-slate-500">{total} section{total!==1?'s':''} · {allOpen} open QC item{allOpen!==1?'s':''}{allStale>0&&<span className="text-amber-600 font-semibold"> · {allStale} stale</span>}</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-1 hover:bg-slate-100 rounded text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {/* Headline numbers */}
                            <div className="flex gap-2 flex-wrap">
                                <Stat label="Approved" value={`${approved}/${total}`} sub={`${pct(approved)}% of the package`} tone={approved===total&&total>0?'bg-green-50 border-green-200':null}/>
